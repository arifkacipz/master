<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles Pro - Rhythm Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0f0e;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }
        .game-ui {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            margin: 0 16px 20px 16px;
            z-index: 20;
            gap: 12px;
            flex-wrap: wrap;
            pointer-events: auto;
        }
        .score-card {
            background: #000000aa;
            padding: 6px 20px;
            border-radius: 40px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.4rem;
            font-family: monospace;
        }
        .mode-group {
            display: flex;
            gap: 8px;
            background: #1e2a2a88;
            padding: 4px 12px;
            border-radius: 60px;
        }
        .mode-btn {
            background: #2c3e2e;
            border: none;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: white;
            transition: 0.1s;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #ffb347;
            color: #1e2a1f;
            box-shadow: 0 0 8px #ffb347aa;
        }
        .reset-btn {
            background: #ff5e5e;
            border: none;
            font-weight: bold;
            padding: 6px 24px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: white;
            cursor: pointer;
        }
        .playlist-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 12px 20px;
            z-index: 20;
            color: white;
            font-size: 14px;
            min-width: 160px;
            text-align: right;
            pointer-events: auto;
        }
        .playlist-title {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9rem;
            border-bottom: 1px solid #ffb347;
            display: inline-block;
        }
        .song-list {
            list-style: none;
            margin-top: 6px;
            max-height: 300px;
            overflow-y: auto;
        }
        .song-item {
            padding: 6px 12px;
            margin: 4px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.1s;
            text-align: left;
            font-size: 0.8rem;
        }
        .song-item.active {
            background: #ffb347;
            color: #1e2a1f;
            font-weight: bold;
        }
        .song-item:hover {
            background: #ffb34766;
        }
        .info-tap {
            position: fixed;
            bottom: 90px;
            left: 20px;
            background: #00000066;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            color: #ccc;
            pointer-events: none;
            z-index: 20;
        }
        @media (max-width: 550px) {
            .score-card { font-size: 1rem; padding: 4px 14px; }
            .mode-btn { padding: 4px 12px; font-size: 0.7rem; }
            .reset-btn { padding: 4px 16px; font-size: 0.75rem; }
            .playlist-panel { top: 10px; right: 10px; padding: 8px 14px; min-width: 130px; }
            .song-item { padding: 4px 8px; font-size: 0.7rem; }
            .info-tap { bottom: 80px; font-size: 8px; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="game-ui">
        <div class="score-card">
            🎵 SCORE: <span id="scoreValue">0</span>
        </div>
        <div class="mode-group">
            <button id="easyModeBtn" class="mode-btn active">🍃 EASY</button>
            <button id="hardModeBtn" class="mode-btn">⚡ HARD</button>
        </div>
        <button id="resetButton" class="reset-btn">⟳ RESTART</button>
    </div>
    <div class="playlist-panel">
        <div class="playlist-title">🎧 DAFTAR LAGU</div>
        <ul class="song-list" id="songList">
            <li style="padding: 8px; text-align: center;">Memuat...</li>
        </ul>
    </div>
    <div class="info-tap">
        ✨ 2 jari untuk 2 tile | ➖ Tile panjang: tahan
    </div>

<script>
    (function(){
        // ---------- KONFIGURASI ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreValue');
        
        let canvasWidth, canvasHeight;
        let TILE_W, TILE_H;
        
        // ---------- GAME STATE ----------
        let tiles = [];
        let nextTileId = 1;
        let score = 0;
        let currentMode = 'easy';
        let gameActive = true;
        let lastFrameTime = null;
        
        let scrollSpeedPercent = 0.22;
        let pattern = [];
        let patternIndex = 0;
        
        // ---------- AUDIO & SONG ----------
        let audioContext = null;
        let currentSource = null;
        let currentSong = null;
        let songsList = [];
        let songStartTime = 0;
        let isPlaying = false;
        let isLoading = false;
        
        // ---------- MULTI-TOUCH ----------
        let activeTouches = new Map();
        
        // ---------- FUNGSI UTAMA ----------
        function updateCanvasSize() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            TILE_W = canvasWidth / 4;
            TILE_H = Math.min(TILE_W * 0.9, canvasHeight * 0.2);
        }
        
        function updateScoreUI() {
            scoreSpan.innerText = score;
        }
        
        // ---------- LOAD DATA ----------
        async function loadSongsList() {
            try {
                const response = await fetch('../game/playlist.json');
                if (!response.ok) throw new Error('playlist.json not found');
                const songs = await response.json();
                songsList = songs;
                renderSongList();
                if (songsList.length > 0 && !currentSong) {
                    selectSong(songsList[0]);
                }
            } catch(e) {
                console.error('Gagal memuat playlist.json:', e);
                document.getElementById('songList').innerHTML = '<li style="padding:8px; text-align:center;">Gagal memuat daftar lagu</li>';
            }
        }
        
        function renderSongList() {
            const listEl = document.getElementById('songList');
            listEl.innerHTML = '';
            songsList.forEach(song => {
                const li = document.createElement('li');
                li.className = 'song-item';
                if (currentSong && currentSong.id === song.id) li.classList.add('active');
                li.textContent = song.name || song.id;
                li.onclick = () => selectSong(song);
                listEl.appendChild(li);
            });
        }
        
        async function loadPattern(songId, mode) {
            const filename = `${songId}_${mode}.json`;
            const url = `../game/db/${filename}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Pattern ${filename} not found`);
                return await response.json();
            } catch(e) {
                console.warn(`Pola ${filename} tidak ditemukan, menggunakan kosong.`);
                return [];
            }
        }
        
        async function selectSong(song) {
            if (isLoading) return;
            isLoading = true;
            stopAudio();
            currentSong = song;
            pattern = await loadPattern(song.id, currentMode);
            patternIndex = 0;
            resetGameState();
            renderSongList();
            await loadAndPlayAudio(song.url);
            isLoading = false;
        }
        
        async function loadAndPlayAudio(url) {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            let fullUrl = url;
            if (!url.startsWith('http')) {
                fullUrl = './sg/' + url;
            }
            try {
                const response = await fetch(fullUrl);
                if (!response.ok) throw new Error(`Failed to fetch audio: ${fullUrl}`);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                source.onended = () => {
                    isPlaying = false;
                    gameActive = false;
                };
                source.start(0);
                currentSource = source;
                songStartTime = audioContext.currentTime;
                isPlaying = true;
                gameActive = true;
                patternIndex = 0;
            } catch(e) {
                console.error('Gagal memutar lagu:', e);
                isPlaying = false;
                gameActive = false;
            }
        }
        
        function stopAudio() {
            if (currentSource) {
                try { currentSource.stop(); } catch(e) {}
                currentSource = null;
            }
            isPlaying = false;
            gameActive = false;
        }
        
        function resetGameState() {
            tiles = [];
            score = 0;
            updateScoreUI();
            patternIndex = 0;
            activeTouches.clear();
            scrollSpeedPercent = currentMode === 'hard' ? 0.32 : 0.22;
        }
        
        // ---------- UPDATE GAME ----------
        function updateSpawn(currentTime) {
            if (!isPlaying || !gameActive) return;
            while (patternIndex < pattern.length && pattern[patternIndex].time <= currentTime) {
                const ev = pattern[patternIndex];
                tiles.push({
                    id: nextTileId++,
                    col: ev.col,
                    y: -TILE_H,
                    duration: ev.duration,
                    isHolding: false,
                    pressed: false,
                    holdStartTime: 0
                });
                patternIndex++;
            }
        }
        
        function updateTiles(deltaSec) {
            if (!isPlaying || !gameActive) return;
            const moveDist = scrollSpeedPercent * canvasHeight * deltaSec;
            for (let t of tiles) t.y += moveDist;
            // Check miss
            const newTiles = [];
            for (let t of tiles) {
                if (t.y + TILE_H >= canvasHeight) {
                    if (!t.pressed && !t.isHolding) {
                        score = Math.max(0, score - 5);
                        updateScoreUI();
                    }
                } else {
                    newTiles.push(t);
                }
            }
            tiles = newTiles;
        }
        
        // ---------- HANDLE TAP ----------
        function handleTapStart(e) {
            if (!gameActive || !isPlaying) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const touches = e.touches ? e.touches : [e];
            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const pointerId = touch.identifier !== undefined ? touch.identifier : 'mouse';
                if (activeTouches.has(pointerId)) continue;
                let canvasX = (touch.clientX - rect.left) * scaleX;
                let canvasY = (touch.clientY - rect.top) * scaleY;
                if (canvasX < 0 || canvasX > canvas.width) continue;
                const col = Math.floor(canvasX / TILE_W);
                if (col < 0 || col > 3) continue;
                // cari tile paling bawah di kolom
                let bottomTile = null;
                let maxY = -Infinity;
                for (let t of tiles) {
                    if (t.col === col && !t.pressed && !t.isHolding && t.y + TILE_H > 0 && t.y > maxY) {
                        maxY = t.y;
                        bottomTile = t;
                    }
                }
                if (!bottomTile) continue;
                if (canvasY >= bottomTile.y && canvasY <= bottomTile.y + TILE_H) {
                    if (bottomTile.duration > 0) {
                        bottomTile.isHolding = true;
                        bottomTile.holdStartTime = performance.now() / 1000;
                        bottomTile.pressed = true;
                        activeTouches.set(pointerId, { tileId: bottomTile.id });
                        playPianoNote(bottomTile.col);
                    } else {
                        bottomTile.pressed = true;
                        score += 10;
                        updateScoreUI();
                        playPianoNote(bottomTile.col);
                        const idx = tiles.indexOf(bottomTile);
                        if (idx !== -1) tiles.splice(idx, 1);
                    }
                }
            }
        }
        
        function handleTapEnd(e) {
            if (!gameActive || !isPlaying) return;
            e.preventDefault();
            const touches = e.touches ? e.touches : [];
            if (!e.touches) {
                const pointerId = 'mouse';
                if (activeTouches.has(pointerId)) {
                    const data = activeTouches.get(pointerId);
                    for (let t of tiles) {
                        if (t.id === data.tileId && t.isHolding) {
                            const holdDuration = (performance.now() / 1000) - t.holdStartTime;
                            if (holdDuration >= t.duration - 0.05) {
                                score += 10;
                            } else {
                                score = Math.max(0, score - 5);
                            }
                            updateScoreUI();
                            const idx = tiles.indexOf(t);
                            if (idx !== -1) tiles.splice(idx, 1);
                            break;
                        }
                    }
                    activeTouches.delete(pointerId);
                }
                return;
            }
            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const pointerId = touch.identifier;
                if (activeTouches.has(pointerId)) {
                    const data = activeTouches.get(pointerId);
                    for (let t of tiles) {
                        if (t.id === data.tileId && t.isHolding) {
                            const holdDuration = (performance.now() / 1000) - t.holdStartTime;
                            if (holdDuration >= t.duration - 0.05) {
                                score += 10;
                            } else {
                                score = Math.max(0, score - 5);
                            }
                            updateScoreUI();
                            const idx = tiles.indexOf(t);
                            if (idx !== -1) tiles.splice(idx, 1);
                            break;
                        }
                    }
                    activeTouches.delete(pointerId);
                }
            }
        }
        
        function playPianoNote(col) {
            if (!audioContext) return;
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const freqs = [523.25, 587.33, 659.25, 698.46];
            osc.frequency.value = freqs[col % freqs.length];
            osc.type = 'triangle';
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(now + 0.6);
        }
        
        // ---------- RENDER ----------
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f1f1c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#3e6b5c";
            ctx.lineWidth = 2;
            for (let i = 1; i <= 3; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TILE_W, 0);
                ctx.lineTo(i * TILE_W, canvas.height);
                ctx.stroke();
            }
            for (let t of tiles) {
                const x = t.col * TILE_W;
                const y = t.y;
                const grad = ctx.createLinearGradient(x, y, x+10, y+TILE_H);
                grad.addColorStop(0, "#1e1e2f");
                grad.addColorStop(1, "#2d2d44");
                ctx.fillStyle = grad;
                ctx.fillRect(x, y, TILE_W-1, TILE_H-1);
                ctx.fillStyle = "#4a4e69";
                ctx.fillRect(x+3, y+3, TILE_W-7, TILE_H-7);
                if (t.duration > 0) {
                    ctx.fillStyle = "#ff6b6b";
                    ctx.fillRect(x+5, y+5, TILE_W-11, 5);
                }
            }
            ctx.font = `bold ${Math.max(14, canvasWidth/30)}px 'Segoe UI'`;
            ctx.fillStyle = "#e0ffe0";
            ctx.fillText(`${currentMode.toUpperCase()} | ${Math.round(scrollSpeedPercent*canvasHeight)} px/s`, 12, 40);
            if (!isPlaying && !isLoading && currentSong) {
                ctx.fillStyle = "#ffaa88";
                ctx.font = "20px sans-serif";
                ctx.fillText("Tekan lagu untuk mulai", canvasWidth/2-120, canvasHeight/2);
            }
        }
        
        // ---------- GAME LOOP ----------
        let lastTimestamp = null;
        function gameLoop(nowMs) {
            if (!lastTimestamp) {
                lastTimestamp = nowMs;
                requestAnimationFrame(gameLoop);
                return;
            }
            let delta = Math.min(0.033, (nowMs - lastTimestamp) / 1000);
            if (delta > 0) {
                let currentTime = 0;
                if (isPlaying && audioContext) {
                    currentTime = audioContext.currentTime - songStartTime;
                }
                updateSpawn(currentTime);
                updateTiles(delta);
                draw();
            }
            lastTimestamp = nowMs;
            requestAnimationFrame(gameLoop);
        }
        
        // ---------- MODE & RESET ----------
        async function setMode(mode) {
            currentMode = mode;
            scrollSpeedPercent = mode === 'hard' ? 0.32 : 0.22;
            document.getElementById('easyModeBtn').classList.toggle('active', mode === 'easy');
            document.getElementById('hardModeBtn').classList.toggle('active', mode === 'hard');
            if (currentSong) {
                pattern = await loadPattern(currentSong.id, currentMode);
                patternIndex = 0;
                resetGameState();
                if (isPlaying) {
                    stopAudio();
                    await loadAndPlayAudio(currentSong.url);
                }
            }
        }
        
        function resetGame() {
            if (currentSong) {
                stopAudio();
                resetGameState();
                patternIndex = 0;
                loadAndPlayAudio(currentSong.url);
            }
        }
        
        // ---------- INIT ----------
        function attachEvents() {
            window.addEventListener('resize', () => {
                updateCanvasSize();
                resetGameState();
            });
            canvas.addEventListener('mousedown', handleTapStart);
            canvas.addEventListener('mouseup', handleTapEnd);
            canvas.addEventListener('touchstart', handleTapStart, { passive: false });
            canvas.addEventListener('touchend', handleTapEnd, { passive: false });
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            document.getElementById('easyModeBtn').addEventListener('click', () => setMode('easy'));
            document.getElementById('hardModeBtn').addEventListener('click', () => setMode('hard'));
            document.getElementById('resetButton').addEventListener('click', () => resetGame());
        }
        
        async function init() {
            updateCanvasSize();
            attachEvents();
            await loadSongsList();
            gameLoop();
            canvas.addEventListener('click', () => {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            }, { once: true });
        }
        init();
    })();
</script>
</body>
</html>
