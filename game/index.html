<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Piano Tiles: Rhythm Mode</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #0a1f1e 0%, #05100f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-wrapper {
            background: #1e2a2a;
            border-radius: 56px;
            padding: 20px 24px 24px 24px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 28px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .score-card {
            background: #000000aa;
            backdrop-filter: blur(6px);
            padding: 8px 24px;
            border-radius: 60px;
            color: #f5e56b;
            font-weight: bold;
            font-size: 1.7rem;
            letter-spacing: 2px;
            font-family: monospace;
            box-shadow: inset 0 1px 2px #ffffff30, 0 4px 8px #00000040;
        }

        .mode-selector {
            display: flex;
            gap: 12px;
            background: #0f1919cc;
            padding: 5px 15px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }

        .mode-btn {
            background: #2c3e2e;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.1s linear;
            font-family: inherit;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .mode-btn.active {
            background: #ffb347;
            color: #1e2a1f;
            box-shadow: 0 0 8px #ffb347aa;
        }

        .reset-btn {
            background: #ff5e5e;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 6px 24px;
            border-radius: 40px;
            cursor: pointer;
            color: white;
            transition: 0.1s;
            font-family: inherit;
            box-shadow: 0 3px 0 #992222;
        }

        .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #992222;
        }

        .mode-btn:active {
            transform: translateY(2px);
        }

        .status-text {
            background: #00000077;
            padding: 5px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #bbffcc;
            font-weight: bold;
        }

        @media (max-width: 550px) {
            .score-card { font-size: 1.2rem; padding: 5px 18px; }
            .mode-btn { padding: 4px 12px; font-size: 0.8rem; }
            .reset-btn { padding: 4px 16px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="info-panel">
            <div class="score-card">
                🎹 SCORE: <span id="scoreValue">0</span>
            </div>
            <div class="mode-selector">
                <button id="easyModeBtn" class="mode-btn active">🍃 EASY</button>
                <button id="hardModeBtn" class="mode-btn">⚡ HARD</button>
            </div>
            <button id="resetButton" class="reset-btn">⟳ RESTART</button>
        </div>
        <div class="status-text">
            ⚫ Tekan tile hitam tepat waktu | ❌ Miss = -5 poin | 🎵 Suara piano setiap tile
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- KONFIGURASI CANVAS ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreValue');

        // Ukuran tile
        const TILE_W = canvas.width / 4;   // 100px
        const TILE_H = 80;

        // ---------- GAME STATE ----------
        let tiles = [];            // { col, y, pressed }
        let score = 0;
        let currentMode = 'easy';  // 'easy' or 'hard'
        let gameActive = true;      // selalu true (tidak ada game over)
        let animationId = null;
        let lastTimestamp = 0;

        // Parameter kecepatan & spawn
        let scrollSpeed = 150;       // px/detik (easy awal)
        let baseSpawnDelay = 0.65;   // detik antar tile (easy)
        let currentSpawnDelay = baseSpawnDelay;
        let timeSinceLastSpawn = 0;

        // ---------- POLA TETAP (urutan kolom) ----------
        // Pola ini bisa diubah sesuai lagu. Kita buat pola yang cukup panjang dan bervariasi.
        // Pola di bawah meniru melodi sederhana (nada naik turun)
        const fixedPattern = [
            0,1,2,3,  2,1,0,1,  2,3,2,1,  0,2,1,3,
            0,0,1,1,  2,2,3,3,  3,2,1,0,  1,2,3,0,
            0,2,1,3,  2,0,3,1,  1,0,2,3,  3,1,0,2,
            0,1,0,2,  1,2,1,3,  2,3,2,0,  3,0,1,2,
            // tambahan agar loop menarik
            0,0,1,2,  3,2,1,0,  0,2,1,3,  2,1,0,3,
            1,2,3,0,  2,0,3,1,  1,3,0,2,  3,0,2,1
        ];  // total 128 tile, bisa diulang
        
        let patternIndex = 0;        // indeks pola berikutnya yang akan di-spawn
        
        // Fungsi mengambil kolom berikutnya dari pola (loop)
        function getNextTileCol() {
            const col = fixedPattern[patternIndex % fixedPattern.length];
            patternIndex++;
            return col;
        }
        
        // Reset pola index saat restart
        function resetPatternIndex() {
            patternIndex = 0;
        }
        
        // ---------- AUDIO (Web Audio API) ----------
        let audioCtx = null;
        let isAudioReady = false;
        
        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                isAudioReady = true;
            } catch(e) { console.warn("Web Audio tidak didukung"); }
        }
        
        // Mainkan nada piano berdasarkan kolom (4 nada berbeda)
        function playPianoNote(col) {
            if (!audioCtx || !isAudioReady) return;
            // Resume context jika suspended (karena kebijakan browser)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const now = audioCtx.currentTime;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            // frekuensi: C5, D5, E5, F5 untuk kolom 0,1,2,3
            const freqs = [523.25, 587.33, 659.25, 698.46];
            oscillator.frequency.value = freqs[col % freqs.length];
            oscillator.type = 'triangle'; // suara lembut seperti piano sederhana
            
            gainNode.gain.setValueAtTime(0.25, now);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(now + 0.6);
        }
        
        // ---------- MECHANICS ----------
        function updateScoreUI() {
            scoreSpan.innerText = score;
        }
        
        // Spawn tile baru berdasarkan pola
        function spawnTile() {
            if (!gameActive) return;
            const col = getNextTileCol();
            tiles.push({
                col: col,
                y: -TILE_H,
                pressed: false
            });
        }
        
        // Reset semua state
        function resetGame() {
            gameActive = true;
            score = 0;
            tiles = [];
            updateScoreUI();
            resetPatternIndex();
            timeSinceLastSpawn = 0;
            
            // set parameter berdasarkan mode
            if (currentMode === 'easy') {
                scrollSpeed = 150;
                currentSpawnDelay = 0.65;
            } else {
                scrollSpeed = 170;
                currentSpawnDelay = 0.6;
            }
            
            // spawn 2 tile awal agar tidak kosong
            for(let i = 0; i < 2; i++) {
                spawnTile();
            }
        }
        
        // Proses klik / tap
        function handleTap(e) {
            if (!gameActive) return;
            
            // dapatkan posisi klik relatif canvas
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            
            if (canvasX < 0 || canvasX > canvas.width) return;
            const colClicked = Math.floor(canvasX / TILE_W);
            if (colClicked < 0 || colClicked > 3) return;
            
            // cari tile paling bawah di kolom tersebut (belum ditekan)
            let bottomTile = null;
            let maxY = -Infinity;
            for(let i = 0; i < tiles.length; i++) {
                const t = tiles[i];
                if(t.col === colClicked && !t.pressed && t.y + TILE_H > 0) {
                    if(t.y > maxY) {
                        maxY = t.y;
                        bottomTile = t;
                    }
                }
            }
            if(!bottomTile) return;
            
            // cek apakah klik berada dalam area tile itu
            const tileTop = bottomTile.y;
            const tileBottom = bottomTile.y + TILE_H;
            if(canvasY >= tileTop && canvasY <= tileBottom) {
                // tile berhasil ditekan
                bottomTile.pressed = true;
                score += 10;
                updateScoreUI();
                playPianoNote(bottomTile.col);
                // hapus tile segera agar tidak dihitung miss lagi
                const index = tiles.indexOf(bottomTile);
                if(index !== -1) tiles.splice(index, 1);
            }
        }
        
        // Update logika setiap frame
        function updateGame(deltaSec) {
            if (!gameActive) return;
            
            // 1. gerakkan semua tile ke bawah
            for(let i = 0; i < tiles.length; i++) {
                tiles[i].y += scrollSpeed * deltaSec;
            }
            
            // 2. cek tile yang melewati batas bawah (miss)
            let missedTiles = [];
            for(let i = 0; i < tiles.length; i++) {
                const t = tiles[i];
                if(t.y + TILE_H >= canvas.height) {
                    // tile mencapai bawah
                    if(!t.pressed) {
                        // MISS: kurangi skor
                        score = Math.max(0, score - 5);  // tidak negatif
                        updateScoreUI();
                        // efek miss tidak memainkan nada
                    }
                    missedTiles.push(t);
                }
            }
            // hapus semua tile yang sudah melewati batas (baik pressed maupun tidak)
            tiles = tiles.filter(t => t.y + TILE_H < canvas.height);
            
            // 3. spawn tile berdasarkan pola dan waktu
            if(gameActive) {
                timeSinceLastSpawn += deltaSec;
                while(timeSinceLastSpawn >= currentSpawnDelay) {
                    spawnTile();
                    timeSinceLastSpawn -= currentSpawnDelay;
                }
            }
            
            // 4. Dynamic scaling untuk HARD MODE (kecepatan meningkat seiring skor)
            if(currentMode === 'hard') {
                // kecepatan scroll bertambah setiap 100 poin
                let bonusSpeed = Math.floor(score / 100) * 18;
                scrollSpeed = Math.min(380, 170 + bonusSpeed);
                // spawn delay makin cepat seiring skor (tapi tidak kurang dari 0.28 detik)
                let reduction = Math.floor(score / 150) * 0.04;
                currentSpawnDelay = Math.max(0.28, 0.6 - reduction);
            } else {
                // easy mode: kecepatan & spawn tetap
                scrollSpeed = 150;
                currentSpawnDelay = 0.65;
            }
        }
        
        // ---------- RENDER ----------
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // latar & garis grid
            ctx.fillStyle = "#1e2f2c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#3c6e5c";
            ctx.lineWidth = 2;
            for(let i = 1; i <= 3; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TILE_W, 0);
                ctx.lineTo(i * TILE_W, canvas.height);
                ctx.stroke();
            }
            
            // gambar semua tile (semua hitam)
            for(let t of tiles) {
                const x = t.col * TILE_W;
                const y = t.y;
                // efek gradasi tile hitam
                const grad = ctx.createLinearGradient(x, y, x+10, y+TILE_H);
                grad.addColorStop(0, "#22223b");
                grad.addColorStop(1, "#2d2d44");
                ctx.fillStyle = grad;
                ctx.shadowBlur = 3;
                ctx.shadowColor = "rgba(0,0,0,0.4)";
                ctx.fillRect(x, y, TILE_W-1, TILE_H-1);
                ctx.fillStyle = "#4a4e69";
                ctx.fillRect(x+3, y+3, TILE_W-7, TILE_H-7);
                ctx.shadowBlur = 0;
                // highlight
                ctx.fillStyle = "#c9ada7";
                ctx.fillRect(x+5, y+5, TILE_W-11, 3);
            }
            
            // info mode di canvas
            ctx.font = "bold 14px 'Segoe UI'";
            ctx.fillStyle = "#d4e6d4";
            ctx.shadowBlur = 0;
            ctx.fillText(`MODE: ${currentMode.toUpperCase()}`, 12, 35);
            ctx.font = "12px monospace";
            ctx.fillStyle = "#b0f0b0";
            ctx.fillText(`SPEED: ${Math.round(scrollSpeed)} px/s`, 12, 60);
            
            // instruksi
            ctx.font = "bold 12px system-ui";
            ctx.fillStyle = "#ffec99";
            ctx.fillText("✔ tap tile hitam +10 | miss -5", canvas.width-160, 30);
        }
        
        // ---------- GAME LOOP ----------
        let lastFrame = null;
        function gameLoop(nowMs) {
            if(!lastFrame) {
                lastFrame = nowMs;
                requestAnimationFrame(gameLoop);
                return;
            }
            let delta = Math.min(0.033, (nowMs - lastFrame) / 1000);
            if(delta > 0) {
                updateGame(delta);
                draw();
            }
            lastFrame = nowMs;
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // ---------- MODE & RESET HANDLER ----------
        function setMode(mode) {
            currentMode = mode;
            resetGame();
            // update tampilan tombol aktif
            if(mode === 'easy') {
                document.getElementById('easyModeBtn').classList.add('active');
                document.getElementById('hardModeBtn').classList.remove('active');
            } else {
                document.getElementById('hardModeBtn').classList.add('active');
                document.getElementById('easyModeBtn').classList.remove('active');
            }
        }
        
        // ---------- EVENT LISTENER ----------
        function attachEvents() {
            canvas.addEventListener('mousedown', handleTap);
            canvas.addEventListener('touchstart', handleTap, { passive: false });
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            
            document.getElementById('easyModeBtn').addEventListener('click', () => setMode('easy'));
            document.getElementById('hardModeBtn').addEventListener('click', () => setMode('hard'));
            document.getElementById('resetButton').addEventListener('click', () => resetGame());
        }
        
        // Inisialisasi audio (butuh interaksi pengguna pertama kali)
        function enableAudioOnFirstTap() {
            const enableAudio = () => {
                initAudio();
                if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                canvas.removeEventListener('click', enableAudio);
                canvas.removeEventListener('touchstart', enableAudio);
            };
            canvas.addEventListener('click', enableAudio);
            canvas.addEventListener('touchstart', enableAudio);
        }
        
        // ---------- START ----------
        function init() {
            attachEvents();
            resetGame();
            enableAudioOnFirstTap();  // agar audio bisa dimulai setelah user klik canvas
            animationId = requestAnimationFrame(gameLoop);
        }
        
        init();
    })();
</script>
</body>
</html>
