<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles Pro - Rhythm Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0f0e;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            position: relative;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        /* Overlay umum */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            color: white;
            text-align: center;
            transition: 0.3s;
        }

        /* Menu awal */
        .menu-container {
            max-width: 400px;
            width: 90%;
            background: #1e2a2a;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .playlist-panel {
            margin-bottom: 20px;
        }

        .playlist-title {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
            border-bottom: 2px solid #ffb347;
            display: inline-block;
        }

        .song-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
            text-align: left;
        }

        .song-item {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 40px;
            cursor: pointer;
            background: #2c3e2e;
            transition: 0.1s;
        }

        .song-item.active {
            background: #ffb347;
            color: #1e2a1f;
            font-weight: bold;
        }

        .mode-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }

        .mode-btn {
            background: #2c3e2e;
            border: none;
            font-weight: bold;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 1rem;
            color: white;
            cursor: pointer;
        }

        .mode-btn.active {
            background: #ffb347;
            color: #1e2a1f;
        }

        .instruction {
            background: #00000066;
            padding: 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 20px 0;
        }

        .start-btn {
            background: #ffb347;
            border: none;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 60px;
            font-size: 1.2rem;
            color: #1e2a1f;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* Countdown */
        .countdown-number {
            font-size: 8rem;
            font-weight: bold;
            text-shadow: 0 0 20px #ffb347;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Game HUD */
        .game-hud {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 20;
            pointer-events: none;
        }

        .score-board {
            background: #000000aa;
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.4rem;
            font-family: monospace;
            pointer-events: auto;
        }

        .pause-btn {
            background: #ff5e5e;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            pointer-events: auto;
            color: white;
        }

        /* Finish overlay */
        .finish-box {
            background: #1e2a2a;
            border-radius: 32px;
            padding: 32px;
            text-align: center;
            min-width: 250px;
        }

        .final-score {
            font-size: 3rem;
            font-weight: bold;
            color: #ffb347;
            margin: 20px 0;
        }

        .high-score {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ccc;
        }

        .finish-btn {
            background: #ffb347;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Menu Awal -->
    <div id="menuOverlay" class="overlay" style="display: flex;">
        <div class="menu-container">
            <div class="playlist-panel">
                <div class="playlist-title">🎧 DAFTAR LAGU</div>
                <ul class="song-list" id="songList">
                    <li style="text-align: center;">Memuat...</li>
                </ul>
            </div>
            <div class="mode-group">
                <button id="easyModeMenu" class="mode-btn active">🍃 EASY</button>
                <button id="hardModeMenu" class="mode-btn">⚡ HARD</button>
            </div>
            <div class="instruction">
                ✨ Tekan tile hitam tepat waktu (+10)<br>
                ❌ Tile terlewat atau tile panjang tidak ditahan penuh (-5)<br>
                ➖ Tile panjang: tahan sampai garis merah habis
            </div>
            <button id="startGameBtn" class="start-btn">🎮 MULAI GAME</button>
        </div>
    </div>

    <!-- Countdown Overlay -->
    <div id="countdownOverlay" class="overlay" style="display: none;">
        <div class="countdown-number" id="countdownNumber">3</div>
    </div>

    <!-- Finish Overlay -->
    <div id="finishOverlay" class="overlay" style="display: none;">
        <div class="finish-box">
            <h2>✨ GAME SELESAI ✨</h2>
            <div class="final-score" id="finalScore">0</div>
            <div class="high-score" id="highScoreDisplay">🏆 HIGH SCORE: 0</div>
            <button id="backToMenuBtn" class="finish-btn">🔁 KEMBALI KE MENU</button>
        </div>
    </div>

    <!-- Game HUD (hanya muncul saat game aktif) -->
    <div id="gameHud" class="game-hud" style="display: none;">
        <div class="score-board">🎵 SCORE: <span id="scoreValue">0</span></div>
        <button id="pauseResumeBtn" class="pause-btn">⏸ PAUSE</button>
    </div>

    <script>
        (function(){
            // ---------- KONFIGURASI ----------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreValue');
            
            let canvasWidth, canvasHeight;
            let TILE_W, TILE_H;
            
            // ---------- GAME STATE ----------
            let tiles = [];
            let nextTileId = 1;
            let score = 0;
            let currentMode = 'easy';
            let gameActive = false;
            let isPaused = false;
            let lastFrameTime = null;
            
            // Parameter gameplay
            let scrollSpeedPercent = 0.22;  // easy default
            let pattern = [];
            let patternIndex = 0;
            
            // ---------- AUDIO & SONG ----------
            let audioContext = null;
            let currentSource = null;
            let currentSong = null;
            let songsList = [];
            let audioBuffer = null;
            let songStartTime = 0;
            let playbackOffset = 0;
            let isPlaying = false;
            let isLoading = false;
            
            // ---------- MULTI-TOUCH ----------
            let activeTouches = new Map();
            
            // ---------- DOM ELEMENTS ----------
            const menuOverlay = document.getElementById('menuOverlay');
            const countdownOverlay = document.getElementById('countdownOverlay');
            const finishOverlay = document.getElementById('finishOverlay');
            const gameHud = document.getElementById('gameHud');
            const pauseResumeBtn = document.getElementById('pauseResumeBtn');
            const startBtn = document.getElementById('startGameBtn');
            const backToMenuBtn = document.getElementById('backToMenuBtn');
            const easyModeMenu = document.getElementById('easyModeMenu');
            const hardModeMenu = document.getElementById('hardModeMenu');
            const songListEl = document.getElementById('songList');
            const finalScoreSpan = document.getElementById('finalScore');
            const highScoreDisplay = document.getElementById('highScoreDisplay');
            
            // ---------- HIGH SCORE ----------
            function getHighScore() {
                const key = `pianoTiles_highscore_${currentMode}`;
                return parseInt(localStorage.getItem(key)) || 0;
            }
            function setHighScore(score) {
                const key = `pianoTiles_highscore_${currentMode}`;
                if (score > getHighScore()) {
                    localStorage.setItem(key, score);
                    return true;
                }
                return false;
            }
            
            // ---------- FUNGSI UTAMA ----------
            function updateCanvasSize() {
                canvasWidth = window.innerWidth;
                canvasHeight = window.innerHeight;
                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
                TILE_W = canvasWidth / 4;
                // Tinggi tile: minimal 30% dari tinggi layar, atau 70% dari lebar tile (pilih yang lebih kecil)
                // Ini membuat tile cukup besar dan memberi jarak vertikal yang nyaman
                TILE_H = Math.min(TILE_W * 0.7, canvasHeight * 0.3);
            }
            
            function updateScoreUI() {
                scoreSpan.innerText = score;
            }
            
            // ---------- LOAD PLAYLIST ----------
            async function loadSongsList() {
                try {
                    const response = await fetch('../game/playlist.json');
                    if (!response.ok) throw new Error('playlist.json not found');
                    const songs = await response.json();
                    songsList = songs;
                    renderSongList();
                    if (songsList.length > 0 && !currentSong) {
                        currentSong = songsList[0];
                        renderSongList();
                    }
                } catch(e) {
                    console.error('Gagal memuat playlist.json:', e);
                    songListEl.innerHTML = '<li style="text-align:center;">Gagal memuat daftar lagu</li>';
                }
            }
            
            function renderSongList() {
                songListEl.innerHTML = '';
                songsList.forEach(song => {
                    const li = document.createElement('li');
                    li.className = 'song-item';
                    if (currentSong && currentSong.id === song.id) li.classList.add('active');
                    li.textContent = song.name || song.id;
                    li.onclick = () => {
                        currentSong = song;
                        renderSongList();
                    };
                    songListEl.appendChild(li);
                });
            }
            
            // ---------- LOAD PATTERN ----------
            async function loadPattern(songId, mode) {
                const filename = `${songId}_${mode}.json`;
                const url = `../game/db/${filename}`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`Pattern ${filename} not found`);
                    return await response.json();
                } catch(e) {
                    console.warn(`Pola ${filename} tidak ditemukan, menggunakan kosong.`);
                    return [];
                }
            }
            
            // ---------- AUDIO ----------
            async function initAudio() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
            }
            
            async function loadAudioBuffer(url) {
                let fullUrl = url;
                if (!url.startsWith('http')) {
                    fullUrl = './sg/' + url;
                }
                const response = await fetch(fullUrl);
                if (!response.ok) throw new Error(`Failed to fetch audio: ${fullUrl}`);
                const arrayBuffer = await response.arrayBuffer();
                return await audioContext.decodeAudioData(arrayBuffer);
            }
            
            function playFromOffset(offset = 0) {
                if (!audioBuffer) return;
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                source.onended = () => {
                    if (gameActive && !isPaused && isPlaying) {
                        endGame();
                    }
                };
                source.start(0, offset);
                currentSource = source;
                songStartTime = audioContext.currentTime - offset;
                isPlaying = true;
                gameActive = true;
                isPaused = false;
                pauseResumeBtn.textContent = '⏸ PAUSE';
            }
            
            function stopAudio() {
                if (currentSource) {
                    try { currentSource.stop(); } catch(e) {}
                    currentSource = null;
                }
                isPlaying = false;
                gameActive = false;
            }
            
            function pauseAudio() {
                if (!isPlaying || !audioContext) return;
                const offset = audioContext.currentTime - songStartTime;
                playbackOffset = offset;
                stopAudio();
                isPaused = true;
                gameActive = false;
                pauseResumeBtn.textContent = '▶ RESUME';
            }
            
            function resumeAudio() {
                if (!audioBuffer || !isPaused) return;
                playFromOffset(playbackOffset);
                isPaused = false;
                gameActive = true;
                pauseResumeBtn.textContent = '⏸ PAUSE';
            }
            
            function resetGameState() {
                tiles = [];
                score = 0;
                updateScoreUI();
                patternIndex = 0;
                activeTouches.clear();
                scrollSpeedPercent = currentMode === 'hard' ? 0.32 : 0.22;
                gameActive = false;
                isPlaying = false;
                isPaused = false;
                if (currentSource) {
                    try { currentSource.stop(); } catch(e) {}
                    currentSource = null;
                }
            }
            
            // ---------- START GAME ----------
            async function startGame() {
                if (isLoading) return;
                isLoading = true;
                menuOverlay.style.display = 'none';
                finishOverlay.style.display = 'none';
                resetGameState();
                pattern = await loadPattern(currentSong.id, currentMode);
                await initAudio();
                try {
                    audioBuffer = await loadAudioBuffer(currentSong.url);
                } catch(e) {
                    console.error('Gagal memuat audio:', e);
                    alert('Gagal memuat file audio. Periksa file MP3.');
                    menuOverlay.style.display = 'flex';
                    isLoading = false;
                    return;
                }
                countdownOverlay.style.display = 'flex';
                let count = 3;
                const countdownNumber = document.getElementById('countdownNumber');
                countdownNumber.textContent = count;
                const countdownInterval = setInterval(() => {
                    count--;
                    if (count >= 1) {
                        countdownNumber.textContent = count;
                    } else {
                        clearInterval(countdownInterval);
                        countdownOverlay.style.display = 'none';
                        playbackOffset = 0;
                        playFromOffset(0);
                        gameActive = true;
                        gameHud.style.display = 'flex';
                        isLoading = false;
                    }
                }, 1000);
            }
            
            function endGame() {
                if (!gameActive && !isPlaying) return;
                stopAudio();
                gameActive = false;
                isPlaying = false;
                const high = getHighScore();
                const isNewHigh = setHighScore(score);
                finalScoreSpan.textContent = score;
                highScoreDisplay.textContent = `🏆 HIGH SCORE: ${Math.max(high, score)}${isNewHigh ? ' (NEW!)' : ''}`;
                finishOverlay.style.display = 'flex';
                gameHud.style.display = 'none';
            }
            
            function togglePause() {
                if (!gameActive && !isPaused) return;
                if (isPaused) {
                    resumeAudio();
                } else {
                    pauseAudio();
                }
            }
            
            function backToMenu() {
                stopAudio();
                gameActive = false;
                isPlaying = false;
                menuOverlay.style.display = 'flex';
                finishOverlay.style.display = 'none';
                gameHud.style.display = 'none';
                resetGameState();
                easyModeMenu.classList.toggle('active', currentMode === 'easy');
                hardModeMenu.classList.toggle('active', currentMode === 'hard');
            }
            
            function setMode(mode) {
                currentMode = mode;
                easyModeMenu.classList.toggle('active', mode === 'easy');
                hardModeMenu.classList.toggle('active', mode === 'hard');
            }
            
            // ---------- UPDATE GAME ----------
            function updateSpawn(currentTime) {
                if (!gameActive || isPaused) return;
                while (patternIndex < pattern.length && pattern[patternIndex].time <= currentTime) {
                    const ev = pattern[patternIndex];
                    tiles.push({
                        id: nextTileId++,
                        col: ev.col,
                        y: -TILE_H,
                        duration: ev.duration,
                        isHolding: false,
                        pressed: false,
                        holdStartTime: 0
                    });
                    patternIndex++;
                }
            }
            
            function updateTiles(deltaSec) {
                if (!gameActive || isPaused) return;
                const moveDist = scrollSpeedPercent * canvasHeight * deltaSec;
                for (let t of tiles) t.y += moveDist;
                const newTiles = [];
                for (let t of tiles) {
                    if (t.y + TILE_H >= canvasHeight) {
                        if (!t.pressed && !t.isHolding) {
                            score = Math.max(0, score - 5);
                            updateScoreUI();
                        }
                    } else {
                        newTiles.push(t);
                    }
                }
                tiles = newTiles;
            }
            
            // ---------- HANDLE TAP ----------
            function handleTapStart(e) {
                if (!gameActive || isPaused) return;
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const touches = e.touches ? e.touches : [e];
                for (let i = 0; i < touches.length; i++) {
                    const touch = touches[i];
                    const pointerId = touch.identifier !== undefined ? touch.identifier : 'mouse';
                    if (activeTouches.has(pointerId)) continue;
                    let canvasX = (touch.clientX - rect.left) * scaleX;
                    let canvasY = (touch.clientY - rect.top) * scaleY;
                    if (canvasX < 0 || canvasX > canvas.width) continue;
                    const col = Math.floor(canvasX / TILE_W);
                    if (col < 0 || col > 3) continue;
                    let bottomTile = null;
                    let maxY = -Infinity;
                    for (let t of tiles) {
                        if (t.col === col && !t.pressed && !t.isHolding && t.y + TILE_H > 0 && t.y > maxY) {
                            maxY = t.y;
                            bottomTile = t;
                        }
                    }
                    if (!bottomTile) continue;
                    if (canvasY >= bottomTile.y && canvasY <= bottomTile.y + TILE_H) {
                        if (bottomTile.duration > 0) {
                            bottomTile.isHolding = true;
                            bottomTile.holdStartTime = performance.now() / 1000;
                            bottomTile.pressed = true;
                            activeTouches.set(pointerId, { tileId: bottomTile.id });
                        } else {
                            bottomTile.pressed = true;
                            score += 10;
                            updateScoreUI();
                            const idx = tiles.indexOf(bottomTile);
                            if (idx !== -1) tiles.splice(idx, 1);
                        }
                    }
                }
            }
            
            function handleTapEnd(e) {
                if (!gameActive || isPaused) return;
                e.preventDefault();
                const touches = e.touches ? e.touches : [];
                if (!e.touches) {
                    const pointerId = 'mouse';
                    if (activeTouches.has(pointerId)) {
                        const data = activeTouches.get(pointerId);
                        for (let t of tiles) {
                            if (t.id === data.tileId && t.isHolding) {
                                const holdDuration = (performance.now() / 1000) - t.holdStartTime;
                                if (holdDuration >= t.duration - 0.05) {
                                    score += 10;
                                } else {
                                    score = Math.max(0, score - 5);
                                }
                                updateScoreUI();
                                const idx = tiles.indexOf(t);
                                if (idx !== -1) tiles.splice(idx, 1);
                                break;
                            }
                        }
                        activeTouches.delete(pointerId);
                    }
                    return;
                }
                for (let i = 0; i < touches.length; i++) {
                    const touch = touches[i];
                    const pointerId = touch.identifier;
                    if (activeTouches.has(pointerId)) {
                        const data = activeTouches.get(pointerId);
                        for (let t of tiles) {
                            if (t.id === data.tileId && t.isHolding) {
                                const holdDuration = (performance.now() / 1000) - t.holdStartTime;
                                if (holdDuration >= t.duration - 0.05) {
                                    score += 10;
                                } else {
                                    score = Math.max(0, score - 5);
                                }
                                updateScoreUI();
                                const idx = tiles.indexOf(t);
                                if (idx !== -1) tiles.splice(idx, 1);
                                break;
                            }
                        }
                        activeTouches.delete(pointerId);
                    }
                }
            }
            
            // ---------- RENDER ----------
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#0f1f1c";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = "#3e6b5c";
                ctx.lineWidth = 2;
                for (let i = 1; i <= 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * TILE_W, 0);
                    ctx.lineTo(i * TILE_W, canvas.height);
                    ctx.stroke();
                }
                for (let t of tiles) {
                    const x = t.col * TILE_W;
                    const y = t.y;
                    const grad = ctx.createLinearGradient(x, y, x+10, y+TILE_H);
                    grad.addColorStop(0, "#1e1e2f");
                    grad.addColorStop(1, "#2d2d44");
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, y, TILE_W-1, TILE_H-1);
                    ctx.fillStyle = "#4a4e69";
                    ctx.fillRect(x+3, y+3, TILE_W-7, TILE_H-7);
                    if (t.duration > 0) {
                        ctx.fillStyle = "#ff6b6b";
                        ctx.fillRect(x+5, y+5, TILE_W-11, 5);
                    }
                }
                if (isPaused && gameHud.style.display === 'flex') {
                    ctx.font = "bold 24px sans-serif";
                    ctx.fillStyle = "#ffaa88";
                    ctx.fillText("⏸ PAUSED", canvasWidth/2-60, canvasHeight/2);
                }
            }
            
            // ---------- GAME LOOP ----------
            let lastTimestamp = null;
            function gameLoop(nowMs) {
                if (!lastTimestamp) {
                    lastTimestamp = nowMs;
                    requestAnimationFrame(gameLoop);
                    return;
                }
                let delta = Math.min(0.033, (nowMs - lastTimestamp) / 1000);
                if (delta > 0 && gameActive && !isPaused) {
                    let currentTime = 0;
                    if (isPlaying && audioContext) {
                        currentTime = audioContext.currentTime - songStartTime;
                    }
                    updateSpawn(currentTime);
                    updateTiles(delta);
                }
                draw();
                lastTimestamp = nowMs;
                requestAnimationFrame(gameLoop);
            }
            
            // ---------- INIT ----------
            function attachEvents() {
                window.addEventListener('resize', () => {
                    updateCanvasSize();
                    if (!gameActive) resetGameState();
                });
                canvas.addEventListener('mousedown', handleTapStart);
                canvas.addEventListener('mouseup', handleTapEnd);
                canvas.addEventListener('touchstart', handleTapStart, { passive: false });
                canvas.addEventListener('touchend', handleTapEnd, { passive: false });
                canvas.addEventListener('contextmenu', (e) => e.preventDefault());
                startBtn.addEventListener('click', startGame);
                pauseResumeBtn.addEventListener('click', togglePause);
                backToMenuBtn.addEventListener('click', backToMenu);
                easyModeMenu.addEventListener('click', () => setMode('easy'));
                hardModeMenu.addEventListener('click', () => setMode('hard'));
            }
            
            async function init() {
                updateCanvasSize();
                attachEvents();
                await loadSongsList();
                gameLoop();
                canvas.addEventListener('click', () => {
                    if (audioContext && audioContext.state === 'suspended') {
                        audioContext.resume();
                    }
                }, { once: true });
            }
            init();
        })();
    </script>
</body>
</html>
