name: Update Comic Data

on:
  workflow_dispatch: # Supaya bisa klik tombol hijau manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        run: |
          cd asn              # Masuk ke folder asn dulu
          python scraper.py   # Jalankan script di dalam asn

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add asn/data.json   # Beritahu git file di dalam asn berubah
          git commit -m "Auto update data" || exit 0
          git push
