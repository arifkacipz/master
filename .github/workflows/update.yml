name: Update PetoMic Data

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      target_slug:
        description: 'Slug komik (contoh: virus-king) - kosongkan untuk mode katalog'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary

      - name: Run Scraper (mode auto untuk slug tertentu)
        if: github.event.inputs.target_slug != ''
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python asn/scraper.py --slug "${{ github.event.inputs.target_slug }}"

      - name: Run Scraper (mode katalog default)
        if: github.event.inputs.target_slug == ''
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python asn/scraper.py --catalog --pages 2 --limit 3

      - name: Generate list.json from db
        run: python generate_list.py

      - name: Generate stats.json (komik dengan chapter < 20)
        run: python generate_stats.py

      - name: Generate missing.json
        run: python miss.py

      - name: Sync and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            echo "Perubahan ditemukan. Melakukan sinkronisasi..."
            git commit -m "PetoMic: Scrape Sync [$(date)]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Tidak ada data baru yang ditemukan."
          fi
