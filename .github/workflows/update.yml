name: Update PetoMic Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_slug:
        description: 'Masukkan Slug (contoh: bad-born-blood) untuk Full Scrape. Kosongkan untuk update rutin.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary

      - name: Run Scraper
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TARGET_SLUG: ${{ github.event.inputs.target_slug }}
        run: |
          cd asn
          python scraper.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Perintah ini memastikan git mengenali folder db meskipun baru dibuat
          git add asn/list.json
          git add asn/db/*.json || echo "Belum ada file di db"
          git commit -m "PetoMic Update: ${TARGET_SLUG:-Routine}" || exit 0
          git push
