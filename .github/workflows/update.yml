name: Update PetoMic Data

on:
  schedule:
    - cron: '5 */2 * * *' 
  workflow_dispatch:
    inputs:
      target_slug:
        description: 'Slug - kosong = katalog'
        required: false
        default: ''
      pages:
        description: 'Jumlah halaman katalog (default: 2)'
        required: false
        default: '2'
      chapters:
        description: 'Jumlah chapter terbaru (default: 3)'
        required: false
        default: '3'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary

      # Mode untuk slug tertentu (satu komik)
      - name: Run Scraper (single comic mode)
        if: github.event.inputs.target_slug != ''
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python asn/scraper.py \
            --slug "${{ github.event.inputs.target_slug }}" \
            --limit ${{ github.event.inputs.chapters }}

      # Mode katalog (banyak komik)
      - name: Run Scraper (catalog mode)
        if: github.event.inputs.target_slug == ''
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python asn/scraper.py \
            --catalog \
            --pages ${{ github.event.inputs.pages }} \
            --limit ${{ github.event.inputs.chapters }}

      # Opsional: Generate missing.json jika diperlukan
      - name: Generate missing.json
        run: python miss.py

      # Opsional: Generate missing_fields.json
      - name: Check missing fields (source, online, Chs)
        run: python check_fields.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            echo "Perubahan ditemukan. Melakukan sinkronisasi..."
            git commit -m "PetoMic: Scrape Sync [$(date)]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Tidak ada data baru yang ditemukan."
          fi
