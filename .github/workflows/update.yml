name: Update PetoMic Data

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch:
    inputs:
      target_slug:
        description: 'Slug komik (contoh: virus-king) - kosongkan untuk mode katalog'
        required: false
        default: ''
      pages:
        description: 'Jumlah halaman untuk mode katalog'
        required: true
        type: choice
        options:
          - 1
          - 3
          - 5
          - 7
          - 10
        default: '3'
      chapters:
        description: 'Jumlah chapter terbaru per komik'
        required: true
        type: choice
        options:
          - 1
          - 3
          - 5
          - 7
          - 10
        default: '3'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary

      # Mode untuk slug tertentu (satu komik) - TANPA LIMIT
      - name: Run Scraper (single comic mode)
        if: github.event.inputs.target_slug != ''
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python asn/scraper.py \
            --slug "${{ github.event.inputs.target_slug }}"

      # Mode katalog (banyak komik) - dengan limit sesuai pilihan
      - name: Run Scraper (catalog mode)
        if: github.event.inputs.target_slug == ''
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PAGES: ${{ github.event.inputs.pages }}
          LIMIT: ${{ github.event.inputs.chapters }}
        run: |
          # Fallback jika kosong (sebenarnya tidak perlu karena required)
          PAGES=${PAGES:-3}
          LIMIT=${LIMIT:-3}
          python asn/scraper.py \
            --catalog \
            --pages $PAGES \
            --limit $LIMIT

      # Generate list.json dari semua data di db/
      - name: Generate list.json
        run: python asn/scraper.py --generate-list

      # Generate stats.json khusus: chapterCount < 15 wajib masuk
      - name: Generate stats.json (chapterCount < 15)
        run: |
          python << EOF
          import os, json
          stats = []
          db_dir = 'db'
          if os.path.exists(db_dir):
              for filename in os.listdir(db_dir):
                  if filename.endswith('.json'):
                      with open(os.path.join(db_dir, filename), 'r', encoding='utf-8') as f:
                          data = json.load(f)
                      slug = filename[:-5]
                      judul = data.get('judul', slug)
                      thumb = data.get('thumb', '')
                      online = data.get('online', len(data.get('chapters', [])))
                      chapterCount = data.get('chapterCount', len(data.get('chapters', [])))
                      chs = data.get('Chs', '')
                      source = data.get('source', 'unknown')
                      # KRITERIA: chapterCount < 15
                      if chapterCount < 15:
                          stats.append({
                              'slug': slug,
                              'judul': judul,
                              'thumb': thumb,
                              'source': source,
                              'online': online,
                              'chapterCount': chapterCount,
                              'Chs': chs
                          })
          with open('stats.json', 'w', encoding='utf-8') as f:
              json.dump(stats, f, indent=2, ensure_ascii=False)
          print(f"stats.json diperbarui dengan {len(stats)} komik (chapterCount < 15).")
          EOF

      # Commit dan push perubahan
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            echo "Perubahan ditemukan. Melakukan sinkronisasi..."
            git commit -m "PetoMic: Scrape Sync [$(date)]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Tidak ada data baru yang ditemukan."
          fi
