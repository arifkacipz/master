name: Update PetoMic Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_slug:
        description: 'Slug ManhuaPlus (contoh: virus-king)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary

      - name: Run Scraper
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TARGET_SLUG: ${{ github.event.inputs.target_slug }}
        run: |
          mkdir -p asn/db
          cd asn
          python scraper.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Hapus file index lock jika ada (mencegah error 128)
          rm -f .git/index.lock
          
          git add asn/
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "PetoMic Master Fix: Session & CDN CC [$(date)]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Katalog sudah up-to-date."
          fi
