name: Update PetoMic Data

on:
  schedule:
    - cron: '*/20 * * * *' 
  workflow_dispatch:
    inputs:
      target_slug:
        description: 'Slug komik (contoh: virus-king) - kosongkan untuk mode katalog'
        required: false
        default: ''
      pages:
        description: 'Jumlah halaman untuk mode katalog'
        required: true
        type: choice
        options:
          - 1
          - 3
          - 5
          - 7
          - 10
        default: '3'
      chapters:
        description: 'Jumlah chapter terbaru per komik'
        required: true
        type: choice
        options:
          - 1
          - 3
          - 5
          - 7
          - 10
        default: '3'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # ==========================================================
      # Langkah 1: Batalkan diri sendiri jika ada workflow lain yang sedang berjalan
      # ==========================================================
      - name: Cancel self if another workflow is running
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              status: 'in_progress',
              per_page: 100
            });
            const otherRunning = runs.workflow_runs.filter(run => run.id !== currentRunId);
            if (otherRunning.length > 0) {
              console.log(`🔴 Ada ${otherRunning.length} workflow lain yang sedang berjalan. Membatalkan diri sendiri...`);
              otherRunning.forEach(r => console.log(`   - ${r.name} (${r.id})`));
              await github.rest.actions.cancelWorkflowRun({
                owner,
                repo,
                run_id: currentRunId
              });
              process.exit(1);
            } else {
              console.log('✅ Tidak ada workflow lain yang berjalan, melanjutkan...');
            }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary

      # ==========================================================
      # Untuk mode katalog, kita perlu menghitung komik baru
      # ==========================================================
      - name: Count existing comics (for catalog mode)
        if: github.event.inputs.target_slug == ''
        run: |
          mkdir -p db
          ls db > before_list.txt || true

      # Mode untuk slug tertentu (satu komik) - TANPA LIMIT
      - name: Run Scraper (single comic mode)
        if: github.event.inputs.target_slug != ''
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python asn/scraper.py \
            --slug "${{ github.event.inputs.target_slug }}"

      # Mode katalog (banyak komik) - dengan limit sesuai pilihan
      - name: Run Scraper (catalog mode)
        if: github.event.inputs.target_slug == ''
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PAGES: ${{ github.event.inputs.pages }}
          LIMIT: ${{ github.event.inputs.chapters }}
        run: |
          # Tentukan jumlah halaman: jika schedule, default 1; jika dispatch, gunakan input
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PAGES=1
          else
            PAGES=${PAGES:-3}
          fi
          LIMIT=${LIMIT:-3}
          python asn/scraper.py \
            --catalog \
            --pages $PAGES \
            --limit $LIMIT

      # Hitung komik baru untuk mode katalog
      - name: Count new comics (for catalog mode)
        if: github.event.inputs.target_slug == ''
        id: new_comics
        run: |
          ls db > after_list.txt || true
          # Hitung file baru (yang ada di after tapi tidak di before)
          new_files=$(comm -13 <(sort before_list.txt) <(sort after_list.txt) | wc -l)
          echo "new_comics=$new_files" >> $GITHUB_OUTPUT
          echo "Jumlah komik baru: $new_files"

      # Generate list.json dari semua data di db/
      - name: Generate list.json
        run: python asn/scraper.py --generate-list

      # Generate stats.json khusus: chapterCount < 15 wajib masuk
      - name: Generate stats.json (chapterCount < 15)
        run: |
          python << EOF
          import os, json
          stats = []
          db_dir = 'db'
          if os.path.exists(db_dir):
              for filename in os.listdir(db_dir):
                  if filename.endswith('.json'):
                      with open(os.path.join(db_dir, filename), 'r', encoding='utf-8') as f:
                          data = json.load(f)
                      slug = filename[:-5]
                      judul = data.get('judul', slug)
                      thumb = data.get('thumb', '')
                      online = data.get('online', len(data.get('chapters', [])))
                      chapterCount = data.get('chapterCount', len(data.get('chapters', [])))
                      chs = data.get('Chs', '')
                      source = data.get('source', 'unknown')
                      # KRITERIA: chapterCount < 15
                      if chapterCount < 15:
                          stats.append({
                              'slug': slug,
                              'judul': judul,
                              'thumb': thumb,
                              'source': source,
                              'online': online,
                              'chapterCount': chapterCount,
                              'Chs': chs
                          })
          with open('stats.json', 'w', encoding='utf-8') as f:
              json.dump(stats, f, indent=2, ensure_ascii=False)
          print(f"stats.json diperbarui dengan {len(stats)} komik (chapterCount < 15).")
          EOF

      # Commit dan push perubahan
      - name: Commit and push changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            echo "Perubahan ditemukan. Melakukan sinkronisasi..."
            git commit -m "PetoMic: Scrape Sync [$(date)]"
            git pull --rebase origin main
            git push origin main
            echo "committed=true" >> $GITHUB_OUTPUT
          else
            echo "Tidak ada data baru yang ditemukan."
            echo "committed=false" >> $GITHUB_OUTPUT
          fi

      # Kirim notifikasi Telegram
      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>Workflow:</b> ${{ github.workflow }}
            <b>Status:</b> ${{ job.status }}
            <b>Run ID:</b> ${{ github.run_id }}
            <b>Trigger:</b> ${{ github.event_name }}
            <b>Mode:</b> ${{ github.event.inputs.target_slug != '' && 'Single Comic' || 'Catalog' }}
            <b>Pages:</b> ${{ github.event.inputs.pages || (github.event_name == 'schedule' && '1' || 'N/A') }}
            <b>New Comics Added:</b> ${{ steps.new_comics.outputs.new_comics || '0' }}
            <b>Changes committed:</b> ${{ steps.commit.outputs.committed }}
            <b>Repository:</b> ${{ github.repository }}
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">🔗 View Run</a>
