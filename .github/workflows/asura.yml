name: Update Asura

on:
  schedule:
    - cron: '0 */8 * * *'   # Setiap 8 jam sekali (00:00, 08:00, 16:00 UTC)
  workflow_dispatch:
    inputs:
      target_slug:
        description: 'Slug Asura (contoh: children-of-the-rune-f7caf337)'
        required: false
        default: ''

# Mencegah dua workflow berjalan bersamaan
concurrency:
  group: scrape-asura
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4
        # Cloudinary tidak diperlukan untuk Asura Scans, jadi hapus

      - name: Run Scraper
        env:
          TARGET_SLUG: ${{ github.event.inputs.target_slug }}
        run: |
          python asn/asura.py   # Pastikan path dan nama file sesuai

      - name: Generate list2.json from db2
        run: python generate_list2.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Hanya tambahkan folder db2/ dan file list2.json
          git add db2/ list2.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
          else
            echo "Perubahan ditemukan. Melakukan commit dan push..."
            git commit -m "Auto-update Asura Scans data [skip ci]"
            git pull --rebase origin main   # Ganti 'main' jika branch Anda 'master'
            git push origin main
          fi
