name: Matrix Full Scrape (3 per run - Random)

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Sumber slug (missing, stats, missing_fields, atau kosongkan untuk otomatis)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - missing
          - stats
          - missing_fields
      max_chapters:
        description: 'Batas total chapter (20, 50, 100, atau kosongkan untuk tidak ada batas)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '20'
          - '50'
          - '100'
      count:
        description: 'Jumlah slug yang dipilih (1-6)'
        required: false
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
  schedule:
    - cron: '25 * * * *' 
    - cron: '45 * * * *'

concurrency:
  group: matrix-full-scrape
  cancel-in-progress: false

jobs:
  select-slugs:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.select.outputs.slugs }}
      selected_count: ${{ steps.select.outputs.selected_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Generate initial stats.json if not exists
        run: |
          if [ ! -f stats.json ]; then
            python generate_stats.py || echo "[]" > stats.json
          fi

      - name: Select slugs based on inputs
        id: select
        env:
          SOURCE: ${{ github.event.inputs.source }}
          MAX_CHAPTERS: ${{ github.event.inputs.max_chapters }}
          COUNT: ${{ github.event.inputs.count }}
        run: |
          python << EOF
          import os, json, random

          source = os.environ.get('SOURCE', '')
          max_chapters_str = os.environ.get('MAX_CHAPTERS', '')
          count_str = os.environ.get('COUNT', '3')
          
          try:
              count = int(count_str) if count_str else 3
          except:
              count = 3
          count = min(max(count, 1), 6)  # batasi 1-6

          TRACKER_FILE = 'tracker.json'
          selected = []
          tracked_slugs = set()

          if os.path.exists(TRACKER_FILE):
              try:
                  with open(TRACKER_FILE, 'r') as f:
                      tracker_data = json.load(f)
                      if isinstance(tracker_data, list):
                          tracked_slugs = set(tracker_data)
                      elif isinstance(tracker_data, dict):
                          tracked_slugs = set(tracker_data.keys())
                  print(f"Tracker berisi {len(tracked_slugs)} slug.")
              except Exception as e:
                  print(f"Error membaca tracker: {e}")

          def load_json_file(filename):
              if os.path.exists(filename):
                  with open(filename, 'r') as f:
                      return json.load(f)
              return None

          if source == 'missing':
              data = load_json_file('missing.json')
              if data:
                  candidates = []
                  for item in data:
                      total = item.get('total_online', 0)
                      if max_chapters_str and total > int(max_chapters_str):
                          continue
                      candidates.append(item['slug'])
                  print(f"Memilih dari missing.json, total {len(candidates)} kandidat setelah filter.")
              else:
                  print("missing.json tidak ditemukan.")
                  candidates = []
          elif source == 'stats':
              data = load_json_file('stats.json')
              if data:
                  candidates = []
                  for item in data:
                      total = item.get('chapterCount', 0)
                      if max_chapters_str and total > int(max_chapters_str):
                          continue
                      candidates.append(item['slug'])
                  print(f"Memilih dari stats.json, total {len(candidates)} kandidat setelah filter.")
              else:
                  print("stats.json tidak ditemukan.")
                  candidates = []
          elif source == 'missing_fields':
              data = load_json_file('missing_fields.json')
              if data:
                  candidates = [item['slug'] for item in data]
                  print(f"Memilih dari missing_fields.json, total {len(candidates)} kandidat.")
              else:
                  print("missing_fields.json tidak ditemukan.")
                  candidates = []
          else:
              # Mode otomatis: prioritas missing.json (<50), lalu stats.json
              candidates = []
              missing_data = load_json_file('missing.json')
              if missing_data:
                  candidates = [item['slug'] for item in missing_data if item.get('total_online', 0) < 50]
                  print(f"Mode otomatis: {len(candidates)} kandidat dari missing.json (<50)")
              if len(candidates) < count and os.path.exists('stats.json'):
                  stats_data = load_json_file('stats.json')
                  if stats_data:
                      stats_slugs = [item['slug'] for item in stats_data if 'slug' in item and item['slug'] not in candidates]
                      if max_chapters_str:
                          stats_slugs = [item['slug'] for item in stats_data if 'slug' in item and item.get('chapterCount', 0) <= int(max_chapters_str) and item['slug'] not in candidates]
                      else:
                          stats_slugs = [item['slug'] for item in stats_data if 'slug' in item and item['slug'] not in candidates]
                      candidates.extend(stats_slugs)
                      print(f"Mode otomatis: menambahkan {len(stats_slugs)} dari stats.json")

          # Filter kandidat yang belum ada di tracker
          candidates = [slug for slug in candidates if slug not in tracked_slugs]

          if candidates:
              num_to_select = min(len(candidates), count)
              selected = random.sample(candidates, num_to_select)
              print(f"Terpilih {len(selected)} slug: {selected}")
          else:
              print("Tidak ada kandidat yang tersedia.")

          # Update tracker dengan slug yang baru dipilih
          if selected:
              if os.path.exists(TRACKER_FILE):
                  with open(TRACKER_FILE, 'r') as f:
                      try:
                          existing = json.load(f)
                          if isinstance(existing, list):
                              tracked_updated = set(existing)
                          elif isinstance(existing, dict):
                              tracked_updated = set(existing.keys())
                          else:
                              tracked_updated = set()
                      except:
                          tracked_updated = set()
              else:
                  tracked_updated = set()

              tracked_updated.update(selected)
              with open(TRACKER_FILE, 'w') as f:
                  json.dump(list(tracked_updated), f, indent=2)
              print(f"Tracker diperbarui dengan {len(selected)} slug baru.")
          else:
              # Jika tidak ada slug dipilih, pastikan tracker.json tetap ada
              if not os.path.exists(TRACKER_FILE):
                  with open(TRACKER_FILE, 'w') as f:
                      json.dump([], f)
                  print("Tracker dibuat kosong.")

          with open('selected_slugs.json', 'w') as f:
              json.dump(selected, f)

          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"slugs={json.dumps(selected)}\n")
              f.write(f"selected_count={len(selected)}\n")
          EOF

      - name: Upload selected slugs
        uses: actions/upload-artifact@v4
        with:
          name: selected-slugs
          path: selected_slugs.json

      - name: Upload tracker.json
        uses: actions/upload-artifact@v4
        with:
          name: tracker-json
          path: tracker.json

  scrape:
    needs: select-slugs
    if: needs.select-slugs.outputs.slugs != '[]' && needs.select-slugs.outputs.slugs != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        slug: ${{ fromJson(needs.select-slugs.outputs.slugs) }}
      max-parallel: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary

      - name: Run full scrape for ${{ matrix.slug }} (auto merge)
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python asn/scraper.py --slug "${{ matrix.slug }}" --source auto

      - name: Upload updated JSON for ${{ matrix.slug }}
        uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.slug }}
          path: db/${{ matrix.slug }}.json
          if-no-files-found: ignore

  commit-changes:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all updated JSON files
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: db-*
          merge-multiple: true

      - name: Download tracker.json
        uses: actions/download-artifact@v4
        with:
          name: tracker-json
          path: .

      - name: Copy to db folder
        run: |
          mkdir -p db
          cp -v downloaded-artifacts/*.json db/ 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies for missing update
        run: pip install requests beautifulsoup4

      - name: Generate stats.json
        run: python generate_stats.py

      - name: Generate list.json
        run: python generate_list.py

      - name: Update missing.json
        run: python miss.py

      - name: Check missing fields (source, online, Chs)
        run: python check_fields.py

      - name: Commit and push all changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add db/ stats.json list.json missing.json tracker.json missing_fields.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update: random full scrape dan statistik [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>Workflow:</b> ${{ github.workflow }}
            <b>Status:</b> ${{ job.status }}
            <b>Run ID:</b> ${{ github.run_id }}
            <b>Trigger:</b> ${{ github.event_name }}
            <b>Source:</b> ${{ github.event.inputs.source || 'auto' }}
            <b>Max Chapters:</b> ${{ github.event.inputs.max_chapters || 'none' }}
            <b>Selected slugs:</b> ${{ needs.select-slugs.outputs.slugs || 'none' }}
            <b>Changes committed:</b> ${{ steps.commit.outputs.committed }}
            <b>Repository:</b> ${{ github.repository }}
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">🔗 View Run</a>
