name: Matrix Full Scrape (Random)

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Sumber slug (missing, stats, missing_fields, atau kosongkan untuk otomatis)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - missing
          - stats
          - missing_fields
      max_chapters:
        description: 'Batas total chapter (20, 50, 100, atau kosongkan untuk tidak ada batas)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '20'
          - '50'
          - '100'
          - '150'
      count:
        description: 'Jumlah slug yang dipilih (1-20)'
        required: false
        default: '5'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '10'
          - '15'
          - '20'
          - '30'
          - '40'
          - '50'
  schedule:
    - cron: '* * */6 * *' 
    - cron: '* * */3 * *'

concurrency:
  group: matrix-full-scrape
  cancel-in-progress: false

jobs:
  select-slugs:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.select.outputs.slugs }}
      selected_count: ${{ steps.select.outputs.selected_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Generate initial stats.json if not exists
        run: |
          if [ ! -f stats.json ]; then
            python generate_stats.py || echo "[]" > stats.json
          fi

      - name: Select slugs based on inputs
        id: select
        env:
          SOURCE: ${{ github.event.inputs.source }}
          MAX_CHAPTERS: ${{ github.event.inputs.max_chapters }}
          COUNT: ${{ github.event.inputs.count }}
        run: |
          python << EOF
          import os, json, random

          source = os.environ.get('SOURCE', '')
          max_chapters_str = os.environ.get('MAX_CHAPTERS', '')
          count_str = os.environ.get('COUNT', '5')
          
          try:
              count = int(count_str) if count_str else 5
          except:
              count = 5
          count = min(max(count, 1), 50)

          TRACKER_FILE = 'tracker.json'
          selected = []

          def load_json_file(filename):
              if os.path.exists(filename):
                  with open(filename, 'r') as f:
                      return json.load(f)
              return None

          def filter_by_max_chapters(data, max_chapters):
              """Filter list of dicts yang memiliki key 'total_online' atau 'chapterCount'"""
              if not max_chapters:
                  return data
              max_val = int(max_chapters)
              result = []
              for item in data:
                  total = item.get('total_online') or item.get('chapterCount') or 0
                  if total <= max_val:
                      result.append(item)
              return result

          # Urutan prioritas sumber
          source_order = []
          if source:
              source_order = [source]
          else:
              source_order = ['stats', 'missing', 'missing_fields']

          # Kumpulkan kandidat dari sumber-sumber secara berurutan
          candidates = []
          used_sources = []
          for src in source_order:
              if len(candidates) >= count:
                  break
              data = None
              if src == 'stats':
                  data = load_json_file('stats.json')
                  if data:
                      filtered = filter_by_max_chapters(data, max_chapters_str)
                      new_slugs = [item['slug'] for item in filtered if item['slug'] not in candidates]
                      candidates.extend(new_slugs)
                      used_sources.append(src)
                      print(f"Dari stats.json: {len(new_slugs)} slug baru setelah filter.")
              elif src == 'missing':
                  data = load_json_file('missing.json')
                  if data:
                      filtered = filter_by_max_chapters(data, max_chapters_str)
                      new_slugs = [item['slug'] for item in filtered if item['slug'] not in candidates]
                      candidates.extend(new_slugs)
                      used_sources.append(src)
                      print(f"Dari missing.json: {len(new_slugs)} slug baru.")
              elif src == 'missing_fields':
                  data = load_json_file('missing_fields.json')
                  if data:
                      if data and isinstance(data[0], dict):
                          new_slugs = [item['slug'] for item in data if item['slug'] not in candidates]
                      else:
                          new_slugs = [slug for slug in data if slug not in candidates]
                      candidates.extend(new_slugs)
                      used_sources.append(src)
                      print(f"Dari missing_fields.json: {len(new_slugs)} slug baru.")
              else:
                  print(f"Sumber tidak dikenal: {src}")

          # Batasi jumlah kandidat sesuai count
          if candidates:
              num_to_select = min(len(candidates), count)
              selected = random.sample(candidates, num_to_select)
              print(f"Terpilih {len(selected)} slug dari sumber {used_sources}: {selected}")
          else:
              print("Tidak ada kandidat yang tersedia.")

          # Update tracker (hanya untuk logging, tidak digunakan sebagai filter)
          if selected:
              if os.path.exists(TRACKER_FILE):
                  with open(TRACKER_FILE, 'r') as f:
                      try:
                          existing = json.load(f)
                          if isinstance(existing, list):
                              tracked_updated = set(existing)
                          elif isinstance(existing, dict):
                              tracked_updated = set(existing.keys())
                          else:
                              tracked_updated = set()
                      except:
                          tracked_updated = set()
              else:
                  tracked_updated = set()
              tracked_updated.update(selected)
              with open(TRACKER_FILE, 'w') as f:
                  json.dump(list(tracked_updated), f, indent=2)
              print(f"Tracker diperbarui dengan {len(selected)} slug baru.")
          else:
              if not os.path.exists(TRACKER_FILE):
                  with open(TRACKER_FILE, 'w') as f:
                      json.dump([], f)
                  print("Tracker dibuat kosong.")

          with open('selected_slugs.json', 'w') as f:
              json.dump(selected, f)

          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"slugs={json.dumps(selected)}\n")
              f.write(f"selected_count={len(selected)}\n")
          EOF

      - name: Upload selected slugs
        uses: actions/upload-artifact@v4
        with:
          name: selected-slugs
          path: selected_slugs.json

      - name: Upload tracker.json
        uses: actions/upload-artifact@v4
        with:
          name: tracker-json
          path: tracker.json

  scrape:
    needs: select-slugs
    if: needs.select-slugs.outputs.slugs != '[]' && needs.select-slugs.outputs.slugs != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        slug: ${{ fromJson(needs.select-slugs.outputs.slugs) }}
      max-parallel: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary

      - name: Run full scrape for ${{ matrix.slug }} (auto merge)
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python asn/scraper.py --slug "${{ matrix.slug }}" --source auto

      - name: Upload updated JSON for ${{ matrix.slug }}
        uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.slug }}
          path: db/${{ matrix.slug }}.json
          if-no-files-found: ignore

  commit-changes:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all updated JSON files
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: db-*
          merge-multiple: true

      - name: Download tracker.json
        uses: actions/download-artifact@v4
        with:
          name: tracker-json
          path: .

      - name: Copy to db folder
        run: |
          mkdir -p db
          cp -v downloaded-artifacts/*.json db/ 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies for missing update
        run: pip install requests beautifulsoup4

      - name: Generate stats.json
        run: python generate_stats.py

      - name: Generate list.json
        run: python generate_list.py

      - name: Update missing.json
        run: python miss.py

      - name: Check missing fields (source, online, Chs)
        run: python check_fields.py

      - name: Commit and push all changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add db/ stats.json list.json missing.json tracker.json missing_fields.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update: random full scrape dan statistik [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>Workflow:</b> ${{ github.workflow }}
            <b>Status:</b> ${{ job.status }}
            <b>Run ID:</b> ${{ github.run_id }}
            <b>Trigger:</b> ${{ github.event_name }}
            <b>Source:</b> ${{ github.event.inputs.source || 'auto' }}
            <b>Max Chapters:</b> ${{ github.event.inputs.max_chapters || 'none' }}
            <b>Selected slugs:</b> ${{ needs.select-slugs.outputs.slugs || 'none' }}
            <b>Changes committed:</b> ${{ steps.commit.outputs.committed }}
            <b>Repository:</b> ${{ github.repository }}
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">🔗 View Run</a>
