name: Matrix Full Scrape (3 per run - Random)

on:
  workflow_dispatch:
  schedule:
    - cron: '36 * * * *'   # Setiap jam pada menit 36 UTC

concurrency:
  group: matrix-full-scrape
  cancel-in-progress: false

jobs:
  select-slugs:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.select.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select up to 3 random slugs from stats.json
        id: select
        run: |
          python << EOF
          import os, json, random

          STATS_FILE = 'stats.json'
          selected = []

          if os.path.exists(STATS_FILE):
              try:
                  with open(STATS_FILE, 'r') as f:
                      stats = json.load(f)
                  
                  # Mengambil semua slug dari stats.json
                  all_slugs = [item['slug'] for item in stats if 'slug' in item]
                  
                  if all_slugs:
                      # Pilih maksimal 3 slug secara acak tanpa duplikat
                      num_to_select = min(len(all_slugs), 3)
                      selected = random.sample(all_slugs, num_to_select)
                      print(f"Berhasil memilih {len(selected)} slug secara acak.")
                  else:
                      print("Tidak ada slug ditemukan dalam stats.json")
              except Exception as e:
                  print(f"Terjadi kesalahan saat membaca stats.json: {e}")
          else:
              print("stats.json tidak ditemukan")

          # Simpan ke file untuk artifact
          with open('selected_slugs.json', 'w') as f:
              json.dump(selected, f)

          # Set output untuk digunakan oleh job 'scrape'
          # Menggunakan json.dumps untuk memastikan formatnya valid string JSON
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"slugs={json.dumps(selected)}\n")
          EOF

      - name: Upload selected slugs
        uses: actions/upload-artifact@v4
        with:
          name: selected-slugs
          path: selected_slugs.json

  scrape:
    needs: select-slugs
    if: needs.select-slugs.outputs.slugs != '[]' && needs.select-slugs.outputs.slugs != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        slug: ${{ fromJson(needs.select-slugs.outputs.slugs) }}
      max-parallel: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary

      - name: Run full scrape for ${{ matrix.slug }}
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TARGET_SLUG: ${{ matrix.slug }}
        run: python asn/scraper.py

      - name: Upload updated JSON for ${{ matrix.slug }}
        uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.slug }}
          path: db/${{ matrix.slug }}.json
          if-no-files-found: ignore

  commit-changes:
    needs: scrape
    runs-on: ubuntu-latest
    if: always() # Tetap jalankan commit jika ada scraper yang berhasil
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all updated JSON files
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: db-*
          merge-multiple: true

      - name: Copy to db folder
        run: |
          mkdir -p db
          cp -v downloaded-artifacts/*.json db/ 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate stats.json
        run: python generate_stats.py

      - name: Generate list.json
        run: python generate_list.py

      - name: Commit and push all changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add db/ stats.json list.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Auto-update: random full scrape dan statistik [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
