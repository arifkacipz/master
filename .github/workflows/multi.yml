name: Matrix Full Scrape (3 per run)

on:
  workflow_dispatch:
  schedule:
    - cron: '36 * * * *'   # Setiap jam pada menit 36 UTC

concurrency:
  group: matrix-full-scrape
  cancel-in-progress: false

jobs:
  select-slugs:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.select.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select up to 3 slugs from stats.json
        id: select
        run: |
          python << EOF
          import os, json

          STATS_FILE = 'stats.json'

          if not os.path.exists(STATS_FILE):
              print("stats.json tidak ditemukan")
              selected = []
          else:
              with open(STATS_FILE, 'r') as f:
                  stats = json.load(f)
              all_slugs = [item['slug'] for item in stats if 'slug' in item]
              selected = all_slugs[:3]

          with open('selected_slugs.json', 'w') as f:
              json.dump(selected, f)

          print(f"slugs={json.dumps(selected)}")
          EOF
          echo "slugs=$(cat selected_slugs.json)" >> $GITHUB_OUTPUT

      - name: Upload selected slugs
        uses: actions/upload-artifact@v4
        with:
          name: selected-slugs
          path: selected_slugs.json

  scrape:
    needs: select-slugs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        slug: ${{ fromJson(needs.select-slugs.outputs.slugs) }}
      max-parallel: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary

      - name: Run full scrape for ${{ matrix.slug }}
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TARGET_SLUG: ${{ matrix.slug }}
        run: python asn/scraper.py

      # Upload file JSON yang baru dihasilkan (jika ada)
      - name: Upload updated JSON for ${{ matrix.slug }}
        uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.slug }}
          path: db/${{ matrix.slug }}.json
          if-no-files-found: ignore

  commit-changes:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all updated JSON files
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: db-*
          merge-multiple: true

      # Salin file yang diunduh ke folder db/ (perbarui data lokal)
      - name: Copy to db folder
        run: |
          mkdir -p db
          cp -v downloaded-artifacts/*.json db/ 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Generate stats.json berdasarkan data terbaru di db/
      - name: Generate stats.json
        run: python generate_stats.py

      # Generate list.json berdasarkan data terbaru di db/
      - name: Generate list.json
        run: python generate_list.py

      # Commit semua perubahan (db/, stats.json, list.json) sekaligus
      - name: Commit and push all changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add db/ stats.json list.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Auto-update: full scrape dan statistik [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
