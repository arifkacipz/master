name: Matrix Full Scrape (3 per run - Random)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'   # Setiap 20 menit

concurrency:
  group: matrix-full-scrape
  cancel-in-progress: false

jobs:
  select-slugs:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.select.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Generate initial stats.json if not exists
        run: |
          if [ ! -f stats.json ]; then
            python generate_stats.py || echo "[]" > stats.json
          fi

      - name: Select slugs priority from missing.json (<50) then stats.json, excluding tracked slugs
        id: select
        run: |
          python << EOF
          import os, json, random

          TRACKER_FILE = 'tracker.json'
          selected = []
          tracked_slugs = set()

          # Baca tracker jika ada
          if os.path.exists(TRACKER_FILE):
              try:
                  with open(TRACKER_FILE, 'r') as f:
                      tracker_data = json.load(f)
                      # Asumsikan tracker berbentuk list
                      if isinstance(tracker_data, list):
                          tracked_slugs = set(tracker_data)
                      elif isinstance(tracker_data, dict):
                          tracked_slugs = set(tracker_data.keys())
                      print(f"Ditemukan {len(tracked_slugs)} slug dalam tracker.")
              except Exception as e:
                  print(f"Error membaca tracker: {e}")

          # Prioritas 1: dari missing.json dengan total_online < 50
          if os.path.exists('missing.json'):
              try:
                  with open('missing.json', 'r') as f:
                      missing = json.load(f)
                  candidates = [item['slug'] for item in missing if item.get('total_online', 0) < 50 and item['slug'] not in tracked_slugs]
                  if candidates:
                      num_to_select = min(len(candidates), 3)
                      selected = random.sample(candidates, num_to_select)
                      print(f"Memilih {len(selected)} slug dari missing.json (<50 chapter)")
              except Exception as e:
                  print(f"Error membaca missing.json: {e}")

          # Prioritas 2: jika kurang, ambil dari stats.json (juga exclude tracked)
          if len(selected) < 3:
              if os.path.exists('stats.json'):
                  try:
                      with open('stats.json', 'r') as f:
                          stats = json.load(f)
                      all_slugs = [item['slug'] for item in stats if 'slug' in item and item['slug'] not in selected and item['slug'] not in tracked_slugs]
                      if all_slugs:
                          needed = 3 - len(selected)
                          num_to_select = min(len(all_slugs), needed)
                          additional = random.sample(all_slugs, num_to_select)
                          selected.extend(additional)
                          print(f"Menambahkan {len(additional)} slug dari stats.json")
                  except Exception as e:
                      print(f"Error membaca stats.json: {e}")

          print(f"Total slug terpilih: {selected}")

          # Update tracker: tambahkan slug yang baru dipilih
          if selected:
              # Baca ulang tracker untuk menghindari konflik
              if os.path.exists(TRACKER_FILE):
                  with open(TRACKER_FILE, 'r') as f:
                      try:
                          existing = json.load(f)
                          if isinstance(existing, list):
                              tracked_updated = set(existing)
                          elif isinstance(existing, dict):
                              tracked_updated = set(existing.keys())
                          else:
                              tracked_updated = set()
                      except:
                          tracked_updated = set()
              else:
                  tracked_updated = set(tracked_slugs)  # dari awal

              tracked_updated.update(selected)
              # Simpan sebagai list
              with open(TRACKER_FILE, 'w') as f:
                  json.dump(list(tracked_updated), f, indent=2)
              print(f"Tracker diperbarui dengan {len(selected)} slug baru.")

          # Simpan selected slugs untuk artifact
          with open('selected_slugs.json', 'w') as f:
              json.dump(selected, f)

          # Set output untuk matrix
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"slugs={json.dumps(selected)}\n")
          EOF

      - name: Upload selected slugs
        uses: actions/upload-artifact@v4
        with:
          name: selected-slugs
          path: selected_slugs.json

  scrape:
    needs: select-slugs
    if: needs.select-slugs.outputs.slugs != '[]' && needs.select-slugs.outputs.slugs != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        slug: ${{ fromJson(needs.select-slugs.outputs.slugs) }}
      max-parallel: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary

      - name: Run full scrape for ${{ matrix.slug }} (auto merge)
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python asn/scraper.py --slug "${{ matrix.slug }}" --source auto

      - name: Upload updated JSON for ${{ matrix.slug }}
        uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.slug }}
          path: db/${{ matrix.slug }}.json
          if-no-files-found: ignore

  commit-changes:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all updated JSON files
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: db-*
          merge-multiple: true

      - name: Copy to db folder
        run: |
          mkdir -p db
          cp -v downloaded-artifacts/*.json db/ 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies for missing update
        run: pip install requests beautifulsoup4

      - name: Generate stats.json
        run: python generate_stats.py

      - name: Generate list.json
        run: python generate_list.py

      - name: Update missing.json
        run: python update_missing.py

      - name: Commit and push all changes (including tracker)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add db/ stats.json list.json missing.json tracker.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Auto-update: random full scrape dan statistik [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
