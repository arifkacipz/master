name: Matrix Full Scrape (Random)

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Sumber slug (missing, stats, missing_fields, atau kosongkan untuk otomatis)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - missing
          - stats
          - missing_fields
      filter_by:
        description: 'Filter berdasarkan total online atau chapterCount'
        required: false
        default: 'online'
        type: choice
        options:
          - online
          - chapterCount
      max_chapters:
        description: 'Batas total chapter (20, 50, 100, atau kosongkan untuk tidak ada batas)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '20'
          - '50'
          - '100'
          - '150'
      count:
        description: 'Jumlah slug yang dipilih (1-50)'
        required: false
        default: '5'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '10'
          - '15'
          - '20'
          - '30'
          - '40'
          - '50'
          - '75'
          - '90'
      manual_slugs:
        description: 'Daftar slug manual (pisah dengan koma atau baris baru, maksimal 20)'
        required: false
        default: ''
  schedule:
    - cron: '30 * * * *'

jobs:
  select-slugs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      slugs: ${{ steps.select.outputs.slugs }}
      selected_count: ${{ steps.select.outputs.selected_count }}
    steps:
      # ==========================================================
      # Batalkan diri sendiri jika ada workflow lain yang berjalan (termasuk queued)
      # ==========================================================
      - name: Cancel self if another workflow is running or queued
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            async function getRunningWorkflows() {
              const { data: runsInProgress } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, status: 'in_progress', per_page: 100
              });
              const { data: runsQueued } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, status: 'queued', per_page: 100
              });
              const allRuns = [...runsInProgress.workflow_runs, ...runsQueued.workflow_runs];
              const otherRunning = allRuns.filter(run => run.id !== currentRunId);
              return otherRunning;
            }
            const otherRunning = await getRunningWorkflows();
            if (otherRunning.length > 0) {
              console.log(`🔴 Ada ${otherRunning.length} workflow lain yang sedang berjalan atau antri. Membatalkan diri sendiri...`);
              otherRunning.forEach(r => console.log(`   - ${r.name} (${r.id}) status: ${r.status}`));
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: currentRunId });
              process.exit(1);
            } else {
              console.log('✅ Tidak ada workflow lain yang berjalan atau antri, melanjutkan...');
            }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Ensure stats.json exists
        run: |
          if [ ! -f stats.json ]; then
            echo "[]" > stats.json
          fi

      - name: Select slugs based on inputs
        id: select
        env:
          SOURCE: ${{ github.event.inputs.source }}
          FILTER_BY: ${{ github.event.inputs.filter_by }}
          MAX_CHAPTERS: ${{ github.event.inputs.max_chapters }}
          COUNT: ${{ github.event.inputs.count }}
          MANUAL_SLUGS: ${{ github.event.inputs.manual_slugs }}
        run: |
          python << EOF
          import os, json, random, re

          manual_slugs = os.environ.get('MANUAL_SLUGS', '').strip()
          source = os.environ.get('SOURCE', '').strip()
          filter_by = os.environ.get('FILTER_BY', 'online').strip()
          max_chapters_str = os.environ.get('MAX_CHAPTERS', '').strip()
          count_str = os.environ.get('COUNT', '50').strip()

          try:
              count = int(count_str) if count_str else 50
          except:
              count = 50
          count = min(max(count, 1), 90)

          TRACKER_FILE = 'tracker.json'
          selected = []

          def load_json_file(filename):
              if os.path.exists(filename):
                  with open(filename, 'r') as f:
                      return json.load(f)
              return None

          def filter_by_max_chapters(data, max_chapters, field):
              if not max_chapters:
                  return data
              max_val = int(max_chapters)
              result = []
              for item in data:
                  total = item.get(field, 0)
                  if total <= max_val:
                      result.append(item)
              return result

          # Jika manual_slugs diisi, gunakan itu
          if manual_slugs:
              parts = re.split(r'[,\n]+', manual_slugs)
              raw_slugs = [p.strip() for p in parts if p.strip()]
              seen = set()
              unique_slugs = []
              for slug in raw_slugs:
                  if slug not in seen:
                      seen.add(slug)
                      unique_slugs.append(slug)
              selected = unique_slugs[:20]
              print(f"Menggunakan manual slugs: {len(selected)} slug (maks 20)")
          else:
              source_order = []
              if source:
                  source_order = [source]
              else:
                  source_order = ['missing', 'stats', 'missing_fields']

              candidates = []
              used_sources = []
              for src in source_order:
                  if len(candidates) >= count:
                      break
                  data = None
                  if src == 'stats':
                      data = load_json_file('stats.json')
                      if data:
                          filtered = filter_by_max_chapters(data, max_chapters_str, filter_by)
                          new_slugs = [item['slug'] for item in filtered if item['slug'] not in candidates]
                          candidates.extend(new_slugs)
                          used_sources.append(src)
                          print(f"Dari stats.json: {len(new_slugs)} slug baru setelah filter (filter by {filter_by}).")
                  elif src == 'missing_fields':
                      data = load_json_file('missing_fields.json')
                      if data and isinstance(data, list):
                          extracted_slugs = []
                          for item in data:
                              if isinstance(item, dict) and 'slug' in item:
                                  extracted_slugs.append(item['slug'])
                              elif isinstance(item, str):
                                  extracted_slugs.append(item)
                          existing = set(candidates)
                          new_slugs = [s for s in extracted_slugs if s not in existing]
                          candidates.extend(new_slugs)
                          used_sources.append(src)
                          print(f"Dari missing_fields.json: {len(new_slugs)} slug baru.")
                  elif src == 'missing':
                      data = load_json_file('missing.json')
                      if data:
                          # missing.json mungkin tidak memiliki field online/chapterCount, jadi kita tidak filter
                          filtered = data
                          new_slugs = [item['slug'] for item in filtered if item['slug'] not in candidates]
                          candidates.extend(new_slugs)
                          used_sources.append(src)
                          print(f"Dari missing.json: {len(new_slugs)} slug baru (tanpa filter).")
                  else:
                      print(f"Sumber tidak dikenal: {src}")

              if candidates:
                  num_to_select = min(len(candidates), count)
                  selected = random.sample(candidates, num_to_select)
                  print(f"Terpilih {len(selected)} slug dari sumber {used_sources}")
              else:
                  print("Tidak ada kandidat yang tersedia.")

          # Update tracker
          if selected:
              if os.path.exists(TRACKER_FILE):
                  with open(TRACKER_FILE, 'r') as f:
                      try:
                          existing = json.load(f)
                          if isinstance(existing, list):
                              tracked_updated = set(existing)
                          elif isinstance(existing, dict):
                              tracked_updated = set(existing.keys())
                          else:
                              tracked_updated = set()
                      except:
                          tracked_updated = set()
              else:
                  tracked_updated = set()
              tracked_updated.update(selected)
              with open(TRACKER_FILE, 'w') as f:
                  json.dump(list(tracked_updated), f, indent=2)
              print(f"Tracker diperbarui dengan {len(selected)} slug baru.")
          else:
              if not os.path.exists(TRACKER_FILE):
                  with open(TRACKER_FILE, 'w') as f:
                      json.dump([], f)
                  print("Tracker dibuat kosong.")

          with open('selected_slugs.json', 'w') as f:
              json.dump(selected, f)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"slugs={json.dumps(selected)}\n")
              f.write(f"selected_count={len(selected)}\n")
          EOF

      - name: Upload selected slugs
        uses: actions/upload-artifact@v4
        with:
          name: selected-slugs
          path: selected_slugs.json

      - name: Upload tracker.json
        uses: actions/upload-artifact@v4
        with:
          name: tracker-json
          path: tracker.json

  scrape:
    needs: select-slugs
    if: needs.select-slugs.outputs.slugs != '[]' && needs.select-slugs.outputs.slugs != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        slug: ${{ fromJson(needs.select-slugs.outputs.slugs) }}
      max-parallel: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudinary selenium

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install ChromeDriver
        run: |
          CHROME_MAJOR=$(google-chrome --version | awk '{print $3}' | cut -d '.' -f1)
          echo "Chrome major version: $CHROME_MAJOR"
          JSON_URL="https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json"
          DRIVER_VERSION=$(curl -s $JSON_URL | jq -r --arg VERSION "$CHROME_MAJOR" '.versions[] | select(.version | startswith($VERSION + ".")) | .version' | head -1)
          if [ -z "$DRIVER_VERSION" ]; then
            echo "Gagal mendapatkan versi untuk Chrome $CHROME_MAJOR, menggunakan fallback 114.0.5735.90"
            DRIVER_VERSION="114.0.5735.90"
          fi
          echo "Mengunduh ChromeDriver versi: $DRIVER_VERSION"
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/$DRIVER_VERSION/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Run full scrape for ${{ matrix.slug }} (auto merge with Selenium)
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python asn/scraper.py --slug "${{ matrix.slug }}" --source auto --selenium

      # ========== Salin file JSON dengan nama asli ke root workspace ==========
      - name: Copy JSON file for upload
        run: |
          slug="${{ matrix.slug }}"
          first_char=$(echo "${slug:0:1}" | tr '[:upper:]' '[:lower:]')
          if [[ "$first_char" =~ [a-z0-9] ]]; then
            folder="$first_char"
          else
            folder="others"
          fi
          file_path="db/$folder/$slug.json"
          if [ -f "$file_path" ]; then
            echo "Found file: $file_path"
            cp "$file_path" "./$slug.json"
          else
            echo "File not found: $file_path"
            exit 1
          fi

      - name: Upload updated JSON for ${{ matrix.slug }}
        uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.slug }}
          path: ./${{ matrix.slug }}.json
          if-no-files-found: error

  commit-changes:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all updated JSON files
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: db-*
          merge-multiple: true

      - name: Download tracker.json
        uses: actions/download-artifact@v4
        with:
          name: tracker-json
          path: .

      # ========== Salin ke subfolder yang benar ==========
      - name: Copy to db folder with correct subfolders
        run: |
          mkdir -p db
          for file in downloaded-artifacts/*.json; do
            if [ -f "$file" ]; then
              slug=$(basename "$file" .json)
              first_char=$(echo "${slug:0:1}" | tr '[:upper:]' '[:lower:]')
              if [[ "$first_char" =~ [a-z0-9] ]]; then
                folder="$first_char"
              else
                folder="others"
              fi
              mkdir -p "db/$folder"
              cp "$file" "db/$folder/$slug.json"
              echo "Copied $file to db/$folder/$slug.json"
            fi
          done

      # ========== Generate semua laporan ==========
      - name: Generate list.json
        run: python asn/scraper.py --generate-list

      - name: Generate stats.json (chapterCount < 15)
        run: |
          python << EOF
          import os, json
          stats = []
          for root, dirs, files in os.walk('db'):
              for filename in files:
                  if filename.endswith('.json'):
                      with open(os.path.join(root, filename), 'r', encoding='utf-8') as f:
                          data = json.load(f)
                      slug = filename[:-5]
                      judul = data.get('judul', slug)
                      thumb = data.get('thumb', '')
                      online = data.get('online', len(data.get('chapters', [])))
                      chapterCount = data.get('chapterCount', len(data.get('chapters', [])))
                      chs = data.get('Chs', '')
                      source = data.get('source', 'unknown')
                      if chapterCount < 15:
                          stats.append({
                              'slug': slug,
                              'judul': judul,
                              'thumb': thumb,
                              'source': source,
                              'online': online,
                              'chapterCount': chapterCount,
                              'Chs': chs
                          })
          with open('stats.json', 'w', encoding='utf-8') as f:
              json.dump(stats, f, indent=2, ensure_ascii=False)
          print(f"stats.json diperbarui dengan {len(stats)} komik (chapterCount < 15).")
          EOF

      - name: Generate missing.json for all comics
        run: python miss.py

      - name: Check missing fields (source, online, Chs)
        run: python check_fields.py

      # ========== Commit ==========
      - name: Commit and push all changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add db/ stats.json list.json missing.json tracker.json missing_fields.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update: random full scrape dan statistik [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>Workflow:</b> ${{ github.workflow }}
            <b>Status:</b> ${{ job.status }}
            <b>Run ID:</b> ${{ github.run_id }}
            <b>Trigger:</b> ${{ github.event_name }}
            <b>Source:</b> ${{ github.event.inputs.source || 'auto' }}
            <b>Filter by:</b> ${{ github.event.inputs.filter_by || 'online' }}
            <b>Max Chapters:</b> ${{ github.event.inputs.max_chapters || 'none' }}
            <b>Selected slugs:</b> ${{ needs.select-slugs.outputs.slugs || 'none' }}
            <b>Changes committed:</b> ${{ steps.commit.outputs.committed }}
            <b>Repository:</b> ${{ github.repository }}
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">🔗 View Run</a>
