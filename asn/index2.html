<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Komik Otomatis</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            position: sticky;
            top: 0;
            background: var(--bg-color);
            padding: 10px 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 15px 0;
            color: var(--accent);
        }

        /* Kotak Pencarian */
        #searchBox {
            width: 90%;
            max-width: 400px;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid var(--card-bg);
            background: var(--card-bg);
            color: white;
            font-size: 16px; /* Agar iPhone tidak auto-zoom saat diklik */
            outline: none;
            transition: border-color 0.3s;
        }

        #searchBox:focus {
            border-color: var(--accent);
        }

        /* Grid Komik (2 Kolom di iPhone) */
        .comic-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        @media (min-width: 600px) {
            .comic-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none; /* Hilangkan garis bawah link */
            color: inherit;
            transition: transform 0.2s;
        }

        .card:active { transform: scale(0.96); }

        .thumbnail {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background: #334155;
        }

        .thumbnail img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .info {
            padding: 10px;
            flex-grow: 1;
        }

        .title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.2;
        }

        .chapter {
            font-size: 0.7rem;
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        #status {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📚 Comic Catalog</h1>
        <input type="text" id="searchBox" placeholder="Cari judul komik...">
    </div>

    <div id="status">Memuat data...</div>
    <div class="comic-grid" id="comicList"></div>

    <script>
        let allComics = [];

        async function loadData() {
            try {
                const response = await fetch('data.json');
                allComics = await response.json();
                
                if (allComics.length === 0) {
                    document.getElementById('status').innerText = "Data kosong. Tunggu robot selesai bekerja.";
                    return;
                }

                document.getElementById('status').style.display = 'none';
                displayComics(allComics);
            } catch (e) {
                document.getElementById('status').innerText = "Gagal memuat data.json";
            }
        }

        function displayComics(data) {
            const container = document.getElementById('comicList');
            container.innerHTML = "";

            data.forEach(item => {
                const card = document.createElement('a');
                card.className = 'card';
                // Link menuju halaman detail.html dengan parameter judul
                card.href = `detail.html?judul=${encodeURIComponent(item.judul)}`;
                
                card.innerHTML = `
                    <div class="thumbnail">
                        <img src="${item.gambar}" alt="${item.judul}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x210?text=No+Image'">
                    </div>
                    <div class="info">
                        <div class="title">${item.judul}</div>
                        <span class="chapter">${item.chapter_terbaru || 'Update'}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Fitur Pencarian Real-time
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allComics.filter(c => 
                c.judul.toLowerCase().includes(keyword)
            );
            displayComics(filtered);
        });

        loadData();
    </script>
</body>
</html>
