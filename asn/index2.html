<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetoMic - Katalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
    <header class="p-6 bg-purple-800 shadow-xl mb-10 text-center">
        <h1 class="text-3xl font-bold uppercase tracking-widest">PetoMic <span class="text-purple-300">ASN</span></h1>
    </header>

    <div class="container mx-auto px-4 pb-20">
        <div id="manga-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
            </div>
    </div>

    <script>
        // Mengambil data dari ROOT (luar folder asn)
        fetch('../list.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('manga-list');
                data.forEach(manga => {
                    container.innerHTML += `
                        <a href="detail.html?slug=${manga.slug}" class="bg-gray-800 rounded-xl overflow-hidden hover:ring-2 hover:ring-purple-500 transition block">
                            <img src="${manga.thumb}" class="w-full h-64 object-cover">
                            <div class="p-3 text-sm font-bold truncate">${manga.judul}</div>
                        </a>
                    `;
                });
            });
    </script>
</body>
</html>
