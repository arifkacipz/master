<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetoMic - Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="content" class="container mx-auto px-4 py-10 max-w-2xl">
        <div class="text-center text-gray-500">Memuat data...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        // Mengambil data dari folder db di ROOT
        fetch(`../db/${slug}.json`)
            .then(res => res.json())
            .then(manga => {
                const content = document.getElementById('content');
                let chaptersHtml = '';
                manga.chapters.forEach((ch, index) => {
                    chaptersHtml += `
                        <a href="reader.html?slug=${slug}&ch=${index}" class="block p-4 bg-gray-800 border-b border-gray-700 hover:bg-purple-800 transition">
                            ${ch.nama}
                        </a>
                    `;
                });

                content.innerHTML = `
                    <div class="flex flex-col items-center mb-8">
                        <img src="${manga.thumb}" class="w-48 rounded-lg shadow-2xl mb-4 border-2 border-purple-500">
                        <h1 class="text-2xl font-bold">${manga.judul}</h1>
                    </div>
                    <div class="rounded-xl overflow-hidden border border-gray-700">
                        ${chaptersHtml}
                    </div>
                    <div class="mt-6 text-center">
                        <a href="index2.html" class="text-gray-400 hover:text-purple-400 text-sm">← Kembali ke Katalog</a>
                    </div>
                `;
            });
    </script>
</body>
</html>
