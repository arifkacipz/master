<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Detail... - PetoMic</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen font-sans">
    <header class="sticky top-0 z-50 bg-zinc-900/80 backdrop-blur-lg border-b border-white/5 p-4">
        <div class="container mx-auto max-w-xl flex justify-between items-center">
            <a href="index2.html" class="text-[10px] font-black text-zinc-500 hover:text-white transition uppercase tracking-[0.2em] flex items-center gap-2">
                <span class="text-lg">«</span> Back to Home
            </a>
            <span class="text-[10px] font-black uppercase tracking-widest text-zinc-600">Info Detail</span>
        </div>
    </header>

    <div id="content" class="container mx-auto px-4 py-8 max-w-xl">
        <div class="text-center py-20 text-zinc-800 animate-pulse uppercase tracking-widest text-xs font-bold">
            Menghubungkan ke Database...
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        fetch(`../db/${slug}.json`)
            .then(res => res.json())
            .then(manga => {
                const content = document.getElementById('content');
                
                // --- UPDATE TITLE HALAMAN (FORMAT: Judul - PetoMic) ---
                document.title = `${manga.judul} - PetoMic`;

                let listHtml = manga.chapters.map((ch, i) => `
                    <a href="reader.html?slug=${slug}&ch=${i}" class="flex justify-between items-center p-5 bg-zinc-900 border-b border-white/5 hover:bg-purple-900/20 transition group">
                        <span class="font-bold text-sm text-zinc-300 group-hover:text-white">${ch.nama}</span>
                        <span class="text-[10px] text-purple-500 font-black border border-purple-500/30 px-2 py-1 rounded">BACA</span>
                    </a>
                `).reverse().join('');

                content.innerHTML = `
                    <div class="flex flex-col items-center mb-8 text-center">
                        <img src="${manga.thumb}" class="w-48 rounded-2xl shadow-2xl mb-6 object-cover h-72 border-2 border-white/5">
                        <h1 class="text-3xl font-black mb-3 tracking-tighter leading-none uppercase">${manga.judul}</h1>
                        
                        <div class="flex items-center gap-2 bg-black p-2 px-4 rounded-full border border-white/10 mb-4">
                            <span class="text-[10px] text-zinc-500 font-bold uppercase mr-1">Slug:</span>
                            <code class="text-purple-400 text-xs font-mono font-bold">${slug}</code>
                            <button onclick="copySlug('${slug}')" class="bg-white text-black text-[10px] px-3 py-1 rounded-full font-black hover:bg-purple-400 transition">COPY</button>
                        </div>
                    </div>

                    <div class="bg-zinc-900 rounded-3xl overflow-hidden shadow-2xl border border-white/5 mb-8">
                        <div class="p-5 bg-zinc-900/50 text-[10px] font-black uppercase text-zinc-500 tracking-widest border-b border-white/5 flex justify-between">
                            <span>Daftar Chapter</span>
                            <span class="text-purple-500">${manga.chapters.length} Total</span>
                        </div>
                        <div class="max-h-[500px] overflow-y-auto">${listHtml}</div>
                    </div>

                    <div class="bg-indigo-900/20 border border-indigo-500/30 rounded-2xl p-5 mb-10">
                        <p class="text-[11px] font-bold text-indigo-300 uppercase mb-2 italic tracking-wider">💡 Tips Scrape Total Chapter:</p>
                        <ul class="text-[10px] text-zinc-400 space-y-2 list-disc ml-4 leading-relaxed">
                            <li>Buka tab <b>Actions</b> di repositori GitHub Anda.</li>
                            <li>Pilih workflow <b>Update PetoMic Data</b> di sisi kiri.</li>
                            <li>Klik tombol <b>Run workflow</b> (warna abu-abu).</li>
                            <li>Masukkan/tempel slug komik ini: <b class="text-white">${slug}</b>.</li>
                            <li>Klik <b>Run workflow</b> hijau dan tunggu robot selesai mengambil semua data.</li>
                        </ul>
                    </div>

                    <div class="mt-8 text-center pb-10">
                        <a href="index2.html" class="text-zinc-600 hover:text-white text-[10px] font-black uppercase tracking-[0.3em] transition">← Kembali ke Katalog</a>
                    </div>
                `;
            })
            .catch(() => {
                document.getElementById('content').innerHTML = `
                    <div class="text-center py-20 text-red-500 text-sm font-bold uppercase tracking-widest">
                        Gagal memuat data komik!
                    </div>`;
            });

        function copySlug(text) {
            navigator.clipboard.writeText(text);
            alert("Slug '" + text + "' berhasil disalin!");
        }
    </script>
</body>
</html>
