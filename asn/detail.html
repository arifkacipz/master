<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Detail... - PetoMic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom horizontal scroll */
        .horizontal-scroll {
            scrollbar-width: thin;
            scrollbar-color: #9333ea #1a1a1a;
        }
        .horizontal-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .horizontal-scroll::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }
        .horizontal-scroll::-webkit-scrollbar-thumb {
            background: #9333ea;
            border-radius: 10px;
        }
        /* Toast notification */
        .toast-notify {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <header class="sticky top-0 z-50 bg-zinc-900/80 backdrop-blur-lg border-b border-white/5 p-4">
        <div class="container mx-auto max-w-xl flex justify-between items-center">
            <a href="/asn/" class="text-[10px] font-black text-zinc-500 hover:text-white transition uppercase tracking-[0.2em]">« Back to Home</a>
        </div>
    </header>

    <div id="content" class="container mx-auto px-4 py-8 max-w-xl"></div>

    <!-- List of comics with less than 15 chapters -->
    <div id="low-chapter-section" class="container mx-auto px-4 py-8 max-w-xl hidden">
        <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
            <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
            <span id="low-chapter-title">Comics &lt;15 Chapters</span>
        </h2>
        <div id="low-chapter-list" class="flex gap-4 overflow-x-auto pb-4 horizontal-scroll">
            <!-- Will be filled by JavaScript -->
        </div>
    </div>

    <script>
        // ==================== READING PROGRESS FUNCTIONS ====================
        // Save the last read chapter per comic
        function saveProgress(slug, chapterNumber) {
            try {
                const key = `petomic_progress_${slug}`;
                localStorage.setItem(key, chapterNumber);
            } catch (e) {
                console.warn('Failed to save progress:', e);
            }
        }

        // Get the last read chapter for this comic
        function getProgress(slug) {
            try {
                const key = `petomic_progress_${slug}`;
                return localStorage.getItem(key);
            } catch (e) {
                console.warn('Failed to read progress:', e);
                return null;
            }
        }

        // ==================== FUNCTION TO DETERMINE JSON FILE PATH ====================
        function getDbPath(slug) {
            if (!slug) return '';
            const firstChar = slug[0].toLowerCase();
            let folder;
            if (/[a-z0-9]/.test(firstChar)) {
                folder = firstChar;
            } else {
                folder = 'others';
            }
            return `../db/${folder}/${slug}.json`;
        }

        // ==================== MAIN DETAIL FUNCTIONS ====================
        function getChapterNumber(chapterName) {
            const match = chapterName.match(/\d+(\.\d+)?/);
            return match ? match[0] : '';
        }

        // Get slug from URL (clean URL: /asn/{slug})
        let slug = window.location.pathname.split('/').filter(Boolean).pop();
        if (!slug) {
            const urlParams = new URLSearchParams(window.location.search);
            slug = urlParams.get('slug');
        }
        if (!slug) {
            document.getElementById('content').innerHTML = '<p class="text-center text-red-500">Slug not found.</p>';
            throw new Error('Slug not found');
        }

        // ==================== LOAD MAIN COMIC DATA ====================
        Promise.all([
            fetch(getDbPath(slug)).then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            }),
            fetch('../stats.json').then(res => res.json()).catch(() => []) // stats file
        ])
        .then(([manga, stats]) => {
            document.title = `${manga.judul} - PetoMic`;

            // Determine first and last chapter
            const firstChapter = manga.chapters[0];
            const lastChapter = manga.chapters[manga.chapters.length - 1];
            const firstChapterNumber = getChapterNumber(firstChapter.nama) || 0;
            const lastChapterNumber = getChapterNumber(lastChapter.nama) || (manga.chapters.length - 1);

            // Check progress
            const savedProgress = getProgress(slug);
            let continueChapterNumber = savedProgress;
            let continueChapter = null;
            if (continueChapterNumber) {
                // Find chapter with matching number
                continueChapter = manga.chapters.find(ch => getChapterNumber(ch.nama) === continueChapterNumber);
            }

            // Build chapter list
            let listHtml = manga.chapters.map((ch, i) => {
                const chapterNumber = getChapterNumber(ch.nama) || i;
                return `
                    <a href="/asn/${slug}/ch-${chapterNumber}" class="flex justify-between items-center p-5 bg-zinc-900 border-b border-white/5 hover:bg-purple-900/20 transition group">
                        <span class="font-bold text-sm text-zinc-300 group-hover:text-white">${ch.nama}</span>
                        <span class="text-[10px] text-purple-500 font-black border border-purple-500/30 px-2 py-1 rounded">READ</span>
                    </a>
                `;
            }).reverse().join('');

            // Build action buttons
            let actionButtons = `
                <div class="flex flex-wrap gap-3 justify-center mb-8">
                    <a href="/asn/${slug}/ch-${firstChapterNumber}" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-xl text-sm transition flex-1 min-w-[120px] text-center">Start Reading</a>
            `;

            if (continueChapter) {
                actionButtons += `
                    <a href="/asn/${slug}/ch-${continueChapterNumber}" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-xl text-sm transition flex-1 min-w-[120px] text-center">Continue Reading</a>
                `;
            }

            actionButtons += `
                    <a href="/asn/${slug}/ch-${lastChapterNumber}" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-6 rounded-xl text-sm transition flex-1 min-w-[120px] text-center">Read Latest Chapter</a>
                </div>
            `;

            // Display main content (without Manga Identification and tips)
            document.getElementById('content').innerHTML = `
                <div class="flex flex-col items-center mb-6 text-center">
                    <img src="${manga.thumb}" class="w-48 rounded-2xl shadow-2xl mb-6 object-cover h-72 border-2 border-white/5">
                    <h1 class="text-3xl font-black mb-1 uppercase">${manga.judul}</h1>
                </div>
                ${actionButtons}
                <div class="bg-zinc-900 rounded-3xl overflow-hidden shadow-2xl border border-white/5 mb-8">
                    <div class="p-5 bg-zinc-900/50 text-[10px] font-black uppercase text-zinc-500 tracking-widest border-b border-white/5 flex justify-between">
                        <span>Chapter List</span><span class="text-purple-500">${manga.chapters.length} Total</span>
                    </div>
                    <div class="max-h-[500px] overflow-y-auto">${listHtml}</div>
                </div>
            `;

            // ==================== DISPLAY COMICS WITH CHAPTERS < 15 ====================
            if (stats.length > 0) {
                // Filter comics with chapters < 15
                const lowChapterComics = stats.filter(comic => comic.chapterCount < 15);
                if (lowChapterComics.length > 0) {
                    // Update title with total count
                    document.getElementById('low-chapter-title').innerText = `Comics <15 Chapters = (${lowChapterComics.length})`;

                    // Take max 10 or all
                    const limited = lowChapterComics.slice(0, 10);
                    const listContainer = document.getElementById('low-chapter-list');
                    listContainer.innerHTML = limited.map(comic => `
                        <a href="/asn/${comic.slug}" class="flex-none w-36 bg-zinc-900 rounded-xl overflow-hidden hover:scale-105 transition border border-white/5">
                            <img src="${comic.thumb}" class="w-full h-36 object-cover" loading="lazy">
                            <div class="p-2">
                                <div class="text-xs font-bold truncate">${comic.judul}</div>
                                <div class="text-[10px] text-zinc-500">${comic.chapterCount} chapters</div>
                            </div>
                        </a>
                    `).join('');
                    document.getElementById('low-chapter-section').classList.remove('hidden');
                }
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById('content').innerHTML = '<p class="text-center text-zinc-500">Failed to load data.</p>';
        });
    </script>
</body>
</html>
