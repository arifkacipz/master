<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>PetoMic - Detail</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; }
        body { background: var(--bg); color: white; font-family: sans-serif; padding: 20px; }
        .back { color: var(--accent); text-decoration: none; font-weight: bold; display: block; margin-bottom: 20px; }
        .comic-info { text-align: center; margin-bottom: 30px; }
        .comic-info img { width: 160px; border-radius: 10px; border: 2px solid #334155; }
        .ch-box { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #334155; }
        .ch-link { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #334155; color: white; text-decoration: none; }
        .tips-box { margin-top: 40px; padding: 15px; background: var(--card); border-radius: 8px; font-size: 13px; border: 1px dashed #475569; }
        #slug-hint { display: inline-block; background: #0f172a; color: var(--accent); padding: 5px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; border: 1px solid var(--accent); margin-top: 10px; }
        #copy-status { font-size: 11px; color: #10b981; display: none; margin-left: 10px; }
    </style>
</head>
<body>
    <a href="index2.html" class="back">← Kembali ke Katalog</a>
    <div id="content">
        <div class="comic-info" id="header"></div>
        <div class="ch-box" id="list"></div>
        <div class="tips-box">
            <strong>PetoMic Full Scrape:</strong> Jalankan di Actions dengan slug:
            <br><div id="slug-hint">Memuat...</div> <span id="copy-status">Copied!</span>
        </div>
    </div>
    <script>
        const slug = new URLSearchParams(window.location.search).get('slug');
        document.getElementById('slug-hint').innerText = slug;
        document.getElementById('slug-hint').onclick = () => {
            navigator.clipboard.writeText(slug).then(() => {
                document.getElementById('copy-status').style.display = 'inline';
                setTimeout(() => document.getElementById('copy-status').style.display = 'none', 2000);
            });
        };
        async function load() {
            const res = await fetch(`db/${slug}.json`);
            const d = await res.json();
            document.getElementById('header').innerHTML = `<img src="${d.thumb}"><h2>${d.judul}</h2>`;
            let html = "";
            for (let i = d.chapters.length - 1; i >= 0; i--) {
                html += `<a href="reader.html?slug=${slug}&ch=${i}" class="ch-link">
                    <span>${d.chapters[i].nama}</span><span style="color:var(--accent)">BACA →</span>
                </a>`;
            }
            document.getElementById('list').innerHTML = html;
        }
        load();
    </script>
</body>
</html>
