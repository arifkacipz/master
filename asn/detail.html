<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Detail... - PetoMic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Scroll horizontal untuk recent (opsional, jika ingin konsisten) */
        .recent-scroll {
            scrollbar-width: thin;
            scrollbar-color: #9333ea #1a1a1a;
        }
        .recent-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .recent-scroll::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .recent-scroll::-webkit-scrollbar-thumb {
            background: #9333ea;
            border-radius: 20px;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <header class="sticky top-0 z-50 bg-zinc-900/80 backdrop-blur-lg border-b border-white/5 p-4">
        <div class="container mx-auto max-w-xl flex justify-between items-center">
            <a href="/asn/" class="text-[10px] font-black text-zinc-500 hover:text-white transition uppercase tracking-[0.2em]">« Back to Home</a>
        </div>
    </header>

    <div id="content" class="container mx-auto px-4 py-8 max-w-xl"></div>

    <!-- Bagian Terakhir Dibaca (akan muncul jika ada riwayat) -->
    <div id="recent-section" class="container mx-auto px-4 py-8 max-w-xl hidden">
        <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
            <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>Terakhir Dibaca</span>
        </h2>
        <div id="recent-list" class="flex gap-4 overflow-x-auto pb-4 recent-scroll">
            <!-- Akan diisi JavaScript -->
        </div>
    </div>

    <script>
        // ==================== FUNGSI RECENT (localStorage) ====================
        // Fungsi untuk menambah komik ke daftar terakhir dibaca
        window.addToRecent = function(slug, judul, thumb) {
            try {
                const recent = localStorage.getItem('petomic_recent');
                let recentData = recent ? JSON.parse(recent) : [];
                
                // Hapus jika sudah ada (pindahkan ke paling atas)
                recentData = recentData.filter(item => item.slug !== slug);
                
                // Tambah ke awal
                recentData.unshift({
                    slug: slug,
                    judul: judul,
                    thumb: thumb,
                    waktu: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })
                });
                
                // Batasi hanya 4
                if (recentData.length > 4) {
                    recentData = recentData.slice(0, 4);
                }
                
                localStorage.setItem('petomic_recent', JSON.stringify(recentData));
                
                // Update tampilan recent di halaman ini (jika ada)
                renderRecentComics(recentData);
            } catch (e) {
                console.warn('Gagal menyimpan riwayat:', e);
            }
        };

        // Fungsi untuk menampilkan daftar recent
        function renderRecentComics(recentData) {
            const recentSection = document.getElementById('recent-section');
            const recentList = document.getElementById('recent-list');
            
            if (!recentData || recentData.length === 0) {
                recentSection.classList.add('hidden');
                return;
            }
            
            recentSection.classList.remove('hidden');
            recentList.innerHTML = '';
            recentData.forEach(item => {
                recentList.innerHTML += `
                    <a href="/asn/${item.slug}" class="flex-none w-36 bg-zinc-900 rounded-xl overflow-hidden hover:scale-105 transition border border-white/5">
                        <img src="${item.thumb}" class="w-full h-36 object-cover" loading="lazy">
                        <div class="p-2">
                            <div class="text-xs font-bold truncate">${item.judul}</div>
                            <div class="text-[10px] text-zinc-500 mt-1">${item.waktu}</div>
                        </div>
                    </a>
                `;
            });
        }

        // ==================== FUNGSI UTAMA DETAIL ====================
        function getChapterNumber(chapterName) {
            const match = chapterName.match(/\d+(\.\d+)?/);
            return match ? match[0] : '';
        }

        // Ambil slug dari URL (clean URL: /asn/{slug})
        let slug = window.location.pathname.split('/').filter(Boolean).pop();

        if (!slug) {
            // Fallback ke query string jika tidak ada di path
            const urlParams = new URLSearchParams(window.location.search);
            slug = urlParams.get('slug');
        }

        if (!slug) {
            document.getElementById('content').innerHTML = '<p class="text-center text-red-500">Slug tidak ditemukan.</p>';
            throw new Error('Slug tidak ditemukan');
        }

        // Fetch data komik dari folder db di root
        fetch(`../db/${slug}.json`)
            .then(res => res.json())
            .then(manga => {
                document.title = `${manga.judul} - PetoMic`;

                // Catat kunjungan ke recent
                window.addToRecent(slug, manga.judul, manga.thumb);

                // Buat daftar chapter dengan link ke reader (format /asn/{slug}/ch-{chapter})
                let listHtml = manga.chapters.map((ch, i) => {
                    const chapterNumber = getChapterNumber(ch.nama) || i;
                    return `
                        <a href="/asn/${slug}/ch-${chapterNumber}" class="flex justify-between items-center p-5 bg-zinc-900 border-b border-white/5 hover:bg-purple-900/20 transition group">
                            <span class="font-bold text-sm text-zinc-300 group-hover:text-white">${ch.nama}</span>
                            <span class="text-[10px] text-purple-500 font-black border border-purple-500/30 px-2 py-1 rounded">BACA</span>
                        </a>
                    `;
                }).reverse().join('');

                // Tampilkan konten utama
                document.getElementById('content').innerHTML = `
                    <div class="flex flex-col items-center mb-10 text-center">
                        <img src="${manga.thumb}" class="w-48 rounded-2xl shadow-2xl mb-6 object-cover h-72 border-2 border-white/5">
                        <h1 class="text-3xl font-black mb-1 uppercase">${manga.judul}</h1>
                    </div>
                    <div class="bg-zinc-900 rounded-3xl overflow-hidden shadow-2xl border border-white/5 mb-8">
                        <div class="p-5 bg-zinc-900/50 text-[10px] font-black uppercase text-zinc-500 tracking-widest border-b border-white/5 flex justify-between">
                            <span>Daftar Chapter</span><span class="text-purple-500">${manga.chapters.length} Total</span>
                        </div>
                        <div class="max-h-[500px] overflow-y-auto">${listHtml}</div>
                    </div>
                    <div class="space-y-4 mb-10">
                        <div class="flex flex-col items-center gap-3 bg-zinc-900/50 p-4 rounded-2xl border border-white/5">
                            <span class="text-[10px] text-zinc-500 font-black uppercase">Manga Identification</span>
                            <div class="flex items-center gap-2 bg-black p-2 px-4 rounded-full border border-white/10">
                                <code class="text-purple-400 text-xs font-mono font-bold">${slug}</code>
                                <button onclick="navigator.clipboard.writeText('${slug}');alert('Slug dicopy!')" class="bg-white text-black text-[10px] px-4 py-1.5 rounded-full font-black uppercase">Copy</button>
                            </div>
                        </div>
                        <div class="bg-indigo-900/20 border border-indigo-500/30 rounded-2xl p-6 text-[10px] text-zinc-400 leading-relaxed">
                            <p class="font-bold text-indigo-300 uppercase mb-3 italic">💡 Panduan Komplit:</p>
                            <ul class="space-y-2 list-disc ml-4">
                                <li>Buka <b>Actions</b> > Pilih <b>Update Data</b>.</li>
                                <li>Klik <b>Run</b> dan masukkan: <b class="text-white">${slug}</b>.</li>
                            </ul>
                        </div>
                    </div>
                `;

                // Muat dan tampilkan daftar recent dari localStorage (untuk bagian bawah)
                try {
                    const recent = localStorage.getItem('petomic_recent');
                    if (recent) {
                        renderRecentComics(JSON.parse(recent));
                    }
                } catch (e) {
                    console.warn('Gagal memuat riwayat:', e);
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('content').innerHTML = '<p class="text-center text-zinc-500">Gagal memuat data.</p>';
            });
    </script>
</body>
</html>
