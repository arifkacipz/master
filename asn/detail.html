<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Detail Komik</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .back { color: #38bdf8; text-decoration: none; }
        .ch-box { background: #1e293b; margin-top: 20px; border-radius: 8px; }
        .ch-link { display: block; padding: 15px; border-bottom: 1px solid #334155; color: white; text-decoration: none; }
    </style>
</head>
<body>
    <a href="index2.html" class="back">← Kembali</a>
    <div id="content">Memuat...</div>

    <script>
        const slug = new URLSearchParams(window.location.search).get('slug');
        async function load() {
            const res = await fetch(`db/${slug}.json`);
            const d = await res.json();
            document.getElementById('content').innerHTML = `
                <h1>${d.judul}</h1>
                <img src="${d.thumb}" style="width:150px; border-radius:8px;">
                <div class="ch-box">
                    ${d.chapters.map((c, idx) => `
                        <a href="reader.html?slug=${slug}&ch=${idx}" class="ch-link">${c.nama}</a>
                    `).join('')}
                </div>
            `;
        }
        load();
    </script>
<div style="margin-top: 30px; padding: 15px; background: #334155; border-radius: 8px; font-size: 13px;">
    <strong>Tips:</strong> Jika chapter tidak lengkap, buka tab <strong>Actions</strong> di GitHub, pilih <strong>Update Comic Data</strong>, klik <strong>Run Workflow</strong>, dan masukkan slug: <code id="slug-hint" style="color:#38bdf8"></code>
</div>

<script>
    const slug = new URLSearchParams(window.location.search).get('slug');
    document.getElementById('slug-hint').innerText = slug;
    // ... sisa kode load data detail ...
</script>

</body>
</html>
