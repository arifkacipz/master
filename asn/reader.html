<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetoMic Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; touch-action: manipulation; }
        img { min-height: 300px; background: #0a0a0a; display: block; width: 100%; max-width: 672px; margin: 0 auto; }
        .nav-btn { flex: 1; padding: 14px; font-weight: 800; font-size: 12px; text-transform: uppercase; text-align: center; border-radius: 12px; transition: all 0.3s ease; }
        .btn-prev { background: #27272a; color: #a1a1aa; }
        .btn-next { background: #7e22ce; color: white; box-shadow: 0 4px 14px 0 rgba(126, 34, 206, 0.39); }
        .disabled { opacity: 0.1; pointer-events: none; }
        /* Animasi Transisi Menu */
        #bottom-nav { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .menu-hidden { transform: translateY(110%); }
    </style>
</head>
<body class="text-white">

    <div id="tap-area" class="flex flex-col items-center min-h-screen pb-40">
        <div id="loader" class="mt-40 text-zinc-600 text-sm font-bold tracking-widest animate-pulse uppercase">Menghubungkan ke Server...</div>
    </div>

    <div id="bottom-nav" class="fixed bottom-0 left-0 w-full p-4 bg-zinc-900/90 backdrop-blur-xl border-t border-white/10 shadow-[0_-20px_50px_rgba(0,0,0,0.8)] z-50">
        <div class="max-w-md mx-auto flex flex-col gap-3">
            
            <div class="flex justify-between items-center px-1">
                <span id="ch-label" class="text-[10px] font-black text-zinc-500 uppercase tracking-tighter">Memuat...</span>
                <span class="text-[10px] text-zinc-600 italic">Tap layar untuk fokus baca</span>
            </div>
            
            <select id="ch-selector" class="w-full bg-black border border-white/10 text-xs rounded-xl p-3 outline-none text-purple-400 font-bold appearance-none text-center">
                <option>Memuat daftar chapter...</option>
            </select>

            <div class="flex gap-2">
                <button id="prev-btn" class="nav-btn btn-prev disabled">Prev</button>
                
                <a id="back-detail" href="#" class="bg-zinc-800 px-6 rounded-xl flex items-center justify-center border border-white/5 hover:bg-zinc-700 transition group" title="Detail Komik">
                    <span class="text-xl font-black text-zinc-400 group-hover:text-purple-400">!</span>
                </a>
                
                <button id="next-btn" class="nav-btn btn-next disabled">Next</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const chIndex = parseInt(urlParams.get('ch'));

        // Set Link Kembali ke Detail Komik
        document.getElementById('back-detail').href = `detail.html?slug=${slug}`;

        fetch(`../db/${slug}.json`)
            .then(res => res.json())
            .then(manga => {
                const chapter = manga.chapters[chIndex];
                if (!chapter) return;

                // --- 1. Update Judul Halaman ---
                document.title = `${manga.judul} ${chapter.nama} - PetoMic`;

                document.getElementById('loader').remove();
                document.getElementById('ch-label').innerText = chapter.nama;
                
                // --- 2. Dropdown Navigasi ---
                const selector = document.getElementById('ch-selector');
                selector.innerHTML = manga.chapters.map((ch, i) => 
                    `<option value="${i}" ${i === chIndex ? 'selected' : ''}>${ch.nama}</option>`
                ).reverse().join('');
                selector.onchange = (e) => location.href = `reader.html?slug=${slug}&ch=${e.target.value}`;

                // --- 3. Logika Tombol Prev/Next ---
                if (chIndex > 0) {
                    const btn = document.getElementById('prev-btn');
                    btn.classList.remove('disabled');
                    btn.onclick = () => location.href = `reader.html?slug=${slug}&ch=${chIndex - 1}`;
                }
                if (chIndex < manga.chapters.length - 1) {
                    const btn = document.getElementById('next-btn');
                    btn.classList.remove('disabled');
                    btn.onclick = () => location.href = `reader.html?slug=${slug}&ch=${chIndex + 1}`;
                }

                // --- 4. Render Gambar (Sorting Numeric) ---
                const container = document.getElementById('tap-area');
                const sortedImages = chapter.images.sort((a, b) => {
                    return a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
                });

                sortedImages.forEach(imgUrl => {
                    const img = document.createElement('img');
                    img.src = imgUrl; 
                    img.loading = "lazy";
                    img.className = "shadow-2xl border-b border-white/5";
                    img.onerror = () => img.remove();
                    container.appendChild(img);
                });
            });

        // --- 5. Fitur Tap to Hide Menu ---
        let menuVisible = true;
        document.body.addEventListener('click', (e) => {
            // Abaikan klik jika yang diklik adalah bagian dari menu navigasi
            if (!e.target.closest('#bottom-nav')) {
                menuVisible = !menuVisible;
                const nav = document.getElementById('bottom-nav');
                if (menuVisible) {
                    nav.classList.remove('menu-hidden');
                } else {
                    nav.classList.add('menu-hidden');
                }
            }
        });
    </script>
</body>
</html>
