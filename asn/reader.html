<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reader</title>
    <style>
        body { background: #000; color: white; margin: 0; font-family: sans-serif; }
        .content img { width: 100%; display: block; }
        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(30,41,59,0.9); display: flex; justify-content: space-around; padding: 15px; backdrop-filter: blur(5px); }
        .btn { background: #38bdf8; color: black; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .disabled { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>
    <div id="images"></div>
    <div style="height: 80px;"></div>
    <div class="nav">
        <a id="prev" class="btn">Prev</a>
        <a href="index2.html" style="color:white; padding-top:5px;">Menu</a>
        <a id="next" class="btn">Next</a>
    </div>

    <script>
        const p = new URLSearchParams(window.location.search);
        const slug = p.get('slug');
        const chIdx = parseInt(p.get('ch'));

        async function load() {
            const res = await fetch(`db/${slug}.json`);
            const d = await res.json();
            const ch = d.chapters[chIdx];

            document.title = d.judul + " - " + ch.nama;
            const container = document.getElementById('images');
            ch.images.forEach(img => {
                const el = document.createElement('img');
                el.src = img;
                el.loading = "lazy";
                container.appendChild(el);
            });

            const prev = document.getElementById('prev');
            const next = document.getElementById('next');

            if(chIdx < d.chapters.length - 1) prev.href = `reader.html?slug=${slug}&ch=${chIdx+1}`;
            else prev.classList.add('disabled');

            if(chIdx > 0) next.href = `reader.html?slug=${slug}&ch=${chIdx-1}`;
            else next.classList.add('disabled');
        }
        load();
    </script>
</body>
</html>
