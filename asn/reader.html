<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetoMic - Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
    <div class="fixed top-0 left-0 w-full p-4 bg-black/90 flex justify-between items-center z-50">
        <a href="javascript:history.back()" class="px-4 py-1 bg-gray-800 rounded text-xs">KEMBALI</a>
        <span id="ch-title" class="font-bold text-xs uppercase text-purple-400 tracking-widest"></span>
        <div></div>
    </div>

    <div id="image-container" class="mt-16 flex flex-col items-center">
        </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const chIndex = parseInt(urlParams.get('ch'));

        // Ambil data dari ROOT
        fetch(`../db/${slug}.json`)
            .then(res => res.json())
            .then(manga => {
                const chapter = manga.chapters[chIndex];
                document.getElementById('ch-title').innerText = chapter.nama;
                
                const container = document.getElementById('image-container');
                chapter.images.forEach(imgUrl => {
                    const img = document.createElement('img');
                    img.src = imgUrl;
                    img.className = "w-full max-w-3xl mb-0.5";
                    img.loading = "lazy";
                    container.appendChild(img);
                });
            });
    </script>
</body>
</html>
