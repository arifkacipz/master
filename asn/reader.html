<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetoMic - Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        img { min-height: 200px; background: #0a0a0a; }
        .nav-btn { flex: 1; padding: 12px; font-weight: bold; font-size: 11px; text-transform: uppercase; text-align: center; border-radius: 8px; transition: 0.2s; }
        .btn-prev { background: #27272a; color: #a1a1aa; }
        .btn-next { background: #7e22ce; color: white; }
        .disabled { opacity: 0.2; pointer-events: none; }
    </style>
</head>
<body class="bg-black text-white">

    <div id="image-container" class="flex flex-col items-center bg-zinc-950 min-h-screen pb-32">
        <div id="loader" class="mt-40 text-gray-500 animate-pulse">Menyiapkan halaman...</div>
    </div>

    <div class="fixed bottom-0 left-0 w-full p-4 bg-zinc-900/95 backdrop-blur-md border-t border-white/5 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] z-50">
        <div class="max-w-xl mx-auto flex flex-col gap-3">
            
            <select id="ch-selector" class="w-full bg-black border border-white/10 text-xs rounded-lg p-2 outline-none text-purple-400 font-bold">
                <option>Memuat daftar chapter...</option>
            </select>

            <div class="flex gap-2">
                <button id="prev-btn" class="nav-btn btn-prev disabled">Prev</button>
                <a href="index2.html" class="bg-zinc-800 p-3 rounded-lg text-xs flex items-center justify-center">🏠</a>
                <button id="next-btn" class="nav-btn btn-next disabled">Next</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const chIndex = parseInt(urlParams.get('ch'));

        fetch(`../db/${slug}.json`)
            .then(res => res.json())
            .then(manga => {
                const chapter = manga.chapters[chIndex];
                if (!chapter) throw new Error("Chapter tidak ditemukan");

                document.getElementById('loader').remove();
                
                // 1. Dropdown Navigasi
                const selector = document.getElementById('ch-selector');
                selector.innerHTML = manga.chapters.map((ch, i) => 
                    `<option value="${i}" ${i === chIndex ? 'selected' : ''}>${ch.nama}</option>`
                ).reverse().join('');
                selector.onchange = (e) => location.href = `reader.html?slug=${slug}&ch=${e.target.value}`;

                // 2. Tombol Prev/Next
                if (chIndex > 0) {
                    const btn = document.getElementById('prev-btn');
                    btn.classList.remove('disabled');
                    btn.onclick = () => location.href = `reader.html?slug=${slug}&ch=${chIndex - 1}`;
                }
                if (chIndex < manga.chapters.length - 1) {
                    const btn = document.getElementById('next-btn');
                    btn.classList.remove('disabled');
                    btn.onclick = () => location.href = `reader.html?slug=${slug}&ch=${chIndex + 1}`;
                }

                // 3. Sorting & Render Gambar (Solusi Blank)
                const container = document.getElementById('image-container');
                
                // Urutkan berdasarkan angka terakhir di URL (Timestamp)
                const sortedImages = chapter.images.sort((a, b) => {
                    return a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
                });

                if (sortedImages.length === 0) {
                    container.innerHTML = `<div class="mt-40 text-red-500">Gambar kosong di file JSON.</div>`;
                }

                sortedImages.forEach(imgUrl => {
                    const img = document.createElement('img');
                    // Tambahkan timestamp acak di ujung link untuk menembus cache CDN jika perlu
                    img.src = imgUrl; 
                    img.className = "w-full max-w-3xl mb-0 shadow-lg";
                    img.loading = "lazy";
                    
                    // Fallback jika gambar benar-benar tidak bisa dimuat
                    img.onerror = () => {
                        console.log("Gagal memuat: " + imgUrl);
                        img.style.display = 'none';
                    };
                    
                    container.appendChild(img);
                });
            })
            .catch(err => {
                document.getElementById('image-container').innerHTML = `<div class="mt-40 text-red-500 text-sm p-10 text-center">${err.message}. Pastikan file db/${slug}.json sudah benar.</div>`;
            });
    </script>
</body>
</html>
