<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetoMic - Katalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Mode daftar (list) */
        .list-mode {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .list-mode a {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #1a1a1a;
            border-radius: 0.75rem;
            padding: 0.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .list-mode a:hover {
            background: #2a2a2a;
            transform: translateX(4px);
        }
        .list-mode img {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 0.5rem;
        }
        .list-mode .judul {
            font-size: 1rem;
            font-weight: 600;
        }
        
        /* Tab style */
        .tab-active {
            background-color: #9333ea;
            color: white;
        }
        
        /* Scroll horizontal untuk recent */
        .recent-scroll {
            scrollbar-width: thin;
            scrollbar-color: #9333ea #1a1a1a;
        }
        .recent-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .recent-scroll::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .recent-scroll::-webkit-scrollbar-thumb {
            background: #9333ea;
            border-radius: 20px;
        }
    </style>
</head>
<body class="bg-black text-white font-sans">
    <header class="sticky top-0 z-50 bg-zinc-900/80 backdrop-blur-lg border-b border-white/5 p-4 shadow-2xl">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/asn/" class="text-2xl font-black tracking-tighter italic">PETO<span class="text-purple-500">MIC</span></a>
            <nav><a href="/asn/" class="text-[10px] font-black uppercase tracking-[0.2em] text-purple-400 border border-purple-500/30 px-3 py-1 rounded-full bg-purple-500/5">Home</a></nav>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8">
        <!-- ===== SECTION: TERAKHIR DIBACA ===== -->
        <div id="recent-section" class="mb-12 hidden">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>Terakhir Dibaca</span>
            </h2>
            <div id="recent-list" class="flex gap-4 overflow-x-auto pb-4 recent-scroll">
                <!-- Akan diisi JavaScript -->
            </div>
        </div>

        <!-- ===== SECTION: POPULER ===== -->
        <div id="popular-section" class="mb-12">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                    </svg>
                    <span>🔥 Hot & Populer</span>
                </h2>
                <!-- Tombol Sembunyikan/Tampilkan -->
                <button id="toggle-popular" class="p-2 rounded-lg hover:bg-zinc-800 transition" title="Sembunyikan bagian ini">
                    <svg id="eye-icon" class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
            
            <!-- Tab Navigator -->
            <div class="flex gap-2 mb-6 bg-zinc-900 p-1 rounded-xl border border-white/5 w-fit">
                <button id="tab-daily" class="tab-btn px-6 py-2 text-sm font-bold rounded-lg tab-active">Daily</button>
                <button id="tab-weekly" class="tab-btn px-6 py-2 text-sm font-bold rounded-lg text-zinc-400 hover:bg-zinc-800">Weekly</button>
                <button id="tab-monthly" class="tab-btn px-6 py-2 text-sm font-bold rounded-lg text-zinc-400 hover:bg-zinc-800">Monthly</button>
            </div>
            
            <!-- Container Popular -->
            <div id="popular-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
                <!-- Akan diisi JavaScript -->
            </div>
        </div>

        <!-- ===== SECTION: SEMUA KOMIK ===== -->
        <div class="mb-8">
            <h2 class="text-xl font-bold mb-4">Semua Komik</h2>
            
            <!-- Kontrol: Search, Mode Toggle -->
            <div class="flex flex-col sm:flex-row gap-4 items-center justify-between mb-8">
                <div class="relative w-full sm:w-64">
                    <input type="text" id="search-input" placeholder="Cari komik..." class="w-full bg-zinc-900 border border-white/10 rounded-xl px-4 py-2 pl-10 text-sm focus:outline-none focus:border-purple-500 transition">
                    <svg class="absolute left-3 top-2.5 h-4 w-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <div class="flex gap-2 bg-zinc-900 p-1 rounded-xl border border-white/5">
                    <button id="mode-grid" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-purple-600 text-white transition">Thumbnail</button>
                    <button id="mode-list" class="px-4 py-1.5 text-xs font-bold rounded-lg text-zinc-400 hover:bg-zinc-800 transition">Daftar</button>
                </div>
            </div>

            <!-- Container All Comics -->
            <div id="manga-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>

            <!-- Navigasi Halaman -->
            <div class="flex flex-wrap items-center justify-center gap-2 mt-12 pb-10">
                <button id="page-first" class="px-3 py-2 bg-zinc-900 border border-white/5 rounded-lg text-xs font-bold hover:bg-zinc-800 transition disabled:opacity-20 disabled:pointer-events-none">« First</button>
                <button id="page-prev" class="px-3 py-2 bg-zinc-900 border border-white/5 rounded-lg text-xs font-bold hover:bg-zinc-800 transition disabled:opacity-20 disabled:pointer-events-none">‹ Prev</button>
                <div id="page-numbers" class="flex gap-1 overflow-x-auto max-w-[300px] sm:max-w-md py-1"></div>
                <button id="page-next" class="px-3 py-2 bg-zinc-900 border border-white/5 rounded-lg text-xs font-bold hover:bg-zinc-800 transition disabled:opacity-20 disabled:pointer-events-none">Next ›</button>
                <button id="page-last" class="px-3 py-2 bg-zinc-900 border border-white/5 rounded-lg text-xs font-bold hover:bg-zinc-800 transition disabled:opacity-20 disabled:pointer-events-none">Last »</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== FUNGSI RECENT (localStorage) ====================
        // Fungsi untuk menambah komik ke daftar terakhir dibaca (dipanggil dari halaman detail/reader)
        window.addToRecent = function(slug, judul, thumb) {
            try {
                const recent = localStorage.getItem('petomic_recent');
                let recentData = recent ? JSON.parse(recent) : [];
                
                // Hapus jika sudah ada (pindahkan ke paling atas)
                recentData = recentData.filter(item => item.slug !== slug);
                
                // Tambah ke awal
                recentData.unshift({
                    slug: slug,
                    judul: judul,
                    thumb: thumb,
                    waktu: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })
                });
                
                // Batasi hanya 4
                if (recentData.length > 4) {
                    recentData = recentData.slice(0, 4);
                }
                
                localStorage.setItem('petomic_recent', JSON.stringify(recentData));
                
                // Update tampilan recent di halaman ini (jika ada)
                renderRecentComics(recentData);
            } catch (e) {
                console.warn('Gagal menyimpan riwayat:', e);
            }
        };

        // Fungsi untuk menampilkan daftar recent
        function renderRecentComics(recentData) {
            const recentSection = document.getElementById('recent-section');
            const recentList = document.getElementById('recent-list');
            
            if (!recentData || recentData.length === 0) {
                recentSection.classList.add('hidden');
                return;
            }
            
            recentSection.classList.remove('hidden');
            recentList.innerHTML = '';
            recentData.forEach(item => {
                recentList.innerHTML += `
                    <a href="/asn/${item.slug}" class="flex-none w-36 bg-zinc-900 rounded-xl overflow-hidden hover:scale-105 transition border border-white/5">
                        <img src="${item.thumb}" class="w-full h-36 object-cover" loading="lazy">
                        <div class="p-2">
                            <div class="text-xs font-bold truncate">${item.judul}</div>
                            <div class="text-[10px] text-zinc-500 mt-1">${item.waktu}</div>
                        </div>
                    </a>
                `;
            });
        }

        // ==================== KONFIGURASI UTAMA ====================
        const itemsPerPage = 20;
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        let mode = 'grid';
        let popularData = [];

        // Elemen DOM
        const container = document.getElementById('manga-list');
        const popularContainer = document.getElementById('popular-list');
        const popularSection = document.getElementById('popular-section');
        const togglePopularBtn = document.getElementById('toggle-popular');
        const eyeIcon = document.getElementById('eye-icon');
        const searchInput = document.getElementById('search-input');
        const modeGridBtn = document.getElementById('mode-grid');
        const modeListBtn = document.getElementById('mode-list');
        const pageNumbersDiv = document.getElementById('page-numbers');
        const pageFirst = document.getElementById('page-first');
        const pagePrev = document.getElementById('page-prev');
        const pageNext = document.getElementById('page-next');
        const pageLast = document.getElementById('page-last');
        
        // Tab buttons
        const tabDaily = document.getElementById('tab-daily');
        const tabWeekly = document.getElementById('tab-weekly');
        const tabMonthly = document.getElementById('tab-monthly');

        // ==================== FUNGSI POPULER ====================
        function generatePopularData() {
            if (!allData.length) return;
            popularData = allData.map((comic, index) => ({
                ...comic,
                dailyViews: Math.floor(Math.random() * 9000) + 1000,
                weeklyViews: Math.floor(Math.random() * 50000) + 5000,
                monthlyViews: Math.floor(Math.random() * 200000) + 20000
            }));
        }

        function renderPopular(tab = 'daily') {
            if (!popularData.length) return;
            
            let sorted = [];
            if (tab === 'daily') {
                sorted = [...popularData].sort((a, b) => b.dailyViews - a.dailyViews);
            } else if (tab === 'weekly') {
                sorted = [...popularData].sort((a, b) => b.weeklyViews - a.weeklyViews);
            } else {
                sorted = [...popularData].sort((a, b) => b.monthlyViews - a.monthlyViews);
            }
            
            const top6 = sorted.slice(0, 6);
            
            popularContainer.innerHTML = '';
            top6.forEach(manga => {
                let views = tab === 'daily' ? manga.dailyViews : (tab === 'weekly' ? manga.weeklyViews : manga.monthlyViews);
                popularContainer.innerHTML += `
                    <a href="/asn/${manga.slug}" class="bg-zinc-900 rounded-2xl overflow-hidden hover:scale-105 transition transform duration-300 block border border-white/5 shadow-xl relative">
                        <div class="absolute top-2 right-2 bg-purple-600 text-[10px] font-bold px-2 py-1 rounded-full">
                            ${views.toLocaleString()} 👁️
                        </div>
                        <img src="${manga.thumb}" class="w-full h-48 object-cover" loading="lazy">
                        <div class="p-3">
                            <div class="text-sm font-bold truncate">${manga.judul}</div>
                        </div>
                    </a>
                `;
            });
        }

        // ==================== FUNGSI TOGGLE POPULAR (PERBAIKAN) ====================
        function setPopularVisibility(hide) {
            if (hide) {
                popularSection.classList.add('hidden');
                // Ikon mata tertutup (eye-off)
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                `;
                togglePopularBtn.title = 'Tampilkan bagian ini';
                localStorage.setItem('petomic_hide_popular', 'true');
            } else {
                popularSection.classList.remove('hidden');
                // Ikon mata terbuka (eye)
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
                togglePopularBtn.title = 'Sembunyikan bagian ini';
                localStorage.setItem('petomic_hide_popular', 'false');
            }
        }

        // Inisialisasi status popular dari localStorage
        function initPopularToggle() {
            const hide = localStorage.getItem('petomic_hide_popular') === 'true';
            setPopularVisibility(hide);
        }

        // Event listener untuk tombol toggle
        togglePopularBtn.addEventListener('click', () => {
            const isHidden = popularSection.classList.contains('hidden');
            setPopularVisibility(!isHidden);
        });

        // ==================== FUNGSI RENDER UTAMA ====================
        function render() {
            const start = (currentPage - 1) * itemsPerPage;
            const pagedData = filteredData.slice(start, start + itemsPerPage);
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);

            container.innerHTML = '';
            pagedData.forEach(manga => {
                const a = document.createElement('a');
                a.href = `/asn/${manga.slug}`; // Clean URL (akan di-rewrite oleh Cloudflare)
                a.className = 'block';
                if (mode === 'grid') {
                    a.innerHTML = `
                        <div class="bg-zinc-900 rounded-2xl overflow-hidden hover:scale-105 transition transform duration-300 border border-white/5 shadow-xl">
                            <img src="${manga.thumb}" class="w-full h-64 object-cover" loading="lazy">
                            <div class="p-3 text-sm font-bold truncate">${manga.judul}</div>
                        </div>
                    `;
                } else {
                    a.innerHTML = `
                        <div class="flex items-center gap-4 bg-zinc-900 rounded-xl p-3 border border-white/5 hover:bg-zinc-800 transition">
                            <img src="${manga.thumb}" class="w-16 h-20 object-cover rounded-lg" loading="lazy">
                            <div class="font-bold text-base">${manga.judul}</div>
                        </div>
                    `;
                }
                container.appendChild(a);
            });

            container.className = mode === 'grid' ? 'grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6' : 'list-mode';
            renderPageNumbers(totalPages);

            pageFirst.disabled = currentPage === 1;
            pagePrev.disabled = currentPage === 1;
            pageNext.disabled = currentPage === totalPages;
            pageLast.disabled = currentPage === totalPages;
        }

        function renderPageNumbers(totalPages) {
            let html = '';
            const maxVisible = 7;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            if (endPage - startPage + 1 < maxVisible) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                html += `<span class="px-2 py-1 text-zinc-500">...</span>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-number px-3 py-1 rounded-lg text-xs font-bold ${i === currentPage ? 'bg-purple-600 text-white' : 'bg-zinc-900 border border-white/5 hover:bg-zinc-800'}" data-page="${i}">${i}</button>`;
            }
            if (endPage < totalPages) {
                html += `<span class="px-2 py-1 text-zinc-500">...</span>`;
            }
            pageNumbersDiv.innerHTML = html;

            document.querySelectorAll('.page-number').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPage = parseInt(btn.dataset.page);
                    render();
                });
            });
        }

        function filterData() {
            const keyword = searchInput.value.trim().toLowerCase();
            filteredData = keyword === '' ? [...allData] : allData.filter(manga => 
                manga.judul.toLowerCase().includes(keyword)
            );
            currentPage = 1;
            render();
        }

        // ==================== LOAD DATA ====================
        fetch('../list.json') // Ambil dari root
            .then(res => res.json())
            .then(data => {
                allData = data;
                filteredData = [...allData];
                generatePopularData();
                render();
                renderPopular('daily');

                // Muat recent dari localStorage
                try {
                    const recent = localStorage.getItem('petomic_recent');
                    if (recent) {
                        renderRecentComics(JSON.parse(recent));
                    }
                } catch (e) {
                    console.warn('Gagal memuat riwayat:', e);
                }

                // Inisialisasi status popular
                initPopularToggle();
            })
            .catch(err => {
                console.error('Gagal memuat data', err);
                container.innerHTML = '<p class="text-center text-red-500">Gagal memuat katalog.</p>';
            });

        // ==================== EVENT LISTENERS ====================
        searchInput.addEventListener('input', filterData);

        modeGridBtn.addEventListener('click', () => {
            mode = 'grid';
            modeGridBtn.classList.add('bg-purple-600', 'text-white');
            modeGridBtn.classList.remove('text-zinc-400', 'hover:bg-zinc-800');
            modeListBtn.classList.remove('bg-purple-600', 'text-white');
            modeListBtn.classList.add('text-zinc-400', 'hover:bg-zinc-800');
            render();
        });

        modeListBtn.addEventListener('click', () => {
            mode = 'list';
            modeListBtn.classList.add('bg-purple-600', 'text-white');
            modeListBtn.classList.remove('text-zinc-400', 'hover:bg-zinc-800');
            modeGridBtn.classList.remove('bg-purple-600', 'text-white');
            modeGridBtn.classList.add('text-zinc-400', 'hover:bg-zinc-800');
            render();
        });

        tabDaily.addEventListener('click', () => {
            tabDaily.classList.add('tab-active');
            tabWeekly.classList.remove('tab-active');
            tabMonthly.classList.remove('tab-active');
            renderPopular('daily');
        });
        
        tabWeekly.addEventListener('click', () => {
            tabWeekly.classList.add('tab-active');
            tabDaily.classList.remove('tab-active');
            tabMonthly.classList.remove('tab-active');
            renderPopular('weekly');
        });
        
        tabMonthly.addEventListener('click', () => {
            tabMonthly.classList.add('tab-active');
            tabDaily.classList.remove('tab-active');
            tabWeekly.classList.remove('tab-active');
            renderPopular('monthly');
        });

        pageFirst.addEventListener('click', () => {
            currentPage = 1;
            render();
        });
        pagePrev.addEventListener('click', () => {
            if (currentPage > 1) currentPage--;
            render();
        });
        pageNext.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (currentPage < totalPages) currentPage++;
            render();
        });
        pageLast.addEventListener('click', () => {
            currentPage = Math.ceil(filteredData.length / itemsPerPage);
            render();
        });
    </script>
</body>
</html>
