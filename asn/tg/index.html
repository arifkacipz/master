<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigger GitHub Actions Workflow</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #e4e4e4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            display: block;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #a78bfa;
        }
        button {
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background: #7c3aed;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            background: #2a2a2a;
            border-left: 4px solid #8b5cf6;
        }
        .status.error {
            border-left-color: #ef4444;
            background: #2a1f1f;
        }
        .status.success {
            border-left-color: #10b981;
            background: #1f2a24;
        }
        .small {
            font-size: 0.8rem;
            color: #888;
            margin-top: 16px;
            text-align: center;
        }
        a {
            color: #8b5cf6;
        }
        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .checkbox input {
            width: auto;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Trigger Workflow</h1>
        <p>Pilih workflow yang akan dijalankan.</p>

        <label for="token">GitHub Personal Access Token</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">

        <div class="checkbox">
            <input type="checkbox" id="rememberToken" checked>
            <label style="margin-bottom: 0;">Ingat token di browser (local storage)</label>
        </div>

        <label for="workflowSelect">Pilih Workflow</label>
        <select id="workflowSelect">
            <option value="update-petomic-data.yml">Update PetoMic Data (dengan slug)</option>
            <option value="full_scrape_scheduler.yml">Full Scrape Scheduler (otomatis)</option>
            <option value="multi.yml">Matrix Full Scrape (3 per run)</option>
        </select>

        <div id="slugContainer">
            <label for="slug">Target Slug (kosongkan untuk katalog)</label>
            <input type="text" id="slug" placeholder="contoh: virus-king">
        </div>

        <button id="triggerBtn" onclick="triggerWorkflow()">Jalankan Workflow</button>

        <div class="checkbox" style="margin-top: 10px;">
            <input type="checkbox" id="autoClear">
            <label style="margin-bottom: 0;">Hapus token dari memori setelah menjalankan</label>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="small">
            <p>Token memerlukan akses <strong>repo</strong> dan <strong>workflow</strong>.<br>
            <a href="https://github.com/settings/tokens/new?description=Trigger%20PetoMic&scopes=repo,workflow" target="_blank">Buat token baru</a></p>
            <p><button onclick="clearToken()" style="background: #444;">Hapus token tersimpan</button></p>
        </div>
    </div>

    <script>
        // ===== KONFIGURASI =====
        const OWNER = 'arifkacipz';      // Username GitHub Anda
        const REPO = 'master';           // Nama repositori
        // =======================

        window.onload = function() {
            const savedToken = localStorage.getItem('github_token');
            if (savedToken) {
                document.getElementById('token').value = savedToken;
            }
            toggleSlugField();
        };

        document.getElementById('workflowSelect').addEventListener('change', toggleSlugField);

        function toggleSlugField() {
            const workflow = document.getElementById('workflowSelect').value;
            const slugContainer = document.getElementById('slugContainer');
            // Sembunyikan slug untuk workflow yang tidak memerlukan input slug
            const noSlugWorkflows = ['full_scrape_scheduler.yml', 'multi.yml'];
            slugContainer.style.display = noSlugWorkflows.includes(workflow) ? 'none' : 'block';
        }

        function clearToken() {
            localStorage.removeItem('github_token');
            document.getElementById('token').value = '';
            showStatus('Token dihapus dari penyimpanan', 'success');
        }

        async function triggerWorkflow() {
            const token = document.getElementById('token').value.trim();
            const workflow = document.getElementById('workflowSelect').value;
            const slug = document.getElementById('slug').value.trim();
            const remember = document.getElementById('rememberToken').checked;
            const autoClear = document.getElementById('autoClear').checked;
            const btn = document.getElementById('triggerBtn');
            const statusDiv = document.getElementById('status');

            if (!token) {
                showStatus('Token tidak boleh kosong', 'error');
                return;
            }

            if (remember) {
                localStorage.setItem('github_token', token);
            } else {
                localStorage.removeItem('github_token');
            }

            const url = `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${workflow}/dispatches`;

            let payload = { ref: 'main' };
            // Hanya kirim inputs jika workflow membutuhkan slug dan slug tidak kosong
            if (workflow === 'update-petomic-data.yml' && slug) {
                payload.inputs = { target_slug: slug };
            }
            // Workflow lain tidak mengirim inputs

            btn.disabled = true;
            btn.innerText = 'Memproses...';
            statusDiv.style.display = 'none';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.status === 204) {
                    showStatus('✅ Workflow berhasil dipicu! Cek tab Actions di GitHub.', 'success');
                } else {
                    const error = await response.json();
                    showStatus(`❌ Gagal: ${error.message}`, 'error');
                }
            } catch (err) {
                showStatus(`❌ Error: ${err.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Jalankan Workflow';
                if (autoClear) {
                    document.getElementById('token').value = '';
                }
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.className = `status ${type}`;
            statusDiv.innerText = message;
        }
    </script>
</body>
</html>
