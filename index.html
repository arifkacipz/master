<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Upload - Google Style</title>
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-border: #dadce0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: background 0.5s ease;
        }

        .container {
            width: 100%;
            max-width: 28rem;
            padding: 2.5rem;
            border: 1px solid var(--google-border);
            border-radius: 8px;
            text-align: center;
            transition: all 0.5s ease;
            position: relative;
            background: white;
        }

        .logo-img { width: 48px; height: auto; margin-bottom: 1rem; }

        /* Gaya Form Standar */
        #upload-section h2 { font-size: 1.5rem; font-weight: 400; margin-bottom: 0.5rem; }
        .subtitle { color: #5f6368; margin-bottom: 2rem; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px solid var(--google-border); border-radius: 4px; }
        
        .actions { display: flex; justify-content: flex-end; margin-top: 2rem; }
        
        button {
            background-color: var(--google-blue);
            color: white; border: none; padding: 0.6rem 1.5rem;
            border-radius: 4px; font-weight: 500; cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* --- NOTIFIKASI SUKSES (ARTISTIK) --- */
        .success-state { display: none; animation: fadeIn 1s forwards; }
        .success-state h2 { 
            font-family: 'Georgia', serif; font-style: italic; color: #2d5a27;
            font-size: 2rem; letter-spacing: 2px; margin-bottom: 1rem;
        }
        .success-state p { color: #556b2f; font-size: 1.1rem; line-height: 1.6; }

        /* --- NOTIFIKASI GAGAL (MENGERIKAN) --- */
        .fail-state { display: none; animation: shake 0.5s infinite; color: #660000; }
        .fail-state h2 { 
            font-family: 'Creepster', 'Courier New', cursive; font-size: 2.5rem;
            text-shadow: 2px 2px #000; color: #ff0000; margin-bottom: 1rem;
        }
        .fail-state p { font-family: 'Courier New', monospace; font-weight: bold; background: #000; color: #ff0000; padding: 10px; }

        /* Animasi */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 10% { transform: translate(-1px, -2px); } 20% { transform: translate(-3px, 0px); } }

        /* Tombol Ulangi */
        .retry-btn { margin-top: 2rem; background: #333; }
        .retry-btn.success-btn { background: #556b2f; }
        .retry-btn.fail-btn { background: #900; color: #fff; border: 2px solid #000; }
    </style>
</head>
<body>

<div class="container" id="main-card">
    <div id="upload-section">
        <img src="ico.png" alt="Logo" class="logo-img">
        <h2>Simpan ke Cloud</h2>
        <p class="subtitle">Upload file .txt Anda dengan aman</p>
        <input type="file" id="file-input" accept=".txt">
        <div id="loading-text" style="margin-top: 10px; display: none; font-size: 0.8rem; color: var(--google-blue);">Mengirim data ke awan...</div>
        <div class="actions">
            <button id="upload-btn" onclick="uploadFile()">Berikutnya</button>
        </div>
    </div>

    <div id="success-section" class="success-state">
        <h2>Karya Tersimpan</h2>
        <p>File Anda telah melayang ke keabadian digital dengan sempurna.</p>
        <button class="retry-btn success-btn" onclick="resetPage()">Upload File Lain</button>
    </div>

    <div id="fail-section" class="fail-state">
        <h2>KATASTROFE!</h2>
        <p id="error-desc"></p>
        <button class="retry-btn fail-btn" onclick="resetPage()">COBA LAGI JIKA BERANI</button>
    </div>
</div>

<script>
    const CLOUD_NAME = "dctzndhgm";
    const UPLOAD_PRESET = "preset_txt"; 

    async function uploadFile() {
        const fileInput = document.getElementById('file-input');
        const uploadSection = document.getElementById('upload-section');
        const successSection = document.getElementById('success-section');
        const failSection = document.getElementById('fail-section');
        const errorDesc = document.getElementById('error-desc');
        const loadingText = document.getElementById('loading-text');
        const mainCard = document.getElementById('main-card');

        if (fileInput.files.length === 0) {
            alert("Pilih file terlebih dahulu.");
            return;
        }

        const file = fileInput.files[0];
        
        // Proteksi Ukuran 50KB
        if (file.size > 50 * 1024) {
            showError("FILE TERLALU RAKSASA! KAMI TIDAK BISA MENAMPUNGNYA!");
            return;
        }

        loadingText.style.display = "block";
        document.getElementById('upload-btn').disabled = true;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/raw/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            uploadSection.style.display = "none";

            if (data.secure_url) {
                // TAMPILAN SUKSES
                successSection.style.display = "block";
                document.body.style.backgroundColor = "#f0f4ef"; // Hijau pudar artistik
            } else {
                showError(data.error.message.toUpperCase());
            }
        } catch (error) {
            showError("KONEKSI TERPUTUS KE DUNIA KEGELAPAN!");
        }
    }

    function showError(msg) {
        document.getElementById('upload-section').style.display = "none";
        document.getElementById('fail-section').style.display = "block";
        document.getElementById('error-desc').innerText = msg;
        document.body.style.backgroundColor = "#1a0000"; // Merah gelap mengerikan
        document.getElementById('main-card').style.borderColor = "#ff0000";
    }

    function resetPage() {
        // Kembalikan semua ke default
        document.getElementById('upload-section').style.display = "block";
        document.getElementById('success-section').style.display = "none";
        document.getElementById('fail-section').style.display = "none";
        document.getElementById('upload-btn').disabled = false;
        document.getElementById('loading-text').style.display = "none";
        document.getElementById('file-input').value = "";
        document.body.style.backgroundColor = "#ffffff";
        document.getElementById('main-card').style.borderColor = "#dadce0";
        document.getElementById('main-card').style.background = "white";
    }
</script>

</body>
</html>
