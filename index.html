<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage - Anime Fusion</title>
    
    <link rel="icon" type="image/png" href="ico.png">
    
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-border: #dadce0;
            --glass-white: rgba(255, 255, 255, 0.85);
            --glass-dark: rgba(20, 0, 0, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden;
            position: relative;
            background-color: #000;
        }

        /* --- BACKGROUND LAYER --- */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1618335829737-2228733924bc?q=80&w=2070&auto=format&fit=crop'); /* Placeholder anime dark vibe */
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: transform 1.5s cubic-bezier(0.19, 1, 0.22, 1), filter 1s ease;
        }

        /* OVERLAY GRADIENT */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            z-index: -1;
            transition: background 1s ease;
        }

        /* --- CONTAINER UTAMA (GLASSMORPHISM) --- */
        .container {
            width: 100%;
            max-width: 28rem;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            text-align: center;
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
        }

        /* --- ANIMASI TRANSISI ANTAR STATE --- */
        .state-content {
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* --- LOGO & TYPOGRAPHY --- */
        .logo-img { width: 56px; margin-bottom: 1.5rem; transition: transform 0.5s ease; }
        .logo-img:hover { transform: rotate(10deg) scale(1.1); }

        h2 { font-size: 1.6rem; font-weight: 500; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
        .subtitle { color: #5f6368; margin-bottom: 2rem; font-size: 0.95rem; }
        
        /* --- INPUT & BUTTON --- */
        .input-wrapper { position: relative; margin-bottom: 1.5rem; }
        input[type="file"] { 
            width: 100%; padding: 12px; 
            border: 2px solid var(--google-border); border-radius: 8px;
            background: rgba(255,255,255,0.5); transition: all 0.3s ease;
        }
        input[type="file"]:focus { border-color: var(--google-blue); outline: none; }
        
        button {
            background: var(--google-blue); color: white; border: none;
            padding: 0.8rem 2rem; border-radius: 8px; font-weight: 600;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 6px rgba(26, 115, 232, 0.3);
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 15px rgba(26, 115, 232, 0.4); }
        button:active { transform: translateY(0); }

        /* --- STATE KHUSUS --- */
        .hidden { display: none !important; }

        /* SUKSES STATE */
        .success-bg .bg-layer { transform: scale(1.1); filter: sepia(0.3) brightness(0.8); }
        .success-bg .container { background: rgba(245, 255, 245, 0.9); border-color: rgba(45, 90, 39, 0.3); }
        .success-text h2 { font-family: 'Georgia', serif; font-style: italic; color: #2d5a27; font-size: 2.2rem; }

        /* FAIL STATE */
        .fail-bg .bg-layer { transform: scale(1.3) rotate(2deg); filter: grayscale(1) contrast(1.5) brightness(0.4); }
        .fail-bg body::before { background: radial-gradient(circle, rgba(40,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%); }
        .fail-bg .container { background: var(--glass-dark); color: #ff4444; border-color: #ff0000; transform: perspective(1000px) rotateX(10deg); }
        
        .fail-text h2 { 
            font-family: 'Courier New', monospace; font-size: 2.3rem; font-weight: 900;
            animation: glitch 0.2s infinite; text-shadow: 3px 0 #fff;
        }

        /* --- FOOTER/LOADER --- */
        #loader { font-style: italic; animation: pulse 1.5s infinite; margin-top: 10px; }

        @keyframes glitch {
            0% { transform: translate(2px, 0); }
            50% { transform: translate(-2px, -1px); }
            100% { transform: translate(0, 1px); }
        }
        @keyframes pulse { 50% { opacity: 0.5; } }

    </style>
</head>
<body id="body-tag">

<div class="bg-layer" id="bg-layer"></div>

<div class="container" id="main-card">
    <div id="upload-section" class="state-content">
        <img src="ico.png" alt="Logo" class="logo-img">
        <h2>Simpan ke Cloud</h2>
        <p class="subtitle">Hanya file .txt yang diizinkan untuk diabadikan</p>
        
        <div class="input-wrapper">
            <input type="file" id="file-input" accept=".txt, text/plain">
        </div>
        
        <div id="loader" class="hidden">Menyaring data dari dimensi lain...</div>
        
        <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
            <button id="upload-btn" onclick="uploadFile()">Berikutnya</button>
        </div>
    </div>

    <div id="success-section" class="state-content success-text hidden">
        <h2>Elegi Tersimpan</h2>
        <p style="margin: 1.5rem 0; line-height: 1.6; color: #4a6741;">File teks Anda telah melintasi batas cakrawala digital dan kini beristirahat dengan tenang.</p>
        <button style="background: #556b2f; width: 100%;" onclick="resetPage()">Unggah Karya Lain</button>
    </div>

    <div id="fail-section" class="state-content fail-text hidden">
        <h2>ERROR_CRITICAL</h2>
        <p id="error-desc" style="background: rgba(255,0,0,0.1); padding: 1rem; border-radius: 4px; margin: 1.5rem 0; font-family: monospace;"></p>
        <button style="background: #600; width: 100%; border: 1px solid red;" onclick="resetPage()">KEMBALI KE GERBANG</button>
    </div>
</div>

<script>
    const CLOUD_NAME = "dctzndhgm";
    const UPLOAD_PRESET = "preset_txt"; 

    async function uploadFile() {
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const loader = document.getElementById('loader');
        const body = document.getElementById('body-tag');

        if (fileInput.files.length === 0) {
            alert("Harap pilih file!");
            return;
        }

        const file = fileInput.files[0];
        const fileName = file.name.toLowerCase();
        
        // Validasi Ekstensi
        if (!fileName.endsWith('.txt')) {
            showError("DETEKSI PENYUSUP! EKSTENSI BUKAN .TXT");
            return;
        }

        // Validasi Ukuran 50KB
        if (file.size > 50 * 1024) {
            showError("DATA TERLALU RAKSASA! MAKSIMAL 50KB!");
            return;
        }

        // Start Loading
        uploadBtn.disabled = true;
        loader.classList.remove('hidden');

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/raw/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.secure_url) {
                transitionState('success-section');
                body.classList.add('success-bg');
            } else {
                showError(data.error.message.toUpperCase());
            }
        } catch (error) {
            showError("KONEKSI GAIB TERPUTUS!");
        }
    }

    function transitionState(targetId) {
        // Sembunyikan semua section
        document.getElementById('upload-section').classList.add('hidden');
        document.getElementById('success-section').classList.add('hidden');
        document.getElementById('fail-section').classList.add('hidden');

        // Tampilkan target dengan animasi
        const target = document.getElementById(targetId);
        target.classList.remove('hidden');
        
        // Trigger ulang animasi CSS
        target.style.animation = 'none';
        target.offsetHeight; /* trigger reflow */
        target.style.animation = null;
    }

    function showError(msg) {
        const body = document.getElementById('body-tag');
        document.getElementById('error-desc').innerText = msg;
        transitionState('fail-section');
        body.classList.add('fail-bg');
    }

    function resetPage() {
        const body = document.getElementById('body-tag');
        const fileInput = document.getElementById('file-input');
        
        body.classList.remove('success-bg', 'fail-bg');
        transitionState('upload-section');
        
        document.getElementById('upload-btn').disabled = false;
        document.getElementById('loader').classList.add('hidden');
        fileInput.value = "";
    }
</script>

</body>
</html>
