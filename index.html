<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage - Anime Fusion</title>
    
    <link rel="icon" type="image/png" href="ico.png">
    
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-border: #dadce0;
            --glass-white: rgba(255, 255, 255, 0.85);
            --glass-dark: rgba(10, 0, 0, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden;
            background-color: #000;
        }

        /* --- BACKGROUND LAYER --- */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://source.unsplash.com/featured/1600x900?anime,night,silent,scenic,dark');
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: transform 2s cubic-bezier(0.19, 1, 0.22, 1), filter 1.2s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            z-index: -1;
            transition: background 1s ease;
        }

        /* --- CONTAINER GLASSMORPHISM --- */
        .container {
            width: 100%;
            max-width: 28rem;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            text-align: center;
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
        }

        /* --- ANIMASI TRANSISI --- */
        .state-content {
            animation: slideIn 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .logo-img { width: 56px; margin-bottom: 1.5rem; transition: transform 0.5s ease; }
        h2 { font-size: 1.6rem; font-weight: 500; margin-bottom: 0.5rem; }
        .subtitle { color: #5f6368; margin-bottom: 2rem; font-size: 0.95rem; }
        
        input[type="file"] { 
            width: 100%; padding: 14px; 
            border: 2px dashed var(--google-border); border-radius: 8px;
            background: rgba(255,255,255,0.4); cursor: pointer;
        }
        
        button {
            background: var(--google-blue); color: white; border: none;
            padding: 0.8rem 2rem; border-radius: 8px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
        button:disabled { background: #ccc; cursor: not-allowed; }

        /* --- STATE LOGIC --- */
        .hidden { display: none !important; }

        /* SUCCESS STATE */
        .success-bg .bg-layer { transform: scale(1.1); filter: sepia(0.3) brightness(0.8); }
        .success-bg .container { background: rgba(245, 255, 245, 0.92); border-color: rgba(45, 90, 39, 0.3); }
        .success-text h2 { font-family: 'Georgia', serif; font-style: italic; color: #2d5a27; font-size: 2.2rem; }

        /* FAIL STATE */
        .fail-bg .bg-layer { transform: scale(1.25) rotate(2deg); filter: grayscale(1) contrast(1.5) brightness(0.3); }
        .fail-bg body::before { background: radial-gradient(circle, rgba(50,0,0,0.5) 0%, rgba(0,0,0,0.9) 100%); }
        .fail-bg .container { background: var(--glass-dark); color: #ff3333; border-color: #ff0000; }
        .fail-text h2 { font-family: 'Courier New', monospace; font-size: 2.3rem; animation: glitch 0.2s infinite; }

        @keyframes glitch {
            0% { transform: translate(2px,0); text-shadow: 2px 0 red; }
            50% { transform: translate(-2px,0); text-shadow: -2px 0 blue; }
            100% { transform: translate(0); }
        }

        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body id="body-tag">

<div class="bg-layer" id="bg-layer"></div>

<div class="container" id="main-card">
    <div id="upload-section" class="state-content">
        <img src="ico.png" alt="Logo" class="logo-img">
        <h2>Simpan ke Cloud</h2>
        <p class="subtitle">Hanya file .txt yang diizinkan (Maks 50KB)</p>
        
        <input type="file" id="file-input" accept=".txt, text/plain">
        
        <div id="loader" class="hidden" style="margin-top: 15px; font-style: italic; animation: pulse 1s infinite; color: var(--google-blue);">Mentransmisi data...</div>
        
        <div style="display: flex; justify-content: flex-end; margin-top: 2rem;">
            <button id="upload-btn" onclick="uploadFile()">Berikutnya</button>
        </div>
    </div>

    <div id="success-section" class="state-content success-text hidden">
        <h2>Elegi Tersimpan</h2>
        <p id="success-msg" style="margin: 2rem 0; line-height: 1.6; color: #4a6741;"></p>
        <button style="background: #556b2f; width: 100%;" onclick="resetPage()">Unggah Karya Lain</button>
    </div>

    <div id="fail-section" class="state-content fail-text hidden">
        <h2>ERROR_CRITICAL</h2>
        <p id="error-desc" style="background: rgba(255,0,0,0.1); padding: 1.2rem; border-radius: 4px; margin: 1.5rem 0; font-family: monospace; font-size: 0.9rem; line-height: 1.4;"></p>
        <button style="background: #600; width: 100%; border: 1px solid red;" onclick="resetPage()">KEMBALI KE GERBANG</button>
    </div>
</div>

<script>
    const CLOUD_NAME = "dctzndhgm";
    const UPLOAD_PRESET = "preset_txt"; 

    const successMessages = [
        "Elegi tersimpan dalam keabadian digital.", "File teks Anda telah menemukan rumah di antara awan.",
        "Gema kata-katamu kini beristirahat di cakrawala.", "Karya Anda telah melintasi batas dimensi ini.",
        "Sebuah fragmen pikiran telah berhasil diabadikan.", "Bintang-bintang digital menyambut pesan Anda.",
        "Keheningan menyelimuti kata yang kini tersimpan.", "Angin malam membawa file Anda ke tempat aman.",
        "Satu lembar lagi dalam perpustakaan tanpa batas.", "Cahaya redup menuntun file Anda menuju penyimpanan.",
        "Pesan Anda kini menjadi bagian dari konstelasi data.", "Terabadikan dalam sunyi, tersimpan dalam memori.",
        "Jejak digital Anda telah terukir di langit malam.", "Keajaiban kecil terjadi; file Anda telah sampai.",
        "Sesuatu yang indah telah berhasil diunggah.", "Di bawah langit yang tenang, file Anda beristirahat.",
        "Kata-katamu kini abadi di dunia yang fana ini.", "Satu rahasia kecil tersimpan di tempat terjauh.",
        "Terima kasih telah menitipkan potongan memori ini.", "File Anda telah mendarat di pelabuhan ketenangan."
    ];

    const failMessages = [
        "KATASTROFE! DUNIA MENOLAK KEHADIRAN DATA INI!", "KEGELAPAN TELAH MENELAN FILE ANDA!",
        "ANOMALI TERDETEKSI! SESUATU YANG BURUK TERJADI!", "JANGAN COBA LAGI, ATAU KAU AKAN MENYESAL!",
        "DUNIA DIGITAL BERTERIAK; FILE ANDA TERKUTUK!", "HUBUNGAN GAIB TERPUTUS OLEH ENTITAS ASING!",
        "ERROR_FATAL: JIWA DARI FILE INI TELAH HILANG!", "MAKSIMAL 50KB! JANGAN SERAKAH!",
        "SISTEM MENANGIS DARAH; UPLOAD GAGAL TOTAL!", "KONEKSI TERPUTUS KE DIMENSI KEGELAPAN!",
        "KAU MEMBANGUNKAN SESUATU YANG SEHARUSNYA TIDUR!", "HANYA FILE .TXT! JANGAN BERMAIN API!",
        "FILE ANDA DIKORBANKAN PADA SERVER YANG LAPAR!", "TERJADI KERUSAKAN PADA RUANG DAN WAKTU!",
        "KAU TIDAK MEMILIKI IZIN MENYENTUH GERBANG INI!", "SERVER MENOLAK; ADA BAU MAUT PADA DATA ANDA!",
        "HENTIKAN SEKARANG SEBELUM TERLAMBAT!", "KODE_MERAH! FILE TERINFEKSI KEHAMPAAN!",
        "GAGAL! KAU HANYA MEMBUANG WAKTU DI SINI!", "KATASTROFE DIGITAL: SEMUA DATA TERBAKAR!"
    ];

    async function uploadFile() {
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const loader = document.getElementById('loader');
        const body = document.getElementById('body-tag');

        if (fileInput.files.length === 0) {
            alert("Harap pilih file!");
            return;
        }

        const file = fileInput.files[0];
        const fileName = file.name.toLowerCase();

        // VALIDASI GANDA
        if (!fileName.endsWith('.txt')) {
            showError("DETEKSI PENYUSUP! EKSTENSI BUKAN .TXT");
            return;
        }

        if (file.size > 50 * 1024) {
            showError("DATA TERLALU RAKSASA! MAKSIMAL 50KB!");
            return;
        }

        uploadBtn.disabled = true;
        loader.classList.remove('hidden');

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/raw/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.secure_url) {
                const msg = successMessages[Math.floor(Math.random() * successMessages.length)];
                document.getElementById('success-msg').innerText = msg;
                showState('success-section');
                body.classList.add('success-bg');
            } else {
                showError(data.error.message.toUpperCase());
            }
        } catch (error) {
            showError("KONEKSI GAIB TERPUTUS!");
        }
    }

    function showError(msg) {
        const randomFail = failMessages[Math.floor(Math.random() * failMessages.length)];
        document.getElementById('error-desc').innerHTML = `<strong>${msg}</strong><br><br>${randomFail}`;
        showState('fail-section');
        document.getElementById('body-tag').classList.add('fail-bg');
    }

    function showState(id) {
        document.getElementById('upload-section').classList.add('hidden');
        document.getElementById('success-section').classList.add('hidden');
        document.getElementById('fail-section').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    function resetPage() {
        const body = document.getElementById('body-tag');
        body.classList.remove('success-bg', 'fail-bg');
        showState('upload-section');
        document.getElementById('upload-btn').disabled = false;
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('file-input').value = "";
    }
</script>

</body>
</html>
