<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Upload File TXT</title>
    <style>
        body { font-family: sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; padding: 20px; border: 1px solid #ccc; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 1.2rem; }
        .info { font-size: 12px; color: #666; margin-bottom: 10px; }
        input[type="file"] { display: block; margin-bottom: 20px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; width: 100%; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>Upload ke Folder ASN</h2>
    <p class="info">Format: <b>.txt</b> | Maksimal: <b>500 KB</b></p>
    
    <form action="upload.php" method="post" enctype="multipart/form-data" id="uploadForm">
        <input type="file" name="fileTxt" id="fileTxt" accept=".txt" required>
        <button type="submit" name="submit">Mulai Unggah</button>
    </form>
</div>

<script>
    // Validasi sisi client agar user langsung tahu jika file terlalu besar
    document.getElementById('uploadForm').onsubmit = function() {
        var fileInput = document.getElementById('fileTxt');
        var fileSize = fileInput.files[0].size; // dalam bytes
        var maxSize = 500 * 1024; // 500 KB

        if (fileSize > maxSize) {
            alert("File terlalu besar! Maksimal ukuran adalah 500 KB.");
            return false; // Membatalkan pengiriman form
        }
    };
</script>

</body>
</html>
