<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage - Anime Fusion</title>
    
    <link rel="icon" type="image/png" href="ico.png">
    
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-border: #dadce0;
            --glass-white: rgba(255, 255, 255, 0.85);
            --glass-dark: rgba(10, 5, 5, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden;
            background-color: #000; /* Warna dasar jika gambar gagal load */
        }

        /* --- BACKGROUND LAYER --- */
        #bg-layer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            transition: transform 2s cubic-bezier(0.19, 1, 0.22, 1), filter 1.2s ease, background-image 1s ease-in-out;
            transform: scale(1);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            z-index: -1;
            transition: background 1.5s ease;
        }

        .container {
            width: 100%;
            max-width: 28rem;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            text-align: center;
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
        }

        .state-content { animation: slideIn 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(40px) scale(0.9); filter: blur(15px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .logo-img { width: 56px; margin-bottom: 1.5rem; }
        h2 { font-size: 1.6rem; font-weight: 500; margin-bottom: 0.5rem; }
        .subtitle { color: #5f6368; margin-bottom: 2rem; font-size: 0.95rem; }
        
        input[type="file"] { 
            width: 100%; padding: 14px; 
            border: 2px dashed var(--google-border); border-radius: 8px;
            background: rgba(255,255,255,0.4); cursor: pointer;
        }
        
        button {
            background: var(--google-blue); color: white; border: none;
            padding: 0.8rem 2rem; border-radius: 8px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .hidden { display: none !important; }

        /* --- STATES --- */
        .success-bg #bg-layer { transform: scale(1.1); filter: sepia(0.3) brightness(0.8); }
        .success-text h2 { font-family: 'Georgia', serif; font-style: italic; color: #2d5a27; font-size: 2.2rem; }

        .fail-bg #bg-layer { transform: scale(1.3) rotate(3deg); filter: grayscale(1) brightness(0.2); }
        .fail-bg .container { background: var(--glass-dark); color: #ff3333; border-color: #700; transform: perspective(1000px) rotateX(4deg); }
        .fail-text h2 { font-family: 'Courier New', monospace; font-size: 2.4rem; animation: glitch 0.3s infinite; }

        @keyframes glitch {
            0% { transform: translate(2px,0); text-shadow: 2px 0 #fff; }
            50% { transform: translate(-2px,0); text-shadow: -2px 0 #f00; }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body id="body-tag">

<div id="bg-layer"></div>

<div class="container" id="main-card">
    <div id="upload-section" class="state-content">
        <img src="ico.png" alt="Logo" class="logo-img">
        <h2>Simpan ke Cloud</h2>
        <p class="subtitle">Hanya file .txt (Maks 50KB)</p>
        <input type="file" id="file-input" accept=".txt, text/plain">
        <div id="loader" class="hidden" style="margin-top: 15px; font-style: italic; color: var(--google-blue);">Mentransmisi data...</div>
        <div style="display: flex; justify-content: flex-end; margin-top: 2rem;">
            <button id="upload-btn" onclick="uploadFile()">Berikutnya</button>
        </div>
    </div>

    <div id="success-section" class="state-content success-text hidden">
        <h2>Elegi Tersimpan</h2>
        <p id="success-msg" style="margin: 2rem 0; line-height: 1.6; color: #4a6741;"></p>
        <button style="background: #556b2f; width: 100%;" onclick="resetPage()">Unggah Karya Lain</button>
    </div>

    <div id="fail-section" class="state-content fail-text hidden">
        <h2 id="fail-title">VOID_ERROR</h2>
        <p id="error-desc" style="background: rgba(255,0,0,0.1); padding: 1.2rem; border-radius: 4px; margin: 1.5rem 0; font-family: monospace; line-height: 1.5;"></p>
        <button id="fail-btn" style="background: #500; width: 100%; border: 1px solid #f00;" onclick="resetPage()">KEMBALI</button>
    </div>
</div>

<script>
    const CLOUD_NAME = "dctzndhgm";
    const UPLOAD_PRESET = "preset_txt"; 

    // DAFTAR BACKGROUND ANIME MANUAl (Pasti Tampil & Random)
    const animeBackgrounds = [
        "https://e1.pxfuel.com/desktop-wallpaper/667/677/desktop-wallpaper-dark-anime-scenery-anime-dark-places.jpg",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTGaY7cNMLUxnMAujavCTvWADYZh418szRuA&s",
        "https://s.widget-club.com/images/YyiR86zpwIMIfrCZoSs4ulVD9RF3/b8df69879011e050d02ffced0b8abf76/379ac593e4eafd108b60fac88e73c709.jpg?q=50&w=720",
        "https://png.pngtree.com/thumb_back/fh260/background/20240124/pngtree-an-animated-video-of-an-anime-with-a-black-sky-and-image_2955258.png",
        "https://i.pinimg.com/736x/5c/58/26/5c58265ee112a54b3c51694a18956a03.jpg",
        "https://wallpapers.com/images/hd/scary-girl-dark-anime-aesthetic-desktop-rfnhg84drsbvoelr.jpg",
    ];

    function setRandomBackground() {
        const bgLayer = document.getElementById('bg-layer');
        const randomBg = animeBackgrounds[Math.floor(Math.random() * animeBackgrounds.length)];
        bgLayer.style.backgroundImage = `url('${randomBg}')`;
    }

    // Jalankan background random saat pertama kali load
    setRandomBackground();

    const successMessages = [
        "Elegi tersimpan dalam keabadian digital.", "File teks Anda telah menemukan rumah di antara awan.",
        "Gema kata-katamu kini beristirahat di cakrawala.", "Karya Anda telah melintasi batas dimensi ini."
    ];

    const failMessages = [
        "KATASTROFE! DUNIA MENOLAK DATA INI!", "KEGELAPAN TELAH MENELAN FILE ANDA!",
        "ANOMALI TERDETEKSI! SESUATU YANG BURUK TERJADI!"
    ];

    const emptyMessages = [
        "KAU MENCOBA MENGIRIM KEHAMPAAN?", "RUANG KOSONG INI TIDAK BISA DIABADIKAN.",
        "PILIH SESUATU SEBELUM GERBANG DITUTUP!"
    ];

    async function uploadFile() {
        const fileInput = document.getElementById('file-input');
        const body = document.getElementById('body-tag');

        if (fileInput.files.length === 0) {
            const randomEmpty = emptyMessages[Math.floor(Math.random() * emptyMessages.length)];
            showError("VOID_ERROR", randomEmpty, "COBA LAGI");
            return;
        }

        const file = fileInput.files[0];
        if (!file.name.toLowerCase().endsWith('.txt')) {
            showError("FORMAT_DENIED", "HANYA FILE .TXT YANG DIIZINKAN!", "PERBAIKI");
            return;
        }

        if (file.size > 50 * 1024) {
            showError("WEIGHT_ERROR", "MAKSIMAL ADALAH 50KB!", "KECILKAN");
            return;
        }

        document.getElementById('loader').classList.remove('hidden');
        document.getElementById('upload-btn').disabled = true;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/raw/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (data.secure_url) {
                document.getElementById('success-msg').innerText = successMessages[Math.floor(Math.random() * successMessages.length)];
                showState('success-section');
                body.classList.add('success-bg');
            } else {
                showError("UPLOAD_FAILED", data.error.message.toUpperCase(), "ULANGI");
            }
        } catch (error) {
            showError("CONNECTION_LOST", "KONEKSI GAIB TERPUTUS!", "SAMBUNGKAN");
        }
    }

    function showError(title, msg, btnText) {
        const randomHorror = failMessages[Math.floor(Math.random() * failMessages.length)];
        document.getElementById('fail-title').innerText = title;
        document.getElementById('error-desc').innerHTML = `<strong>${msg}</strong><br><br>${randomHorror}`;
        document.getElementById('fail-btn').innerText = btnText;
        showState('fail-section');
        document.getElementById('body-tag').classList.add('fail-bg');
    }

    function showState(id) {
        document.getElementById('upload-section').classList.add('hidden');
        document.getElementById('success-section').classList.add('hidden');
        document.getElementById('fail-section').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    function resetPage() {
        document.getElementById('body-tag').classList.remove('success-bg', 'fail-bg');
        showState('upload-section');
        document.getElementById('upload-btn').disabled = false;
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('file-input').value = "";
        setRandomBackground(); // Ganti background lagi saat reset agar terasa dinamis
    }
</script>
</body>
</html>
