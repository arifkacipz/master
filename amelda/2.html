<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed View</title>
    <style>
        /* Mengatur halaman agar full screen tanpa margin */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Mencegah scrollbar ganda */
        }

        /* Mengatur iframe agar memenuhi layar */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* Menghilangkan garis bingkai */
            display: block; 
        }
    </style>
</head>
<body>

    <iframe 
        src="https://the.gandilova.com/amelda" 
        title="Embedded Content"
        allowfullscreen>
    </iframe>

</body>
</html>
