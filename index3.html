<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>date anu</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://zepeto.club/ico.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #007bff; /* Warna border */
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .links-grid {
            display: flex;
            flex-wrap: wrap; /* Memungkinkan item untuk pindah ke baris berikutnya */
            justify-content: space-between; /* Memberikan ruang antar kolom */
            gap: 15px; /* Jarak antara tombol */
        }
        .link-button {
            flex: 1 1 calc(50% - 10px); /* Membuat setiap tombol menempati sekitar 50% lebar kontainer dengan sedikit ruang */
            max-width: calc(50% - 10px); /* Batasi lebar maksimum */
            padding: 15px 20px;
            background-color: #007bff; /* Warna tombol utama */
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.2);
            box-sizing: border-box; /* Pastikan padding dan border termasuk dalam lebar */
        }
        .link-button:hover {
            background-color: #0056b3; /* Warna hover tombol */
        }

        /* Untuk layar yang lebih kecil, jadikan 1 kolom */
        @media (max-width: 600px) {
            .links-grid {
                flex-direction: column;
                align-items: center;
            }
            .link-button {
                width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="links-grid">
            <a href="https://medium.com/" target="_blank" class="link-button">medium</a>
            <a href="https://docs.google.com/spreadsheets/d/1yd4_jgTR9qCe1k-2P0VUAdS7G0s7WnJ8soz3KnsuqLA/edit" target="_blank" class="link-button">date</a>
            <a href="https://drive.google.com/drive/folders/16fhTIy3PfPV1uo5AGsKhb9hCTAm5qaWN" target="_blank" class="link-button">artikel</a>
            <a href="/negg.txt" target="_blank" class="link-button">negative</a>
            <a href="https://docs.google.com/spreadsheets/d/1tUYfQahWGZTbaYeegXsovqfhtKIWDGMW/edit?gid=1274556956#gid=1274556956&range=F27" target="_blank" class="link-button">publish</a>
            <a href="https://gmail.com" target="_blank" class="link-button">gmail</a>
            <a href="/artik/1/" target="_blank" class="link-button">1</a>
            <a href="/artik/1/" target="_blank" class="link-button">1</a>
            <a href="/artik/2/" target="_blank" class="link-button">2</a>
            <a href="/artik/3/" target="_blank" class="link-button">3</a>
            <a href="/artik/4/" target="_blank" class="link-button">4</a>
            <a href="#" target="_blank" class="link-button">...</a>
        </div>
    </div>
</body>
</html>
