<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missing Chapters - PetoMic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Toast notification */
        .toast-notify {
            transition: opacity 0.3s ease-in-out;
        }
        /* Horizontal scroll untuk missing chapters */
        .missing-horizontal-scroll {
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #9333ea #1a1a1a;
            max-width: 350px; /* Diperbesar untuk menampung lebih banyak chapter */
        }
        .missing-horizontal-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .missing-horizontal-scroll::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }
        .missing-horizontal-scroll::-webkit-scrollbar-thumb {
            background: #9333ea;
            border-radius: 10px;
        }
        .badge-container {
            display: inline-flex;
            gap: 4px;
            padding: 2px 0;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        /* Fix untuk tombol copy di posisi tetap */
        .slug-wrapper {
            display: flex;
            align-items: flex-start; /* Ubah dari center ke flex-start agar teks bisa wrap ke atas */
            justify-content: space-between;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; /* Sedikit lebih besar untuk tampilan wrap */
            padding: 8px 8px 8px 12px;
            min-width: 180px;
            gap: 8px;
        }
        .slug-text {
            font-family: monospace;
            font-size: 0.75rem;
            color: #c084fc;
            word-break: break-all; /* Membuat slug bisa wrap ke baris berikutnya */
            white-space: normal; /* Mengizinkan wrap */
            line-height: 1.4;
            flex: 1;
        }
        .copy-btn {
            background: white;
            color: black;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 9999px;
            text-transform: uppercase;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
            align-self: center; /* Tetap di tengah vertikal */
        }
        .copy-btn:hover {
            background: #9333ea;
            color: white;
        }
        /* Pastikan judul komik tidak ikut scroll horizontal */
        .judul-cell {
            min-width: 180px;
            white-space: normal;
            word-break: break-word;
        }
        /* Responsif untuk mobile */
        @media (max-width: 640px) {
            .judul-cell {
                min-width: 120px;
            }
            .slug-wrapper {
                min-width: 140px;
            }
            .missing-horizontal-scroll {
                max-width: 200px;
            }
        }
        /* Sticky header tabel */
        th {
            position: sticky;
            top: 0;
            background: #18181b;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <!-- Header dengan BACK dan HOME -->
    <header class="sticky top-0 z-50 bg-zinc-900/80 backdrop-blur-lg border-b border-white/5 p-4">
        <div class="container mx-auto max-w-6xl flex justify-between items-center">
            <div class="flex items-center gap-4">
                <!-- Tombol BACK -->
                <button onclick="history.back()" class="text-[10px] font-black text-zinc-500 hover:text-white transition uppercase tracking-[0.2em] flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    BACK
                </button>
                <!-- Tombol HOME -->
                <a href="https://zepeto.club/asn/" class="text-[10px] font-black text-zinc-500 hover:text-white transition uppercase tracking-[0.2em] flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    HOME
                </a>
            </div>
            <div class="text-sm bg-white/20 px-3 py-1 rounded-full flex items-center gap-1" id="timestamp">
                <span>Memuat...</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-6xl">
        <div id="content" class="bg-zinc-900 rounded-3xl shadow-2xl border border-white/5 overflow-hidden">
            <div class="p-5 bg-zinc-900/50 text-sm font-black uppercase text-zinc-500 tracking-widest border-b border-white/5 flex justify-between items-center">
                <span>Daftar Komik dengan Chapter Hilang</span>
                <span id="total-count" class="text-purple-500">0</span>
            </div>
            <div class="p-5" id="table-container">
                <!-- Loading spinner -->
                <div class="flex justify-center items-center py-20">
                    <svg class="animate-spin h-8 w-8 text-purple-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center text-[10px] text-zinc-600 uppercase tracking-wider">
            <span>PetoMic • Data diperbarui secara otomatis</span>
        </div>
    </main>

    <script>
        function copyWithNotification(slug, buttonElement) {
            navigator.clipboard.writeText(slug).then(() => {
                const toast = document.createElement('span');
                toast.className = 'absolute -top-8 right-0 bg-green-600 text-white text-xs px-2 py-1 rounded opacity-0 toast-notify pointer-events-none';
                toast.innerText = 'Tersalin!';
                const parent = buttonElement.closest('.relative') || buttonElement.parentElement;
                if (!parent.classList.contains('relative')) {
                    parent.classList.add('relative');
                }
                parent.appendChild(toast);
                setTimeout(() => toast.classList.add('opacity-100'), 10);
                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            }).catch(err => {
                console.error('Gagal menyalin:', err);
            });
        }

        async function loadMissingData() {
            const timestampSpan = document.getElementById('timestamp');
            const totalCountSpan = document.getElementById('total-count');
            const tableContainer = document.getElementById('table-container');

            try {
                const response = await fetch('missing.json');
                if (!response.ok) throw new Error(`Gagal memuat missing.json (${response.status})`);
                const missingList = await response.json();

                const now = new Date();
                timestampSpan.innerHTML = `<span>${now.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })}</span>`;

                if (!Array.isArray(missingList) || missingList.length === 0) {
                    tableContainer.innerHTML = `
                        <div class="text-center py-20 text-zinc-500">
                            <svg class="w-16 h-16 mx-auto mb-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p class="text-xl font-bold">Tidak ada chapter missing!</p>
                            <p class="text-sm">Semua komik dalam keadaan lengkap.</p>
                        </div>
                    `;
                    totalCountSpan.innerText = '0';
                    return;
                }

                totalCountSpan.innerText = missingList.length;

                const enhancedList = await Promise.all(missingList.map(async (item) => {
                    const slug = item.slug;
                    let judul = item.judul || slug;
                    let thumb = item.thumb || 'https://via.placeholder.com/50x70?text=No+Image';

                    if (!item.judul || !item.thumb) {
                        try {
                            const dbRes = await fetch(`db/${slug}.json`);
                            if (dbRes.ok) {
                                const dbData = await dbRes.json();
                                judul = dbData.judul || judul;
                                thumb = dbData.thumb || thumb;
                            }
                        } catch (e) {}
                    }

                    return { ...item, judul, thumb };
                }));

                let tableHtml = `
                    <div class="table-wrapper">
                        <table class="w-full text-sm">
                            <thead class="text-left text-zinc-400 border-b border-white/5">
                                <tr>
                                    <th class="pb-3 font-medium">Judul Komik</th>
                                    <th class="pb-3 font-medium">Slug</th>
                                    <th class="pb-3 font-medium text-center">Online</th>
                                    <th class="pb-3 font-medium text-center">Downloaded</th>
                                    <th class="pb-3 font-medium">Missing Chapters</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-white/5">
                `;

                enhancedList.forEach((item) => {
                    const badges = item.missing && item.missing.length > 0
                        ? item.missing.map(ch => `<span class="bg-orange-600 text-white text-xs px-2 py-1 rounded-full whitespace-nowrap">${ch}</span>`).join('')
                        : '';

                    const missingHtml = item.missing && item.missing.length > 0
                        ? `<div class="missing-horizontal-scroll"><div class="badge-container">${badges}</div></div>`
                        : '<span class="text-zinc-500 text-xs">-</span>';

                    tableHtml += `
                        <tr class="hover:bg-white/5 transition">
                            <td class="py-3 pr-3">
                                <div class="flex items-center gap-3">
                                    <img src="${item.thumb}" alt="${item.judul}" class="w-10 h-14 object-cover rounded-lg border border-white/10 flex-shrink-0" onerror="this.src='https://via.placeholder.com/50x70?text=Error'">
                                    <span class="font-medium judul-cell">${item.judul}</span>
                                </div>
                            </td>
                            <td class="py-3 pr-3">
                                <div class="slug-wrapper">
                                    <span class="slug-text">${item.slug}</span>
                                    <button onclick="copyWithNotification('${item.slug}', this)" class="copy-btn">Copy</button>
                                </div>
                            </td>
                            <td class="py-3 pr-3 text-center">${item.total_online || 0}</td>
                            <td class="py-3 pr-3 text-center">${item.total_downloaded || 0}</td>
                            <td class="py-3">${missingHtml}</td>
                        </tr>
                    `;
                });

                tableHtml += `
                            </tbody>
                        </table>
                    </div>
                `;

                tableContainer.innerHTML = tableHtml;

            } catch (error) {
                console.error(error);
                tableContainer.innerHTML = `
                    <div class="text-center py-20 text-red-500">
                        <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <p class="text-xl font-bold">Gagal memuat data</p>
                        <p class="text-sm">${error.message}</p>
                    </div>
                `;
                timestampSpan.innerHTML = '<span>Error</span>';
                totalCountSpan.innerText = '0';
            }
        }

        window.addEventListener('DOMContentLoaded', loadMissingData);
    </script>
</body>
</html>
