<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail Manga</title>
    <style>
        /* styling sederhana */
        body { font-family: Arial, sans-serif; margin: 20px; }
        img.cover { max-width: 200px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .chapter-list a { display: block; padding: 4px 0; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const params = new URLSearchParams(location.search);
        const slug = params.get('slug');
        if (!slug) {
            document.getElementById('app').innerHTML = '<p>Manga tidak ditemukan.</p>';
        } else {
            // Ambil data dari db/
            fetch(`db/${slug[0].toLowerCase()}/${slug}.json`)
                .then(res => res.json())
                .then(data => {
                    const html = `
                        <h1>${data.judul}</h1>
                        <img class="cover" src="${data.thumb}" alt="${data.judul}">
                        <p><strong>Status:</strong> ${data.status} | <strong>Tipe:</strong> ${data.tipe}</p>
                        <p><strong>Genre:</strong> ${data.genre.join(', ')}</p>
                        <p><strong>Author:</strong> ${data.author}</p>
                        <p><strong>Sinopsis:</strong> ${data.sinopsis}</p>
                        <h2>Daftar Chapter (${data.chapterCount})</h2>
                        <div class="chapter-list">
                            ${data.chapters.map(ch => `
                                <a href="reader.html?manga=${slug}&chapter=${encodeURIComponent(ch.nama)}">
                                    ${ch.nama} - ${ch.tanggal_rilis}
                                </a>
                            `).join('')}
                        </div>
                    `;
                    document.getElementById('app').innerHTML = html;
                });
        }
    </script>
</body>
</html>
