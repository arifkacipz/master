<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komiku - Daftar Komik</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; }
        .card-body { padding: 10px; }
        .card h3 { margin: 0; font-size: 14px; }
        .card p { margin: 5px 0; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Daftar Komik</h1>
    <div id="grid" class="grid"></div>

    <script>
        fetch('list.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('grid');
                data.forEach(manga => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <a href="manga.html?slug=${manga.slug}">
                            <img src="${manga.thumb}" alt="${manga.judul}" loading="lazy">
                        </a>
                        <div class="card-body">
                            <a href="manga.html?slug=${manga.slug}"><h3>${manga.judul}</h3></a>
                            <p>${manga.tipe || ''} | Ch. ${manga.chapterCount}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
    </script>
</body>
</html>
