<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Kami - NUSA PACKING INDONESIA</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .page-header { background: linear-gradient(135deg, #023e8a, #0077b6); color: white; padding: 120px 0 60px; text-align: center; }
        .contact-section { padding: 60px 0; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
        .info-item { display: flex; gap: 15px; margin-bottom: 25px; align-items: flex-start; }
        .info-icon { background: var(--light-bg); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.2rem; flex-shrink: 0; }
        .info-text h4 { margin-bottom: 5px; }
        .map-container { margin-top: 30px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
        .contact-form form { background: var(--light-bg); padding: 35px; border-radius: var(--radius); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px; }
        .error-message { color: #dc2626; font-size: 0.85rem; margin-top: 4px; display: none; }
        .form-group.error input, .form-group.error textarea { border-color: #dc2626; }
        .form-group.error .error-message { display: block; }
        @media (max-width: 768px) { .contact-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="../" class="nav-logo">
                <i class="fa-solid fa-industry"></i> <span>NUSA PACKING INDONESIA</span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../" class="nav-link">Beranda</a></li>
                <li><a href="../katalog/" class="nav-link">Katalog</a></li>
                <li><a href="" class="nav-link active">Hubungi Kami</a></li>
            </ul>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <section class="page-header" id="contactHeader"></section>

    <section class="contact-section" id="contactContent"></section>

    <footer class="footer" id="footerKontak"></footer>

    <a href="https://wa.me/6281230586587" class="wa-float" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>

    <script src="../js/data.js"></script>
    <script src="../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Header
            document.getElementById('contactHeader').innerHTML = `
                <h1>${siteData.contactPage.title}</h1>
                <p>${siteData.contactPage.description}</p>`;

            // Konten
            document.getElementById('contactContent').innerHTML = `
                <div class="container contact-grid">
                    <div class="contact-info">
                        <h2>Informasi Kontak</h2>
                        <div class="info-item">
                            <div class="info-icon"><i class="fa-solid fa-location-dot"></i></div>
                            <div class="info-text"><h4>Alamat Pabrik & Kantor</h4><p>${siteData.contact.address}</p></div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="fa-solid fa-phone"></i></div>
                            <div class="info-text"><h4>Telepon</h4><p>${siteData.contact.phone} (Hunting)</p></div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="fa-brands fa-whatsapp"></i></div>
                            <div class="info-text"><h4>WhatsApp</h4><p>${siteData.contact.whatsapp} (Chat only)</p></div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="fa-solid fa-envelope"></i></div>
                            <div class="info-text"><h4>Email</h4><p>${siteData.contact.email}</p></div>
                        </div>
                        <div class="map-container">
                            <iframe src="${siteData.contactPage.mapEmbedUrl}" width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                        </div>
                    </div>
                    <div class="contact-form">
                        <h2>Kirim Pesan</h2>
                        <form id="contactForm" novalidate>
                            <div class="form-group">
                                <label for="name">Nama Lengkap</label>
                                <input type="text" id="name" placeholder="Nama Anda">
                                <div class="error-message">Nama wajib diisi</div>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" placeholder="email@perusahaan.com">
                                <div class="error-message">Email wajib diisi</div>
                            </div>
                            <div class="form-group">
                                <label for="wa">Nomor WhatsApp</label>
                                <input type="tel" id="wa" placeholder="0812-xxxx-xxxx">
                                <div class="error-message">Nomor WhatsApp wajib diisi</div>
                            </div>
                            <div class="form-group">
                                <label for="subject">Subjek</label>
                                <input type="text" id="subject" placeholder="Permintaan penawaran produk...">
                                <div class="error-message">Subjek wajib diisi</div>
                            </div>
                            <div class="form-group">
                                <label for="message">Pesan</label>
                                <textarea id="message" placeholder="Tulis detail kebutuhan Anda..."></textarea>
                                <div class="error-message">Pesan wajib diisi</div>
                            </div>
                            <button type="submit" class="btn btn-primary" id="submitBtn">Kirim Pesan <i class="fa-solid fa-paper-plane"></i></button>
                            <p id="formStatus" style="margin-top:15px;"></p>
                        </form>
                    </div>
                </div>`;

            // Footer
            document.getElementById('footerKontak').innerHTML = `
                <div class="container footer-grid">
                    <div class="footer-col footer-about">
                        <h4><i class="fa-solid fa-industry"></i> ${siteData.siteName}</h4>
                        <p>${siteData.footer.about}</p>
                        <div class="social-links">
                            <a href="${siteData.footer.social.whatsapp}"><i class="fa-brands fa-whatsapp"></i></a>
                            <a href="${siteData.footer.social.instagram}"><i class="fa-brands fa-instagram"></i></a>
                            <a href="${siteData.footer.social.facebook}"><i class="fa-brands fa-facebook"></i></a>
                            <a href="${siteData.footer.social.email}"><i class="fa-solid fa-envelope"></i></a>
                        </div>
                    </div>
                    <div class="footer-col">
                        <h4>Produk</h4>
                        <ul>${siteData.footer.products.map(p => `<li><a href="/katalog/">${p}</a></li>`).join('')}</ul>
                    </div>
                    <div class="footer-col">
                        <h4>Halaman</h4>
                        <ul>${siteData.footer.pages.map(p => `<li><a href="${p.url}">${p.name}</a></li>`).join('')}</ul>
                    </div>
                    <div class="footer-col footer-contact">
                        <h4>Kontak</h4>
                        <p><i class="fa-solid fa-location-dot"></i> ${siteData.contact.address}</p>
                        <p><i class="fa-solid fa-phone"></i> ${siteData.contact.phone}</p>
                        <p><i class="fa-solid fa-mobile-screen"></i> ${siteData.contact.whatsapp} (WA)</p>
                        <p><i class="fa-solid fa-envelope"></i> ${siteData.contact.email}</p>
                    </div>
                </div>
                <div class="footer-bottom">
                    <p>&copy; ${new Date().getFullYear()} ${siteData.siteName}. All Rights Reserved.</p>
                </div>`;
        });

        // --- Custom Validation & Submission ---
        const WORKER_URL = 'https://tele.uyuliven1.workers.dev/';

        function validateField(id) {
            const field = document.getElementById(id);
            const group = field.closest('.form-group');
            const value = field.value.trim();
            if (!value) {
                group.classList.add('error');
                return false;
            } else {
                group.classList.remove('error');
                return true;
            }
        }

        function validateAll() {
            const fields = ['name', 'email', 'wa', 'subject', 'message'];
            let allValid = true;
            fields.forEach(id => {
                if (!validateField(id)) allValid = false;
            });
            return allValid;
        }

        document.addEventListener('submit', async function(e) {
            if (e.target.id === 'contactForm') {
                e.preventDefault();
                const status = document.getElementById('formStatus');
                status.innerHTML = '';

                if (!validateAll()) {
                    status.innerHTML = '<span style="color:red;">Gagal mengirim. Periksa kembali.</span>';
                    return;
                }

                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = 'Mengirim...';
                status.innerHTML = '';

                const payload = {
                    name: document.getElementById('name').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    wa: document.getElementById('wa').value.trim(),
                    subject: document.getElementById('subject').value.trim(),
                    message: document.getElementById('message').value.trim()
                };

                try {
                    const response = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        alert('Pesan berhasil dikirim!');
                        location.reload();
                    } else {
                        // Coba baca error dari body
                        let errorMessage = 'Gagal mengirim pesan.';
                        try {
                            const errData = await response.json();
                            if (errData.error) {
                                errorMessage = errData.error;
                            }
                        } catch (parseError) {
                            // Jika bukan JSON, gunakan status text
                            errorMessage = `Error ${response.status}: ${response.statusText || 'Terjadi kesalahan'}`;
                        }
                        status.innerHTML = `<span style="color:red;">${errorMessage}</span>`;
                    }
                } catch (networkError) {
                    status.innerHTML = '<span style="color:red;">Gagal terhubung ke server. Periksa koneksi internet Anda.</span>';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Kirim Pesan <i class="fa-solid fa-paper-plane"></i>';
                }
            }
        });

        // Hapus error saat pengguna mengetik
        document.querySelectorAll('#contactForm input, #contactForm textarea').forEach(field => {
            field.addEventListener('input', function() {
                if (this.value.trim() !== '') {
                    this.closest('.form-group').classList.remove('error');
                }
            });
        });
    </script>
</body>
</html>
