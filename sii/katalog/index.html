<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk - PT Plastik Packindo Sejahtera</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ===== PAGE HEADER & FILTER (tidak berubah) ===== */
        .page-header {
            background: linear-gradient(135deg, #023e8a, #0077b6);
            color: white; padding: 120px 0 60px; text-align: center;
        }
        .search-filter { padding: 30px 0; background: var(--light-bg); }
        .filter-bar { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .search-box { position: relative; flex: 1; min-width: 250px; max-width: 400px; }
        .search-box input { width: 100%; padding: 12px 20px 12px 45px; border-radius: 50px; border: 1px solid var(--border); }
        .search-box i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .category-filters { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .filter-btn { padding: 10px 22px; border-radius: 50px; background: white; border: 1px solid var(--border); cursor: pointer; font-weight: 500; transition: var(--transition); }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 40px 0 60px; }
        .product-card { background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .product-img { 
            height: 200px; 
            background: linear-gradient(145deg, #e0f2fe, #bae6fd); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 3.5rem; color: var(--primary); 
            overflow: hidden;
            cursor: default;
        }
        /* Jika gambar bisa diklik */
        .product-img.clickable {
            cursor: pointer;
        }
        .product-img img { 
            width: 100%; height: 100%; object-fit: cover; 
            transition: transform 0.3s;
        }
        .product-img.clickable:hover img {
            transform: scale(1.05);
        }
        .product-info { padding: 20px; }
        .product-info h3 { margin-bottom: 8px; }
        .product-category { color: var(--primary); font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; }
        .product-desc { color: var(--text-light); margin-bottom: 15px; }
        .btn-small { padding: 10px 24px; font-size: 14px; }

        /* ===== LIGHTBOX STYLES ===== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            object-fit: contain;
        }
        .lightbox .close-btn {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 3rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
        }
        .lightbox .close-btn:hover {
            color: var(--accent);
        }
        .lightbox .caption {
            color: white;
            margin-top: 20px;
            font-size: 1.1rem;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="nav-logo">
                <i class="fa-solid fa-industry"></i> <span>PT PACKINDO SEJAHTERA</span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../index.html" class="nav-link">Beranda</a></li>
                <li><a href="index.html" class="nav-link active">Katalog</a></li>
                <li><a href="../kontak/index.html" class="nav-link">Hubungi Kami</a></li>
            </ul>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <!-- HEADER KATALOG -->
    <section class="page-header">
        <div class="container" id="catalogHeader"></div>
    </section>

    <!-- SEARCH & FILTER -->
    <section class="search-filter">
        <div class="container">
            <div class="filter-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Cari produk...">
                </div>
                <div class="category-filters" id="categoryFilters"></div>
            </div>
        </div>
    </section>

    <!-- GRID PRODUK -->
    <section class="container products-grid" id="productsGrid"></section>

    <!-- LIGHTBOX MODAL -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <img src="" alt="Gambar Produk" id="lightboxImg">
        <div class="caption" id="lightboxCaption"></div>
    </div>

    <!-- FOOTER -->
    <footer class="footer" id="footerKatalog"></footer>

    <!-- WA FLOAT -->
    <a href="https://wa.me/6281122228888" class="wa-float" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>

    <!-- SCRIPTS -->
    <script src="../js/data.js"></script>
    <script src="../js/script.js"></script>
    <script>
        // Fungsi Lightbox
        function openLightbox(imgSrc, productName) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxCaption = document.getElementById('lightboxCaption');
            
            lightboxImg.src = imgSrc;
            lightboxCaption.textContent = productName || '';
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // cegah scroll
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Tutup dengan tombol ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        // Render halaman
        document.addEventListener('DOMContentLoaded', () => {
            // Header
            document.getElementById('catalogHeader').innerHTML = `
                <h1>${siteData.catalogPage.title}</h1>
                <p>${siteData.catalogPage.description}</p>`;

            // Filter Buttons
            const filters = siteData.catalogPage.filterLabels;
            const values = siteData.catalogPage.filterValues;
            document.getElementById('categoryFilters').innerHTML = filters.map((label, i) =>
                `<button class="filter-btn ${i===0?'active':''}" data-filter="${values[i]}">${label}</button>`
            ).join('');

            // Produk
            const products = siteData.catalogPage.products;
            const grid = document.getElementById('productsGrid');

            function renderProducts(filter = 'all', search = '') {
                const searchLower = search.toLowerCase();
                const filtered = products.filter(p => {
                    const matchCat = filter === 'all' || p.category === filter;
                    const matchSearch = p.name.toLowerCase().includes(searchLower) || p.desc.toLowerCase().includes(searchLower);
                    return matchCat && matchSearch;
                });

                grid.innerHTML = filtered.map(p => {
                    // Jika ada gambar, gunakan <img> dan beri class clickable + onclick
                    if (p.image) {
                        return `
                        <div class="product-card">
                            <div class="product-img clickable" onclick="openLightbox('${p.image}', '${p.name.replace(/'/g, "\\'")}')">
                                <img src="${p.image}" alt="${p.name}">
                            </div>
                            <div class="product-info">
                                <div class="product-category">${p.category.toUpperCase()}</div>
                                <h3>${p.name}</h3>
                                <p class="product-desc">${p.desc}</p>
                                <a href="../kontak/index.html" class="btn btn-primary btn-small">Minta Penawaran</a>
                            </div>
                        </div>`;
                    } else {
                        // Tanpa gambar, tampilkan ikon (tidak bisa diklik)
                        return `
                        <div class="product-card">
                            <div class="product-img">
                                <i class="fa-solid ${p.icon}"></i>
                            </div>
                            <div class="product-info">
                                <div class="product-category">${p.category.toUpperCase()}</div>
                                <h3>${p.name}</h3>
                                <p class="product-desc">${p.desc}</p>
                                <a href="../kontak/index.html" class="btn btn-primary btn-small">Minta Penawaran</a>
                            </div>
                        </div>`;
                    }
                }).join('');
            }

            // Event Filter
            let activeFilter = 'all';
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeFilter = btn.dataset.filter;
                    renderProducts(activeFilter, document.getElementById('searchInput').value);
                });
            });

            // Event Search
            document.getElementById('searchInput').addEventListener('input', e => {
                renderProducts(activeFilter, e.target.value);
            });

            // Render awal
            renderProducts();

            // Footer
            document.getElementById('footerKatalog').innerHTML = `
                <div class="container footer-grid">
                    <div class="footer-col footer-about">
                        <h4><i class="fa-solid fa-industry"></i> ${siteData.siteName}</h4>
                        <p>${siteData.footer.about}</p>
                    </div>
                    <div class="footer-col">
                        <h4>Produk</h4>
                        <ul>${siteData.footer.products.map(p => `<li><a href="index.html">${p}</a></li>`).join('')}</ul>
                    </div>
                    <div class="footer-col footer-contact">
                        <h4>Kontak</h4>
                        <p><i class="fa-solid fa-phone"></i> ${siteData.contact.phone}</p>
                        <p><i class="fa-solid fa-envelope"></i> ${siteData.contact.email}</p>
                    </div>
                </div>
                <div class="footer-bottom"><p>&copy; ${new Date().getFullYear()} ${siteData.siteName}.</p></div>`;

            document.querySelector('.wa-float').href = siteData.waLink;
        });
    </script>
</body>
</html>
