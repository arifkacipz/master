<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigger GitHub Actions - PetoMic</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #e4e4e4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            display: block;
            margin-bottom: 6px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
            font-family: monospace;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #a78bfa;
        }
        button {
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background: #7c3aed;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            background: #2a2a2a;
            border-left: 4px solid #8b5cf6;
        }
        .status.error {
            border-left-color: #ef4444;
            background: #2a1f1f;
        }
        .status.success {
            border-left-color: #10b981;
            background: #1f2a24;
        }
        .small {
            font-size: 0.8rem;
            color: #888;
            margin-top: 16px;
            text-align: center;
        }
        a {
            color: #8b5cf6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .checkbox input {
            width: auto;
            margin-bottom: 0;
        }
        .hidden {
            display: none;
        }
        .info-note {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: -15px;
            margin-bottom: 20px;
        }
        .link-button {
            background: transparent;
            border: 1px solid #8b5cf6;
            color: #8b5cf6;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        .link-button:hover {
            background: #8b5cf6;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Trigger Workflow</h1>
        <p>Pilih workflow yang akan dijalankan.</p>

        <label for="token">GitHub Personal Access Token</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">

        <div class="checkbox">
            <input type="checkbox" id="rememberToken" checked>
            <label style="margin-bottom: 0;">Ingat token di browser (local storage)</label>
        </div>

        <label for="workflowSelect">Pilih Workflow</label>
        <select id="workflowSelect">
            <option value="update.yml">Update PetoMic Data (dengan slug)</option>
            <option value="full_scrape_scheduler.yml">Full Scrape Scheduler (otomatis)</option>
            <option value="multi.yml">Matrix Full Scrape (3 per run)</option>
        </select>

        <!-- Container untuk input slug (hanya untuk update.yml) -->
        <div id="slugContainer" class="hidden">
            <label for="slug">Target Slug (kosongkan untuk katalog)</label>
            <input type="text" id="slug" placeholder="contoh: virus-king">
        </div>

        <!-- Container untuk input multi.yml (auto + manual) -->
        <div id="multiInputs" class="hidden">
            <h3 class="text-sm font-bold mb-2">Mode Otomatis</h3>
            <label for="multiSource">Sumber Slug</label>
            <select id="multiSource">
                <option value="">Otomatis (stats → missing_fields → missing)</option>
                <option value="stats">Stats</option>
                <option value="missing_fields">Missing Fields</option>
                <option value="missing">Missing</option>
            </select>

            <label for="multiMaxChapters">Batas Total Chapter (opsional)</label>
            <select id="multiMaxChapters">
                <option value="">Tanpa batas</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="150">150</option>
            </select>

            <label for="multiCount">Jumlah Slug yang Dipilih</label>
            <select id="multiCount">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5" selected>5</option>
                <option value="10">10</option>
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
            </select>

            <div class="relative my-4">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-600"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-[#1e1e1e] px-2 text-gray-400">ATAU</span>
                </div>
            </div>

            <h3 class="text-sm font-bold mb-2">Mode Manual</h3>
            <label for="manualSlugs">Daftar Slug (pisah dengan koma atau baris baru, maksimal 20)</label>
            <textarea id="manualSlugs" placeholder="contoh: virus-king&#10;another-slug&#10;slug-3"></textarea>
            <div class="info-note">Jika diisi, mode otomatis diabaikan.</div>
        </div>

        <button id="triggerBtn" onclick="triggerWorkflow()">Jalankan Workflow</button>

        <div class="checkbox" style="margin-top: 10px;">
            <input type="checkbox" id="autoClear">
            <label style="margin-bottom: 0;">Hapus token dari memori setelah menjalankan</label>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="small">
            <p>Token memerlukan akses <strong>repo</strong> dan <strong>workflow</strong>.<br>
            <a href="https://github.com/settings/tokens/new?description=Trigger%20PetoMic&scopes=repo,workflow" target="_blank">Buat token baru</a></p>
            <p><button onclick="clearToken()" style="background: #444;">Hapus token tersimpan</button></p>
        </div>
    </div>

    <script>
        // ===== KONFIGURASI =====
        const OWNER = 'arifkacipz';      // Username GitHub Anda
        const REPO = 'master';           // Nama repositori
        const BRANCH = 'main';            // Branch default (main)
        // =======================

        window.onload = function() {
            const savedToken = localStorage.getItem('github_token');
            if (savedToken) {
                document.getElementById('token').value = savedToken;
            }
            toggleFields();
        };

        document.getElementById('workflowSelect').addEventListener('change', toggleFields);

        function toggleFields() {
            const workflow = document.getElementById('workflowSelect').value;
            const slugContainer = document.getElementById('slugContainer');
            const multiInputs = document.getElementById('multiInputs');

            // Sembunyikan semua
            slugContainer.classList.add('hidden');
            multiInputs.classList.add('hidden');

            if (workflow === 'update.yml') {
                slugContainer.classList.remove('hidden');
            } else if (workflow === 'multi.yml') {
                multiInputs.classList.remove('hidden');
            }
            // full_scrape_scheduler.yml tidak punya input tambahan
        }

        function clearToken() {
            localStorage.removeItem('github_token');
            document.getElementById('token').value = '';
            showStatus('Token dihapus dari penyimpanan', 'success');
        }

        async function triggerWorkflow() {
            const token = document.getElementById('token').value.trim();
            const workflow = document.getElementById('workflowSelect').value;
            const remember = document.getElementById('rememberToken').checked;
            const autoClear = document.getElementById('autoClear').checked;
            const btn = document.getElementById('triggerBtn');
            const statusDiv = document.getElementById('status');

            if (!token) {
                showStatus('Token tidak boleh kosong', 'error');
                return;
            }

            if (remember) {
                localStorage.setItem('github_token', token);
            } else {
                localStorage.removeItem('github_token');
            }

            // Bangun payload
            let payload = { ref: BRANCH };
            let inputs = {};

            if (workflow === 'update.yml') {
                const slug = document.getElementById('slug').value.trim();
                if (slug) {
                    inputs.target_slug = slug;
                }
            } else if (workflow === 'multi.yml') {
                // Ambil nilai manual slugs
                const manualSlugs = document.getElementById('manualSlugs').value.trim();
                if (manualSlugs) {
                    inputs.manual_slugs = manualSlugs;
                } else {
                    // Ambil nilai dari mode otomatis
                    const source = document.getElementById('multiSource').value;
                    const maxChapters = document.getElementById('multiMaxChapters').value;
                    const count = document.getElementById('multiCount').value;

                    if (source) inputs.source = source;
                    if (maxChapters) inputs.max_chapters = maxChapters;
                    if (count) inputs.count = count;
                }
            }

            if (Object.keys(inputs).length > 0) {
                payload.inputs = inputs;
            }

            const url = `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${workflow}/dispatches`;

            btn.disabled = true;
            btn.innerText = 'Memproses...';
            statusDiv.style.display = 'none';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.status === 204) {
                    const actionsUrl = `https://github.com/${OWNER}/${REPO}/actions`;
                    showStatus(`
                        ✅ Workflow berhasil dipicu! 
                        <br><br>
                        <a href="${actionsUrl}" target="_blank" class="link-button">🔗 Lihat Actions</a>
                    `, 'success');
                } else {
                    const error = await response.json();
                    let errorMsg = error.message || 'Unknown error';
                    if (response.status === 404) {
                        errorMsg = 'Workflow tidak ditemukan. Pastikan nama file benar dan sudah di-push ke branch ' + BRANCH;
                    } else if (response.status === 401) {
                        errorMsg = 'Token tidak valid atau kedaluwarsa.';
                    } else if (response.status === 403) {
                        errorMsg = 'Token tidak memiliki izin yang cukup (butuh scope workflow).';
                    }
                    showStatus(`❌ Gagal (${response.status}): ${errorMsg}`, 'error');
                }
            } catch (err) {
                showStatus(`❌ Error: ${err.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Jalankan Workflow';
                if (autoClear) {
                    document.getElementById('token').value = '';
                }
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message; // gunakan innerHTML untuk link
        }
    </script>
</body>
</html>
